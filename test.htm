<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Financial Portal - Pure Quote Engine</title>

    <!-- Google Handwriting Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Caveat:wght@600;700&display=swap" rel="stylesheet">

    <!-- SheetJS CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- html2canvas CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --navy-dark: #001526;
            --navy: #002b49;
            --blue: #0072ce;
            --sky: #00a3e0;
            --cyan: #38bdf8;
            --orange: #f37021;
            --mint: #00a86b;
            --card-bg: #03233c;
            --border: #0f4d7a;
            --text: #f0f7fd;
            --muted: #8bb4d6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--navy-dark); color: var(--text); padding: 8px; padding-bottom: 80px; display: flex; justify-content: center; }
        .main-wrapper { width: 100%; max-width: 580px; display: flex; flex-direction: column; gap: 10px; }

        /* 1. STICKY CRITERIA BAR */
        .sticky-criteria {
            position: sticky; top: 4px; z-index: 100;
            background: var(--card-bg); border: 2px solid var(--border); border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.7); overflow: hidden;
        }
        .crit-header {
            background: linear-gradient(135deg, var(--navy), var(--blue));
            padding: 8px 12px; display: flex; justify-content: space-between; align-items: center;
        }
        .crit-title { font-size: 14px; font-weight: 900; color: #fff; }
        .badge { font-size: 10px; padding: 2px 7px; border-radius: 4px; font-weight: 800; background: var(--mint); color: #fff; cursor: pointer; }

        .crit-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; padding: 8px; background: #021a2d;
        }
        .crit-box label { font-size: 9px; font-weight: 800; color: var(--muted); display: block; margin-bottom: 2px; }
        .crit-in { width: 100%; background: var(--card-bg); border: 1px solid var(--border); color: #fff; padding: 5px; border-radius: 4px; font-size: 11px; font-weight: bold; text-align: center; }

        /* 2. FILTER BOX (CATEGORY, BRAND, MODEL) */
        .filter-panel {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
            display: flex; flex-direction: column; gap: 6px;
        }
        .dropdown-grid {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
        }
        .drop-box label { font-size: 9px; font-weight: 800; color: var(--sky); display: block; margin-bottom: 2px; }
        .filter-select {
            width: 100%; background: #021a2d; border: 1px solid var(--border); color: #fff;
            padding: 6px 4px; border-radius: 4px; font-size: 11px; font-weight: bold; outline: none;
        }
        .search-row {
            display: flex; gap: 6px; align-items: center;
        }
        .search-in {
            flex: 1; padding: 6px 10px; background: #021a2d; border: 1px solid var(--border);
            color: #fff; border-radius: 4px; font-size: 12px; font-weight: bold; outline: none;
        }
        .btn-reset {
            background: #475569; color: #fff; border: none; padding: 6px 10px; border-radius: 4px;
            font-size: 10px; font-weight: 900; cursor: pointer;
        }

        /* 3. MODEL CARDS */
        .model-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; overflow: hidden; }
        .model-head {
            background: #042947; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;
        }
        .model-title-wrap { display: flex; flex-direction: column; gap: 2px; }
        .model-name { font-size: 13px; font-weight: 900; color: var(--orange); }
        .model-meta { font-size: 9px; color: var(--muted); font-weight: bold; }
        .model-price { font-size: 11px; font-weight: bold; color: var(--cyan); }
        
        .head-actions { display: flex; gap: 6px; align-items: center; }
        .btn-quote-head {
            background: var(--blue); color: #fff; border: none; padding: 4px 8px;
            border-radius: 4px; font-size: 10px; font-weight: 900; cursor: pointer;
        }

        .model-body { display: none; padding: 8px; background: #021626; border-top: 1px solid var(--border); }
        .param-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
        .param-box label { font-size: 9px; font-weight: bold; color: var(--muted); display: block; }
        .param-in { width: 100%; background: var(--card-bg); border: 1px solid var(--border); color: #fff; padding: 5px; border-radius: 4px; font-size: 11px; font-weight: bold; }

        .table-wrap { width: 100%; overflow-x: auto; margin-top: 6px; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; text-align: center; white-space: nowrap; }
        th { background: var(--navy); color: #fff; padding: 5px 3px; border: 1px solid var(--border); font-weight: 800; }
        td { padding: 5px 3px; border: 1px solid #083454; font-weight: 700; }

        /* 4. PURE MODAL STYLES */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0, 15, 28, 0.92); z-index: 999;
            justify-content: center; align-items: center; padding: 10px;
        }
        .modal-content {
            background: var(--card-bg); border: 2px solid var(--blue);
            border-radius: 8px; padding: 10px; max-width: 520px; width: 100%;
            max-height: 94vh; overflow-y: auto; text-align: center;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <!-- 1. STICKY CRITERIA -->
    <div class="sticky-criteria">
        <div class="crit-header">
            <span class="crit-title">⚡ GLOBAL CRITERIA</span>
            <span id="syncBadge" class="badge" onclick="loadData(true)">SYNCING...</span>
        </div>
        <div class="crit-grid">
            <div class="crit-box">
                <label>TYPE</label>
                <select class="crit-in" id="cType" onchange="debouncedUpdate()">
                    <option value="NEW" selected>NEW</option>
                    <option value="EMI CARD">EMI CARD</option>
                    <option value="VIRTUAL CARD">VIRTUAL</option>
                    <option value="W/O CARD">W/O CARD</option>
                </select>
            </div>
            <div class="crit-box">
                <label>APPROVED</label>
                <input type="number" class="crit-in" id="cApp" placeholder="Full" oninput="debouncedUpdate()">
            </div>
            <div class="crit-box">
                <label>MAX LTV%</label>
                <input type="number" class="crit-in" id="cLtv" value="100" oninput="debouncedUpdate()">
            </div>
            <div class="crit-box">
                <label>CAP (₹)</label>
                <input type="number" class="crit-in" id="cCap" placeholder="None" oninput="debouncedUpdate()">
            </div>
        </div>
    </div>

    <!-- 2. CATEGORY, BRAND & MODEL FILTER BAR -->
    <div class="filter-panel">
        <div class="dropdown-grid">
            <div class="drop-box">
                <label>📁 CATEGORY</label>
                <select id="selCategory" class="filter-select" onchange="onCategoryChange()">
                    <option value="">ALL CATEGORIES</option>
                </select>
            </div>
            <div class="drop-box">
                <label>🏷️ BRAND</label>
                <select id="selBrand" class="filter-select" onchange="onBrandChange()">
                    <option value="">ALL BRANDS</option>
                </select>
            </div>
            <div class="drop-box">
                <label>📱 MODEL SELECT</label>
                <select id="selModel" class="filter-select" onchange="onModelDropdownChange()">
                    <option value="">ALL MODELS</option>
                </select>
            </div>
        </div>
        <div class="search-row">
            <input type="text" id="searchIn" class="search-in" placeholder="🔍 Quick search model, brand or scheme (10/2)..." oninput="applyAllFilters()">
            <button class="btn-reset" onclick="resetAllFilters()">RESET</button>
        </div>
    </div>

    <!-- 3. MODEL CATALOG CONTAINER -->
    <div id="catalogList">
        <div style="text-align:center; padding:30px; color:var(--muted); font-size:12px;">Models load होत आहेत...</div>
    </div>
</div>

<!-- 📸 PURE QUOTE IMAGE PREVIEW MODAL -->
<div id="imageViewerModal" class="modal-overlay">
    <div class="modal-content">
        <img id="generatedQuoteImg" src="" alt="Customer Quote" style="width:100%; border-radius:4px; margin-bottom:8px; display:block; box-shadow:0 4px 15px rgba(0,0,0,0.5);">
        <button onclick="document.getElementById('imageViewerModal').style.display='none'" style="width:100%; background:#dc2626; color:white; border:none; padding:9px; border-radius:4px; font-weight:bold; font-size:12px; cursor:pointer;">
            CLOSE ✖
        </button>
    </div>
</div>

<script>
    const EXCEL_URL = "https://raw.githubusercontent.com/luckyjathar/testcalculator/main/master_data.xlsx";
    let catalog = [];
    let debounceTimer = null;
    let activeOpenIndex = null;

    function findVal(row, keys) {
        let foundKey = Object.keys(row).find(k => {
            let clean = k.toUpperCase().replace(/[\s\_\-\.]/g, '');
            return keys.some(exp => clean === exp.replace(/[\s\_\-\.]/g, ''));
        });
        return foundKey ? row[foundKey] : null;
    }

    async function loadData(force = false) {
        const badge = document.getElementById('syncBadge');
        badge.innerText = "LOADING...";
        try {
            let res = await fetch(EXCEL_URL + '?t=' + Date.now());
            let buf = await res.arrayBuffer();
            let wb = XLSX.read(new Uint8Array(buf), { type: 'array', dense: true });
            let sheet = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { raw: false, defval: "" });

            let map = new Map();
            sheet.forEach(r => {
                let name = String(findVal(r, ['MODEL', 'BRANDMODEL', 'ASSET']) || "").toUpperCase().trim();
                let mrp = parseFloat(findVal(r, ['MRP', 'PRICE', 'M.R.P'])) || 0;
                if (!name || name === "NON TIEUP" || mrp <= 0) return;

                let brand = String(findVal(r, ['BRAND', 'MAKE']) || "GENERAL").toUpperCase().trim();
                let category = String(findVal(r, ['CATEGORY', 'CAT', 'PRODUCT']) || "SMARTPHONE").toUpperCase().trim();

                let tenure = parseInt(findVal(r, ['TOTALTENURE', 'TENURE', 'TA'])) || 0;
                let adv = parseInt(findVal(r, ['ADVANCEEMI', 'ADV', 'ADVEMI'])) || 0;
                if (tenure === 0) {
                    let schemeText = String(findVal(r, ['SCHEME', 'SCHEMENAME']) || "");
                    let parts = schemeText.split(/[\/\_\-\s]+/);
                    if (parts.length >= 2) { tenure = parseInt(parts[0]) || 0; adv = parseInt(parts[1]) || 0; }
                }
                if (tenure <= 0) return;

                if (!map.has(name)) {
                    map.set(name, {
                        name: name,
                        brand: brand,
                        category: category,
                        mrp: mrp,
                        sysPrice: mrp,
                        invPrice: mrp,
                        schemes: []
                    });
                }
                map.get(name).schemes.push({
                    tenure: tenure,
                    adv: adv,
                    dbd: parseFloat(findVal(r, ['DBD', 'DBD%'])) || 0,
                    pf: parseInt(findVal(r, ['PF', 'PROCESSINGFEE'])) || 0,
                    roi: parseFloat(findVal(r, ['ROI', 'ROI%'])) || 0
                });
            });

            catalog = Array.from(map.values());
            badge.innerText = `READY (${catalog.length})`;
            populateDropdownFilters();
            renderCatalogList();
        } catch(e) {
            badge.innerText = "OFFLINE/ERR";
        }
    }

    function populateDropdownFilters() {
        const catSelect = document.getElementById('selCategory');
        let categories = Array.from(new Set(catalog.map(m => m.category))).sort();
        catSelect.innerHTML = `<option value="">ALL CATEGORIES (${categories.length})</option>` + 
            categories.map(c => `<option value="${c}">${c}</option>`).join('');

        populateBrands();
        populateModels();
    }

    function populateBrands() {
        const selCat = document.getElementById('selCategory').value;
        const brandSelect = document.getElementById('selBrand');
        let filtered = catalog;
        if (selCat) filtered = filtered.filter(m => m.category === selCat);

        let brands = Array.from(new Set(filtered.map(m => m.brand))).sort();
        brandSelect.innerHTML = `<option value="">ALL BRANDS (${brands.length})</option>` + 
            brands.map(b => `<option value="${b}">${b}</option>`).join('');

        populateModels();
    }

    function populateModels() {
        const selCat = document.getElementById('selCategory').value;
        const selBrand = document.getElementById('selBrand').value;
        const modelSelect = document.getElementById('selModel');

        let filtered = catalog;
        if (selCat) filtered = filtered.filter(m => m.category === selCat);
        if (selBrand) filtered = filtered.filter(m => m.brand === selBrand);

        modelSelect.innerHTML = `<option value="">ALL MODELS (${filtered.length})</option>` + 
            filtered.map(m => `<option value="${m.name}">${m.name}</option>`).join('');
    }

    function onCategoryChange() {
        populateBrands();
        applyAllFilters();
    }

    function onBrandChange() {
        populateModels();
        applyAllFilters();
    }

    function onModelDropdownChange() {
        applyAllFilters();
    }

    function resetAllFilters() {
        document.getElementById('selCategory').value = "";
        document.getElementById('searchIn').value = "";
        populateBrands();
        populateModels();
        applyAllFilters();
    }

    function applyAllFilters() {
        const selCat = document.getElementById('selCategory').value;
        const selBrand = document.getElementById('selBrand').value;
        const selModel = document.getElementById('selModel').value;
        const rawSearch = document.getElementById('searchIn').value.trim().toUpperCase();
        const searchTerms = rawSearch ? rawSearch.split(/\s+/).filter(t => t.length > 0) : [];

        let matchCount = 0;

        catalog.forEach((m, idx) => {
            let el = document.getElementById(`mcard_${idx}`);
            if (!el) return;

            let isCategoryMatch = !selCat || m.category === selCat;
            let isBrandMatch = !selBrand || m.brand === selBrand;
            let isModelMatch = !selModel || m.name === selModel;

            let isSearchMatch = true;
            if (searchTerms.length > 0) {
                let modelText = `${m.name} ${m.brand} ${m.category} ${m.mrp}`.toUpperCase();
                let schemesText = m.schemes.map(s => `${s.tenure}/${s.adv}`).join(" ");
                let fullData = `${modelText} ${schemesText}`;
                isSearchMatch = searchTerms.every(term => fullData.includes(term));
            }

            if (isCategoryMatch && isBrandMatch && isModelMatch && isSearchMatch) {
                el.style.display = 'block';
                matchCount++;
            } else {
                el.style.display = 'none';
            }
        });

        const listContainer = document.getElementById('catalogList');
        let noResultEl = document.getElementById('noSearchMsg');
        if (matchCount === 0) {
            if (!noResultEl) {
                noResultEl = document.createElement('div');
                noResultEl.id = 'noSearchMsg';
                noResultEl.style.cssText = 'text-align:center; padding:20px; color:#f87171; font-size:12px; font-weight:bold;';
                listContainer.appendChild(noResultEl);
            }
            noResultEl.innerText = `निवडलेल्या फिल्टरनुसार कोणतेही मॉडेल सापडले नाही.`;
            noResultEl.style.display = 'block';
        } else if (noResultEl) {
            noResultEl.style.display = 'none';
        }
    }

    function renderCatalogList() {
        const list = document.getElementById('catalogList');
        list.innerHTML = catalog.map((m, idx) => `
            <div class="model-card" id="mcard_${idx}">
                <div class="model-head" onclick="toggleModel(${idx})">
                    <div class="model-title-wrap">
                        <span class="model-name">📱 ${m.name}</span>
                        <span class="model-meta">${m.category} | ${m.brand}</span>
                    </div>
                    <div class="head-actions" onclick="event.stopPropagation()">
                        <span class="model-price">₹${m.mrp.toLocaleString()}</span>
                        <button class="btn-quote-head" onclick="generateQuoteForModel(${idx})">📸 QUOTE</button>
                    </div>
                </div>
                <div class="model-body" id="mbody_${idx}"></div>
            </div>
        `).join('');
    }

    function toggleModel(idx) {
        const body = document.getElementById(`mbody_${idx}`);
        if (body.style.display === 'block') {
            body.style.display = 'none';
            activeOpenIndex = null;
            return;
        }

        if (activeOpenIndex !== null && activeOpenIndex !== idx) {
            let prev = document.getElementById(`mbody_${activeOpenIndex}`);
            if (prev) prev.style.display = 'none';
        }

        activeOpenIndex = idx;
        body.style.display = 'block';
        renderModelDetails(idx);
    }

    function renderModelDetails(idx) {
        let m = catalog[idx];
        const body = document.getElementById(`mbody_${idx}`);

        body.innerHTML = `
            <div class="param-row">
                <div class="param-box">
                    <label style="color:var(--cyan);">SYSTEM MRP (₹)</label>
                    <input type="number" class="param-in" value="${m.sysPrice}" oninput="updatePrice(${idx}, 'sysPrice', this.value)">
                </div>
                <div class="param-box">
                    <label style="color:var(--orange);">INVOICE VALUE (₹)</label>
                    <input type="number" class="param-in" value="${m.invPrice}" oninput="updatePrice(${idx}, 'invPrice', this.value)">
                </div>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>SCHEME</th>
                            <th>LOAN</th>
                            <th>DP</th>
                            <th>EMI</th>
                            <th>M</th>
                            <th>DAY</th>
                        </tr>
                    </thead>
                    <tbody id="tbl_${idx}"></tbody>
                </table>
            </div>
        `;
        calcSchemesTable(idx);
    }

    function calcSchemesTable(idx) {
        let m = catalog[idx];
        const tbody = document.getElementById(`tbl_${idx}`);
        if (!tbody) return;

        let rows = getCalculatedRowsForModel(m);

        tbody.innerHTML = rows.map((r) => `
            <tr>
                <td style="color:var(--sky); font-weight:bold;">${r.tenure}/${r.adv}</td>
                <td style="color:#34d399;">₹${Math.round(r.loan).toLocaleString()}</td>
                <td style="color:var(--orange); font-weight:bold;">₹${r.dp.toLocaleString()}</td>
                <td style="color:var(--cyan); font-weight:bold;">₹${r.emi.toLocaleString()}</td>
                <td>${r.inst}M</td>
                <td style="color:#fb923c;">₹${r.perDay.toLocaleString()}</td>
            </tr>
        `).join('') || `<tr><td colspan="6" style="color:#f87171; padding:6px;">No eligible schemes.</td></tr>`;
    }

    function getCalculatedRowsForModel(m) {
        let custType = document.getElementById('cType').value;
        let app = parseFloat(document.getElementById('cApp').value) || 0;
        let ltv = Math.min(100, Math.max(0, parseFloat(document.getElementById('cLtv').value) || 100));
        let cap = parseFloat(document.getElementById('cCap').value) || 0;

        let basePrice = Math.min(m.invPrice, m.sysPrice);
        let extraGap = (m.invPrice > m.sysPrice) ? (m.invPrice - m.sysPrice) : 0;
        let loginFee = (custType === 'EMI CARD' || custType === 'VIRTUAL CARD') ? 270 : (custType === 'W/O CARD' ? 320 : 850);

        return m.schemes.filter(s => ((s.tenure - s.adv) / s.tenure) * 100 <= ltv).map(s => {
            let inst = s.tenure - s.adv || 1;
            let loan = basePrice;
            if (app > 0) loan = Math.min(loan, (app * s.tenure) / inst);
            
            let minLoan = basePrice * 0.50;
            if (loan < minLoan) loan = minLoan;

            let dbdRs = Math.round(loan * (s.dbd * 1.18 / 100));
            let baseEmi = loan / s.tenure;
            let finalEmi = Math.round(baseEmi < 850 ? 850 : baseEmi);

            if (cap > 0 && finalEmi > cap) {
                loan = cap / (1 / s.tenure);
                if (loan < minLoan) loan = minLoan;
                loan = Math.min(basePrice, Math.max(0, loan));
                baseEmi = loan / s.tenure;
                finalEmi = Math.round(baseEmi < 850 ? 850 : baseEmi);
                dbdRs = Math.round(loan * (s.dbd * 1.18 / 100));
            }

            let dp = Math.ceil((basePrice - loan + (baseEmi * s.adv) + dbdRs + s.pf + loginFee + extraGap) / 10) * 10;
            let perDay = Math.round(finalEmi / 30);

            return { tenure: s.tenure, adv: s.adv, loan, dp, emi: finalEmi, inst, perDay };
        }).sort((a,b) => a.dp - b.dp || a.emi - b.emi);
    }

    function updatePrice(idx, field, val) {
        catalog[idx][field] = parseFloat(val) || 0;
        calcSchemesTable(idx);
    }

    function debouncedUpdate() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            if (activeOpenIndex !== null) calcSchemesTable(activeOpenIndex);
        }, 200);
    }

    /* 📸 DIRECT COMPLETE QUOTE IMAGE GENERATOR (NO TRUNCATION) */
    function generateQuoteForModel(idx) {
        let m = catalog[idx];
        if (!m) return;

        let rows = getCalculatedRowsForModel(m);
        if (rows.length === 0) {
            alert("या मॉडेलसाठी कोणतीही स्कीम उपलब्ध नाही!");
            return;
        }

        let custType = document.getElementById('cType').value;
        let app = document.getElementById('cApp').value || "FULL LIMIT";
        let ltv = document.getElementById('cLtv').value || "100";
        let price = m.invPrice || m.sysPrice;

        let quoteDiv = document.createElement('div');
        quoteDiv.style.width = "480px";
        quoteDiv.style.padding = "20px";
        quoteDiv.style.background = "#ffffff";
        quoteDiv.style.color = "#1a365d";
        quoteDiv.style.fontFamily = "'Architects Daughter', 'Caveat', cursive, sans-serif";
        quoteDiv.style.position = "absolute";
        quoteDiv.style.top = "-9999px";
        quoteDiv.style.boxSizing = "border-box";

        quoteDiv.innerHTML = `
            <div style="border: 2px solid #1e3a8a; padding: 10px 14px; margin-bottom: 14px; background: #ffffff;">
                <div style="text-align: center; font-size: 22px; font-weight: bold; text-decoration: underline; color: #1e3a8a; margin-bottom: 6px;">
                    BAJAJ FINSERV LOAN OFFER
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: bold;">
                    <span>CUSTOMER: ${custType}</span>
                    <span>APPROVED: ${app === 'FULL LIMIT' ? app : '₹' + Number(app).toLocaleString()}</span>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: bold;">
                    <span>MAX LTV: ${ltv}%</span>
                    <span>INVOICE PRICE: ₹${Number(price).toLocaleString()}</span>
                </div>
            </div>

            <div style="font-size: 18px; font-weight: bold; color: #1e3a8a; margin-bottom: 10px; text-transform: uppercase;">
                📱 ${m.name} (${m.brand})
            </div>

            <table style="width: 100%; border-collapse: collapse; font-size: 15px; text-align: center; border: 2px solid #1e3a8a;">
                <thead>
                    <tr style="border-bottom: 2px solid #1e3a8a; background: #ffffff; color: #1e3a8a;">
                        <th style="padding: 6px; border-right: 1.5px solid #1e3a8a;">SCHEME</th>
                        <th style="padding: 6px; border-right: 1.5px solid #1e3a8a;">DOWN PAYMENT</th>
                        <th style="padding: 6px; border-right: 1.5px solid #1e3a8a;">MONTHLY EMI</th>
                        <th style="padding: 6px; border-right: 1.5px solid #1e3a8a;">MONTHS</th>
                        <th style="padding: 6px;">PER DAY</th>
                    </tr>
                </thead>
                <tbody>
                    ${rows.map(r => `
                        <tr style="border-bottom: 1.5px solid #1e3a8a; font-weight: bold; color: #1a365d;">
                            <td style="padding: 6px; border-right: 1.5px solid #1e3a8a;">${r.tenure}/${r.adv}</td>
                            <td style="padding: 6px; border-right: 1.5px solid #1e3a8a; text-align: right;">₹${r.dp.toLocaleString()}</td>
                            <td style="padding: 6px; border-right: 1.5px solid #1e3a8a; text-align: right;">₹${r.emi.toLocaleString()}</td>
                            <td style="padding: 6px; border-right: 1.5px solid #1e3a8a;">${r.inst}M</td>
                            <td style="padding: 6px; text-align: right;">₹${r.perDay.toLocaleString()}</td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
            <div style="margin-top: 10px; font-size: 12px; font-weight: bold; color: #475569; text-align: center;">
                * All processing and login fees included. Zero Hidden Charges.
            </div>
        `;

        document.body.appendChild(quoteDiv);

        setTimeout(() => {
            html2canvas(quoteDiv, { scale: 3, useCORS: true, backgroundColor: "#ffffff" }).then(canvas => {
                document.body.removeChild(quoteDiv);
                let imgData = canvas.toDataURL("image/png");
                document.getElementById('generatedQuoteImg').src = imgData;
                document.getElementById('imageViewerModal').style.display = 'flex';
            });
        }, 100);
    }

    window.onload = () => loadData(false);
</script>
</body>
</html>
