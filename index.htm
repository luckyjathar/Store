<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Scheme Calculator (Mobile View)</title>
    <!-- आवश्यक लायब्ररीज (Excel आणि Image Copy साठी) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        /* Mobile / Portrait View Styling */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 10px; 
            background-color: #f0f2f5; 
            margin: 0 auto;
            max-width: 480px; /* Portrait View Limit */
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            position: relative;
        }

        h2, h3, h4 { margin-top: 0; color: #034887; margin-bottom: 12px; }
        
        input, select { 
            padding: 12px; 
            font-size: 14px; 
            box-sizing: border-box; 
            border: 2px solid #ddd; 
            border-radius: 6px; 
            outline: none;
            width: 100%;
            background: #fff;
            transition: 0.3s;
        }
        
        input:focus, select:focus { border-color: #0984e3; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .form-grid.full { grid-template-columns: 1fr; }
        
        .input-group { display: flex; flex-direction: column; gap: 4px; }
        .input-group label { font-size: 11px; font-weight: bold; color: #555; text-transform: uppercase; }

        /* सर्च रिझल्ट्स */
        #searchResults { 
            position: absolute; 
            top: 100%; 
            left: 0; 
            right: 0; 
            background: white; 
            max-height: 250px; 
            overflow-y: auto; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); 
            display: none; 
            z-index: 100; 
        }

        .result-item { 
            padding: 12px 15px; 
            border-bottom: 1px solid #eee; 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: bold; 
            color: #333; 
        }

        .result-item:hover { background: #e3f2fd; color: #0984e3; }

        #selectedProduct { 
            font-size: 18px; 
            font-weight: 900; 
            color: #034887; 
            display: none; 
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 10px;
            padding: 10px;
            background: #e3f2fd;
            border-radius: 8px;
        }

        /* टेबलची डिझाईन */
        .table-wrapper {
            overflow-x: auto; /* Horizontal scroll for mobile */
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .scheme-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px; /* Ensures table doesn't shrink too much */
        }

        .scheme-table th, .scheme-table td {
            padding: 10px 6px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        .scheme-table th { background: #034887; color: white; }
        .scheme-table tr:nth-child(even) { background: #f8fafc; }

        .btn-action {
            padding: 6px 10px;
            font-size: 11px;
            font-weight: bold;
            color: white;
            background: #0984e3;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-action:hover { background: #034887; }

        .btn-copy-img {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            background: #27ae60;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-copy-img:hover { background: #219653; }

        #loadingStatus {
            color: #e67e22;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .section-divider {
            border-top: 1px dashed #ccc;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <div id="loadingStatus">⏳ Loading Master Data... Please wait.</div>

    <!-- 1. सर्च बॉक्स -->
    <div class="card">
        <h2>🔍 Search Product</h2>
        <div style="position: relative;">
            <input type="text" id="searchInput" onkeyup="searchModel()" placeholder="Type model name here..." disabled>
            <div id="searchResults"></div>
        </div>
    </div>

    <!-- 2. Customer Eligibility -->
    <div class="card">
        <h3>👤 Customer Eligibility</h3>
        <div class="form-grid full">
            <div class="input-group">
                <label>Card Type *</label>
                <select id="custType" onchange="recalculateData()">
                    <option value="" selected disabled>-- Select Card Type --</option>
                    <option value="NEW">NEW</option>
                    <option value="EMI CARD">EMI CARD</option>
                    <option value="INSTA EMI CARD">INSTA EMI CARD</option>
                    <option value="W/O CARD">W/O CARD</option>
                </select>
            </div>
        </div>
        <div class="form-grid" style="margin-top: 10px;">
            <div class="input-group">
                <label>NBFC Limit (₹)</label>
                <input type="number" id="custLimit" placeholder="E.g. 50000" oninput="recalculateData()">
            </div>
            <div class="input-group">
                <label>Invoice Amt (₹)</label>
                <input type="number" id="custInvoice" placeholder="E.g. 35000" oninput="recalculateData()">
            </div>
            <div class="input-group">
                <label>Max LTV (%)</label>
                <input type="number" id="custLtv" value="100" oninput="recalculateData()">
            </div>
            <div class="input-group">
                <label>EMI Capping (₹)</label>
                <input type="number" id="custCap" placeholder="Max EMI" oninput="recalculateData()">
            </div>
        </div>

        <div class="section-divider"></div>

        <!-- 3. Advanced Inputs -->
        <h4 style="color: #e67e22; margin-bottom: 8px;">⚙️ Advanced Charges & Margin</h4>
        <div class="form-grid">
            <div class="input-group">
                <label>Target DP (₹)</label>
                <input type="number" id="advTarget" placeholder="0" oninput="recalculateData()">
            </div>
            <div class="input-group">
                <label>GTL (₹)</label>
                <input type="number" id="advGtl" placeholder="0" oninput="recalculateData()">
            </div>
            <div class="input-group">
                <label>RFC (₹)</label>
                <input type="number" id="advRfc" placeholder="0" oninput="recalculateData()">
            </div>
            <div class="input-group">
                <label>EXW (₹)</label>
                <input type="number" id="advExw" placeholder="0" oninput="recalculateData()">
            </div>
            <div class="input-group">
                <label>Margin (₹)</label>
                <input type="number" id="advMargin" placeholder="0" oninput="recalculateData()">
            </div>
            <div class="input-group">
                <label>Dealer Contri (₹)</label>
                <input type="number" id="advDealer" placeholder="0" oninput="recalculateData()">
            </div>
        </div>
    </div>

    <!-- 4. कॅल्क्युलेटेड स्कीम्स -->
    <div class="card" id="tableContainer" style="display: none;">
        <div id="selectedProduct"></div>
        <button class="btn-copy-img" onclick="copyImage()">🖼️ COPY IMAGE</button>
        
        <div class="table-wrapper">
            <table id="schemeTable" class="scheme-table">
                <thead>
                    <tr>
                        <th style="background:#0984e3;">T/A</th>
                        <th style="background:#2ecc71;">DP</th>
                        <th style="background:#0984e3;">EMI</th>
                        <th style="background:#e67e22;">DAILY</th>
                        <th style="background:#333;">ACT</th>
                    </tr>
                </thead>
                <tbody id="schemeBody">
                    <!-- डायनॅमिक डेटा इथे येईल -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let db_records = [];
        let currentSchemes = [];
        let activeModelName = "";
        const GITHUB_RAW_URL = "https://raw.githubusercontent.com/luckyjathar/testcalculator/main/master_data.xlsx";

        function findKey(row, targets) {
            let key = Object.keys(row).find(k => targets.includes(k.toUpperCase().replace(/\s/g, '')));
            return key ? row[key] : null;
        }

        async function loadExcelData() {
            try {
                let res = await fetch(GITHUB_RAW_URL + '?t=' + new Date().getTime());
                let dataBuffer = await res.arrayBuffer();
                let wb = XLSX.read(new Uint8Array(dataBuffer), { type: 'array' });
                let sheetData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
                
                db_records = sheetData.map(row => {
                    let model = findKey(row, ['MODEL', 'PRODUCT', 'MODELNAME']);
                    return { 
                        model: model ? String(model).trim().toUpperCase() : "",
                        tenure: parseInt(findKey(row, ['TOTALTENURE', 'TENURE', 'TA'])) || 0,
                        advEmi: parseInt(findKey(row, ['ADVANCEEMI', 'ADV'])) || 0,
                        dbd: parseFloat(findKey(row, ['DBD', 'DBD%'])) || 0,
                        roi: parseFloat(findKey(row, ['ROI', 'ROI%'])) || 0,
                        pf: parseInt(findKey(row, ['PF', 'PROCESSINGFEE'])) || 0,
                        fixedEmi: parseFloat(findKey(row, ['FIXEDEMI', 'FIXED'])) || 0
                    };
                }).filter(x => x.model !== "");
                
                document.getElementById('loadingStatus').style.display = 'none';
                document.getElementById('searchInput').disabled = false;
            } catch(err) {
                document.getElementById('loadingStatus').innerText = "⚠️ Error loading data. Please refresh.";
            }
        }

        function searchModel() {
            let q = document.getElementById('searchInput').value.toUpperCase().trim();
            let resultsDiv = document.getElementById('searchResults');
            if (!q) { resultsDiv.style.display = 'none'; return; }
            
            let matches = db_records.filter(r => r.model.includes(q)).map(r => r.model);
            matches = [...new Set(matches)].slice(0, 15); 
            
            if (matches.length === 0) {
                resultsDiv.innerHTML = '<div style="padding:15px; color:red; font-size: 13px; text-align:center;">No matching models found.</div>';
            } else {
                resultsDiv.innerHTML = matches.map(m => 
                    `<div class="result-item" onclick="selectModel('${m.replace(/'/g, "\\'")}')">📱 ${m}</div>`
                ).join('');
            }
            resultsDiv.style.display = 'block';
        }

        function selectModel(modelName) {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchResults').style.display = 'none';
            activeModelName = modelName;
            
            document.getElementById('selectedProduct').innerText = "📱 " + modelName;
            document.getElementById('selectedProduct').style.display = 'block';
            document.getElementById('tableContainer').style.display = 'block';
            
            recalculateData();
        }

        function recalculateData() {
            if (!activeModelName) return;

            let type = document.getElementById('custType').value;
            let limit = parseFloat(document.getElementById('custLimit').value) || 0;
            let inv = parseFloat(document.getElementById('custInvoice').value) || 0;
            let maxLtvLimit = parseFloat(document.getElementById('custLtv').value) || 100;
            let cap = parseFloat(document.getElementById('custCap').value) || 0;

            // Advanced Inputs
            let target = parseFloat(document.getElementById('advTarget').value) || 0;
            let gtl = parseFloat(document.getElementById('advGtl').value) || 0;
            let rfc = parseFloat(document.getElementById('advRfc').value) || 0;
            let exw = parseFloat(document.getElementById('advExw').value) || 0;
            let margin = parseFloat(document.getElementById('advMargin').value) || 0;
            let dealer = parseFloat(document.getElementById('advDealer').value) || 0;

            let fee = 0;
            if (type === 'EMI CARD') fee = 270;
            else if (type === 'INSTA EMI CARD') fee = 270; // Assuming same as EMI CARD
            else if (type === 'W/O CARD') fee = 320;
            else if (type === 'NEW') fee = 850;

            let insTotal = gtl + rfc + exw;

            let rawSchemes = db_records.filter(r => r.model === activeModelName);
            let processedSchemes = [];

            rawSchemes.forEach(s => {
                let loan = 0, emi = 0, dp = 0, inst = 0, currentTenure = s.tenure;
                let dbdRate = s.dbd * 1.18 / 100;
                let roiRate = s.roi / 1200;
                let roiRateDP = roiRate * s.advEmi;
                let totalFees = fee + margin + dealer + s.pf;
                let nbfcMaxL = limit > 0 ? (limit * s.tenure) / (s.tenure - s.advEmi || 1) : 999999;

                if (s.fixedEmi > 0) {
                    let maxTotalTenure = limit > 0 ? Math.floor(limit / s.fixedEmi) + s.advEmi : 99;
                    currentTenure = inv > 0 ? Math.floor(inv / s.fixedEmi) : s.tenure;
                    if (currentTenure > maxTotalTenure) currentTenure = maxTotalTenure;
                    if (currentTenure < 1) currentTenure = 1;
                    
                    loan = currentTenure * s.fixedEmi;
                    
                    if (target > 0) {
                        let numerator = target - inv - (s.fixedEmi * s.advEmi) - totalFees;
                        let denominator = dbdRate + roiRateDP - 1;
                        let solvedLoan = numerator / denominator;
                        let solvedTenure = Math.floor(solvedLoan / s.fixedEmi);
                        if (solvedTenure > maxTotalTenure) solvedTenure = maxTotalTenure;
                        loan = Math.max(0, solvedTenure * s.fixedEmi);
                        currentTenure = Math.floor(loan / s.fixedEmi) || 1;
                    }

                    if (inv > 0 && loan > inv) loan = Math.floor(inv / s.fixedEmi) * s.fixedEmi;
                    
                    inst = currentTenure - s.advEmi; if (inst < 1) inst = 1;
                    let roiInEmi = loan * roiRate;
                    emi = s.fixedEmi + (insTotal / inst) + roiInEmi;
                    
                    let roiInDp = loan * roiRateDP;
                    let dpExact = inv - loan + (s.fixedEmi * s.advEmi) + (loan * dbdRate) + totalFees + roiInDp;
                    dp = Math.ceil(dpExact / 10) * 10;
                } else {
                    loan = Math.min(nbfcMaxL, inv > 0 ? inv : 999999);
                    
                    if (target > 0 && inv > 0) {
                        let advRate = s.advEmi / s.tenure;
                        let numerator = target - inv - totalFees;
                        let denominator = advRate + dbdRate + roiRateDP - 1;
                        let solvedLoan = numerator / denominator;
                        loan = Math.min(loan, Math.max(0, Math.floor(solvedLoan)));
                    }

                    inst = s.tenure - s.advEmi; if (inst < 1) inst = 1;
                    let baseEmi = loan / s.tenure;
                    if (baseEmi > 0 && baseEmi < 900) baseEmi = 900;
                    
                    let roiInEmi = loan * roiRate;
                    emi = baseEmi + (insTotal / inst) + roiInEmi;
                    
                    if (cap > 0 && emi > cap) {
                        loan = (cap - (insTotal / inst)) / ((1 / s.tenure) + roiRate);
                        if (loan < 0) loan = 0;
                        if (inv > 0 && loan > inv) loan = inv;
                        baseEmi = loan / s.tenure;
                        if (baseEmi > 0 && baseEmi < 900) baseEmi = 900;
                        roiInEmi = loan * roiRate;
                        emi = baseEmi + (insTotal / inst) + roiInEmi;
                    }
                    
                    let roiInDp = loan * roiRateDP;
                    let dpExact = inv - loan + (baseEmi * s.advEmi) + (loan * dbdRate) + totalFees + roiInDp;
                    dp = Math.ceil(dpExact / 10) * 10;
                }

                let ltv = currentTenure > 0 ? ((currentTenure - s.advEmi) / currentTenure) * 100 : 0;
                let daily = emi / 30;

                if (ltv <= maxLtvLimit && loan > 0) {
                    processedSchemes.push({ ...s, loan, dp, emi, inst, daily, currentTenure, ltv });
                }
            });

            processedSchemes.sort((a, b) => b.ltv - a.ltv);
            currentSchemes = processedSchemes;
            renderTable();
        }

        function renderTable() {
            let tbody = document.getElementById('schemeBody');
            tbody.innerHTML = currentSchemes.map((s, index) => {
                let dpDisplay = s.dp > 0 ? `₹${Math.round(s.dp).toLocaleString()}` : "₹0";
                return `
                    <tr>
                        <td style="color: var(--indigo);">${s.currentTenure}/${s.advEmi}</td>
                        <td style="color: #27ae60;">${dpDisplay}</td>
                        <td style="color: #0984e3;">₹${Math.round(s.emi).toLocaleString()}<br><span style="font-size:10px; color:#555;">x ${s.inst} M</span></td>
                        <td style="color: #e67e22;">₹${Math.round(s.daily).toLocaleString()}</td>
                        <td><button class="btn-action" onclick="copyText(${index}, this)">COPY</button></td>
                    </tr>
                `;
            }).join('');
        }

        // टेक्स्ट कॉपी
        function copyText(index, btnElement) {
            let s = currentSchemes[index];
            let type = document.getElementById('custType').value || 'Not Selected';
            let limit = document.getElementById('custLimit').value || 0;
            let ltv = document.getElementById('custLtv').value || 100;
            let cap = document.getElementById('custCap').value || 0;
            let inv = document.getElementById('custInvoice').value || 0;

            let text = `📱 *${activeModelName}*\n\n`;
            text += `👤 *CUSTOMER ELIGIBILITY:*\n`;
            text += `*Card Type:* ${type}\n`;
            text += `*Limit:* ₹${parseFloat(limit).toLocaleString()}  |  *Max LTV:* ${ltv}%\n`;
            if(cap > 0) text += `*EMI Cap:* ₹${cap}\n`;
            if(inv > 0) text += `*Invoice:* ₹${parseFloat(inv).toLocaleString()}\n`;
            text += `------------------------\n`;
            text += `✅ *Scheme:* ${s.currentTenure}/${s.advEmi}\n`;
            text += `💰 *DP:* ₹${Math.round(s.dp).toLocaleString()}\n`;
            text += `🗓️ *EMI:* ₹${Math.round(s.emi).toLocaleString()} x ${s.inst} Months\n`;
            text += `✨ *Daily EMI:* ₹${Math.round(s.daily).toLocaleString()}`;

            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    let oldText = btnElement.innerText;
                    btnElement.innerText = "COPIED!";
                    btnElement.style.background = "#27ae60";
                    setTimeout(() => { btnElement.innerText = oldText; btnElement.style.background = "#0984e3"; }, 2000);
                });
            }
        }

        // इमेज कॉपी (क्लियर हेडर आणि एलिजिबिलिटी डिटेल्स सोबत)
        function copyImage() {
            if(currentSchemes.length === 0) return;
            
            let btn = document.querySelector('.btn-copy-img');
            let origText = btn.innerHTML;
            btn.innerHTML = "⏳ COPYING...";

            let type = document.getElementById('custType').value || 'Not Selected';
            let limit = document.getElementById('custLimit').value || 0;
            let ltv = document.getElementById('custLtv').value || 100;
            let cap = document.getElementById('custCap').value || 0;
            let inv = document.getElementById('custInvoice').value || 0;
            let displayName = document.getElementById('selectedProduct').innerText.replace('📱 ', '').trim() || activeModelName;

            let printDiv = document.createElement('div');
            printDiv.style.width = "750px";
            printDiv.style.position = "absolute";
            printDiv.style.left = "-9999px";
            printDiv.style.backgroundColor = "#ffffff";
            printDiv.style.fontFamily = "Arial, sans-serif";

            let trs = currentSchemes.map((s, i) => {
                let bgCol = i % 2 === 0 ? '#ffffff' : '#f8fafc';
                return `
                <tr style="background-color: ${bgCol};">
                    <td style="padding: 15px; font-size: 24px; font-weight: 900; color: #1e293b; border-bottom: 1px solid #e2e8f0;">${s.currentTenure} / ${s.advEmi}</td>
                    <td style="padding: 15px; font-size: 24px; font-weight: 900; color: #27ae60; border-bottom: 1px solid #e2e8f0;">₹${Math.round(s.dp).toLocaleString()}</td>
                    <td style="padding: 15px; font-size: 24px; font-weight: 900; color: #0984e3; border-bottom: 1px solid #e2e8f0;">₹${Math.round(s.emi).toLocaleString()}</td>
                    <td style="padding: 15px; font-size: 24px; font-weight: 900; color: #333333; border-bottom: 1px solid #e2e8f0;">${s.inst}</td>
                    <td style="padding: 15px; font-size: 24px; font-weight: 900; color: #e67e22; border-bottom: 1px solid #e2e8f0;">₹${Math.round(s.daily).toLocaleString()}</td>
                </tr>`;
            }).join('');

            printDiv.innerHTML = `
            <div style="padding: 20px; background-color: #ffffff;">
                <div style="border: 3px solid #034887; border-radius: 12px; overflow: hidden; background-color: #ffffff;">
                    
                    <!-- Top Blue Header -->
                    <div style="background-color: #034887; color: #ffffff; padding: 25px; text-align: center;">
                        <div style="font-size: 34px; font-weight: 900; margin: 0; padding-bottom: 15px; border-bottom: 1px dashed rgba(255,255,255,0.3);">📱 ${displayName.toUpperCase()}</div>
                        
                        <!-- Customer Eligibility Details in Image -->
                        <div style="display: flex; justify-content: space-evenly; flex-wrap: wrap; gap: 10px; margin-top: 15px; font-size: 18px; font-weight: bold; color: #e0f2fe;">
                            <span>TYPE: <span style="color:#f1c40f;">${type}</span></span>
                            <span>LIMIT: <span style="color:#2ecc71;">₹${parseFloat(limit).toLocaleString()}</span></span>
                            <span>LTV: <span style="color:#fff;">${ltv}%</span></span>
                            ${cap > 0 ? `<span>CAP: <span style="color:#e74c3c;">₹${cap}</span></span>` : ''}
                        </div>
                        ${inv > 0 ? `<div style="margin-top: 15px; font-size: 22px; font-weight: 900; background: rgba(255,255,255,0.1); padding: 8px; border-radius: 6px;">INVOICE AMOUNT: ₹${parseFloat(inv).toLocaleString()}</div>` : ''}
                    </div>

                    <!-- Scheme Table -->
                    <table style="width: 100%; border-collapse: collapse; text-align: center; background-color: #ffffff;">
                        <thead style="background-color: #034887; color: #ffffff;">
                            <tr>
                                <th style="padding: 18px 10px; font-size: 18px; font-weight: 900; border-bottom: 2px solid #022c54;">SCHEME<br><span style="font-size:14px; font-weight:normal;">(T / A)</span></th>
                                <th style="padding: 18px 10px; font-size: 18px; font-weight: 900; border-bottom: 2px solid #022c54;">NET&nbsp;DP</th>
                                <th style="padding: 18px 10px; font-size: 18px; font-weight: 900; border-bottom: 2px solid #022c54;">EMI</th>
                                <th style="padding: 18px 10px; font-size: 18px; font-weight: 900; border-bottom: 2px solid #022c54;">MONTHS</th>
                                <th style="padding: 18px 10px; font-size: 18px; font-weight: 900; border-bottom: 2px solid #022c54;">DAILY</th>
                            </tr>
                        </thead>
                        <tbody>${trs}</tbody>
                    </table>
                </div>
            </div>`;
            
            document.body.appendChild(printDiv);

            setTimeout(() => {
                html2canvas(printDiv, { scale: 2, useCORS: true, backgroundColor: "#ffffff" }).then(canvas => {
                    canvas.toBlob(blob => {
                        navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]).then(() => {
                            btn.innerHTML = "✅ COPIED";
                            setTimeout(() => { btn.innerHTML = origText; }, 2000);
                            document.body.removeChild(printDiv);
                        }).catch(err => {
                            btn.innerHTML = "⚠️ ERROR";
                            setTimeout(() => { btn.innerHTML = origText; }, 2000);
                            document.body.removeChild(printDiv);
                        });
                    }, "image/png");
                });
            }, 300);
        }

        window.onload = loadExcelData;
    </script>
</body>
</html>
