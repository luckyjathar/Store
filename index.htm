<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Matrix - Add Product</title>
    <style>
        :root { --primary: #0984e3; --bajaj-blue: #034887; --success: #2ecc71; --danger: #e74c3c; --warning: #f1c40f; --indigo: #1e3a8a; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; background-color: #f4f7f6; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 10000; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 95%; max-width: 500px; max-height: 90vh; overflow-y: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        
        .toast-notification { visibility: hidden; min-width: 250px; text-align: center; border-radius: 4px; padding: 15px; position: fixed; z-index: 100000; left: 50%; bottom: 30px; font-weight: bold; font-size: 16px; transform: translateX(-50%); }
        .toast-notification.show { visibility: visible; }
        .toast-notification.success { background-color: var(--success); color: white; }
        .toast-notification.error { background-color: var(--danger); color: white; }
        .toast-notification.warning { background-color: var(--warning); color: black; }
        
        input, select { padding: 10px; margin-bottom: 10px; width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; background: var(--primary); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

    <!-- Header -->
    <header style="display: flex; justify-content: space-between; align-items: center; background: var(--bajaj-blue); color: white; padding: 10px 20px; border-radius: 8px;">
        <h2 style="margin: 0;">Store Matrix</h2>
        <span id="gitStatusBadge">🔄 SYNCING...</span>
    </header>

    <div id="dataLoadingIndicator" style="display:none; padding:10px; text-align:center; font-weight: bold; margin-top: 10px;"></div>

    <!-- 1. Customer Requirement (Needed for Add Product to work) -->
    <div style="background: white; padding: 20px; border-radius: 8px; margin-top: 20px; border: 1px solid #ddd;">
        <h3 style="margin-top: 0;">Step 1: Set Customer Limit</h3>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="cqName" placeholder="Customer Name (Optional)" style="flex: 1;">
            <input type="number" id="cqLimit" placeholder="Enter NBFC Limit (₹)" style="flex: 1; border-color: var(--primary);">
            
            <input type="hidden" id="cqMobile" value="">
            <input type="hidden" id="cqLtv" value="100">
            <input type="hidden" id="cqType" value="NEW">
            <input type="hidden" id="cqCap" value="">
            
            <button onclick="addCustomerToQueue()" style="background: var(--success);">Start Session</button>
        </div>
    </div>

    <!-- 2. Just the Add Product Button -->
    <div id="unifiedHome" style="text-align: center; margin: 30px 0; background: white; padding: 30px; border-radius: 8px; border: 1px solid #ddd;">
        <button onclick="openAddProductModal()" style="font-size: 20px; padding: 15px 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            ➕ Add Product
        </button>
    </div>

    <!-- 3. Final Matrix Area (Where results appear) -->
    <div id="finalEligibleArea" style="display: none; margin-top: 20px;">
        <h3>Calculated Schemes</h3>
        <select id="finalCustomerSwitcher" onchange="switchCustomerFinal(this.value)" style="display:none;"></select>
        <div style="background: white; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #ddd; display: flex; gap: 15px;">
            <div>👤 <b id="infoName">-</b></div>
            <div>💰 Limit: <b id="infoLimit" style="color: var(--success);">-</b></div>
            <div>🚧 Cap: <b id="infoCap">-</b></div>
            <div><button onclick="openAddProductModal()" style="margin:0; padding: 5px 10px;">+ Add Another Product</button></div>
        </div>
        <div id="multiModelContainer"></div>
    </div>

    <!-- ALL REQUIRED MODALS (Kept hidden to prevent JS crashes) -->
    <div id="addProductModal" class="modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px;">
                <h3 style="margin: 0; color: var(--bajaj-blue);">🔍 Search Product</h3>
                <span onclick="document.getElementById('addProductModal').style.display='none'" style="cursor: pointer; color: var(--danger); font-weight: bold;">✖</span>
            </div>
            <input type="text" id="modalMatrixSearch" onkeyup="doSearch('modalMatrixSearch', 'modalMatrixSearchDropdown')" placeholder="Type model, brand or category...">
            <div id="modalMatrixSearchDropdown" style="display:none; border: 1px solid #ccc; max-height: 250px; overflow-y: auto; border-radius: 4px;"></div>
            <button onclick="quickNonTieup()" style="background: var(--indigo); width: 100%; margin-top:15px;">+ ADD NON TIE-UP</button>
        </div>
    </div>

    <div id="catSelectionModal" class="modal">
        <div class="modal-content">
            <h3 style="color: var(--indigo); border-bottom: 1px solid #eee; padding-bottom: 10px;">Select Category</h3>
            <div id="categoryGrid" style="display: grid; gap: 10px; grid-template-columns: 1fr 1fr; margin-bottom: 15px;"></div>
            <button onclick="document.getElementById('catSelectionModal').style.display='none'" style="background: var(--danger); width: 100%;">Close</button>
        </div>
    </div>

    <div id="componentsModal" class="modal">
        <div class="modal-content">
            <h3 style="color: var(--bajaj-blue); border-bottom: 1px solid #eee; padding-bottom: 10px;">Product Components</h3>
            <label>MRP:</label> <input type="number" id="compMrp" onchange="compMrpChanged()">
            <label>Invoice Amount:</label> <input type="number" id="compInv">
            <label>Target DP:</label> <input type="number" id="compTarget">
            <label>EMI Capping:</label> <input type="number" id="compCap">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div><label>GTL:</label> <input type="number" id="compGtl"></div>
                <div><label>RFC:</label> <select id="compRfc"><option id="compRfcOpt" value="0">0</option></select></div>
                <div><label>EXW:</label> <input type="number" id="compExw"></div>
                <div><label>Dealer Charge:</label> <input type="number" id="compDealer"></div>
            </div>
            <label>Margin Money:</label> <input type="number" id="compMargin">
            <button onclick="proceedToMatrixFromComponents()" style="width: 100%; font-size: 16px; margin-top: 10px;">✅ PROCEED</button>
        </div>
    </div>

    <div id="toastNotification" class="toast-notification"></div>
    <div id="updateNotificationBar" style="display:none;"></div>
    
    <div id="imageViewerModal" class="modal"><div class="modal-content" style="text-align:center;"><img id="generatedImage" style="max-width:100%;"><button onclick="closeImageViewer()">Close</button></div></div>
    <div id="manualModal" class="modal"><div class="modal-content"><input type="hidden" id="targetPIdx"><button onclick="closeManualModal()">Close</button></div></div>
    <div id="editSchemeModal" class="modal"><div class="modal-content"><input type="hidden" id="editPIdx"><input type="hidden" id="editDIdx"><button onclick="closeEditSchemeModal()">Close</button></div></div>
    <div id="quoteSelectionModal" class="modal"><div class="modal-content"><div id="quoteModelCheckboxes"></div></div></div>

    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- FULL JAVASCRIPT (WITH BUG FIX) -->
    <script>
        let toastTimeout;
        function showToast(message, type = 'success') {
            const toast = document.getElementById("toastNotification");
            if (!toast) return;
            toast.className = "toast-notification show " + type;
            toast.innerText = message;
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(function(){ toast.className = "toast-notification"; }, 3000);
        }

        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwWt4xbbEYWpSwtOSY1jqGJauljwPWojqfpxL4Bk2aRE8gJMpAzanAmNQ1OGNzKYHZfGg/exec";
        let loggedInUserEmail = localStorage.getItem('persistent_user_email') || "";
        let isSilentSyncing = false;

        function updateLoginUI(userName, isOnline) {
            let statusBadge = document.getElementById('gitStatusBadge');
            if(statusBadge) {
                if(isOnline) {
                    statusBadge.innerHTML = '🟢 (CLOUD SYNC ON)';
                    statusBadge.style.background = 'rgba(39, 174, 96, 0.15)';
                    statusBadge.style.color = 'var(--success)';
                } else {
                    statusBadge.innerHTML = '🔄 SYNCING...';
                }
            }
        }

        async function triggerSilentCloudSync() {
            if(!loggedInUserEmail || isSilentSyncing) return;
            try {
                isSilentSyncing = true;
                let compactQueue = customerQueue.map(c => { let cp = (c.products || []).map(p => { let { calculatedData, allSchemes, ...keepProduct } = p; return keepProduct; }); return { ...c, products: cp }; });
                await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ email: loggedInUserEmail, queue: compactQueue }) });
            } catch(err) {} finally { isSilentSyncing = false; }
        }

        window.isFestiveMode = false; let currentModalCategory = ""; let tempFgDealerId = ""; let tempFgDealerName = ""; let tempFgModel = ""; let tempFgBitly = ""; 

        function cleanPureShopName(raw) { if(!raw) return ""; return raw.split('#')[0].split('|')[0].split('(')[0].trim().toUpperCase(); }

        function isMobileDeviceCat(cat) { if (!cat) return false; let c = String(cat).toUpperCase().replace(/\s+/g, '').trim(); return c === 'PHONE(WEB-MOBILE)' || c === 'PHONE,TABLET,SMARTWATCH' || c.includes('TABLET,SMART') || c.includes('PHONE,TABLET') || c === 'SMARTPHONES' || c === 'MOBILE'; }
        function standardizeCategoryName(cat) { if (!cat) return "OTHER"; let c = String(cat).toUpperCase().trim(); let cNoSpace = c.replace(/\s+/g, ''); if (cNoSpace === 'PHONE(WEB-MOBILE)' || cNoSpace === 'PHONE,TABLET,SMARTWATCH' || cNoSpace.includes('TABLET,SMART') || cNoSpace.includes('PHONE,TABLET') || cNoSpace === 'SMARTPHONES' || cNoSpace === 'MOBILE') { return "PHONE(WEB-MOBILE)"; } if (cNoSpace === 'AIRCONDITIONERS' || cNoSpace === 'AIRCONDITIONER' || cNoSpace === 'AC') { return "AC"; } if (cNoSpace === 'BATTERIES' || cNoSpace === 'BATTERY') { return "BATTERY"; } if (cNoSpace === 'AIRCOOLERS' || cNoSpace === 'AIRCOOLER' || cNoSpace === 'COOLER') { return "AIR COOLER"; } if (cNoSpace === 'TELEVISIONS' || cNoSpace === 'TELEVISION' || cNoSpace === 'TV' || cNoSpace === 'LED' || cNoSpace === 'LEDTV') { return "LED TV"; } if (cNoSpace === 'WASHINGMACHINES' || cNoSpace === 'WASHINGMACHINE' || cNoSpace === 'WM') { return "WASHING MACHINE"; } if (cNoSpace === 'REFRIGERATORS' || cNoSpace === 'REFRIGERATOR' || cNoSpace === 'FRIDGE' || cNoSpace === 'REF') { return "REFRIGERATOR"; } if (cNoSpace === 'WATERPURIFIERS' || cNoSpace === 'WATERPURIFIER' || cNoSpace === 'RO') { return "WATER PURIFIER"; } return c; }
        function getRfcSlabValue(val) { let amount = parseFloat(val) || 0; if (amount < 8000) return 0; if (amount <= 10000) return 1109; if (amount <= 15000) return 1631; if (amount <= 20000) return 2147; if (amount <= 25000) return 2695; if (amount <= 30000) return 3215; if (amount <= 35000) return 3648; if (amount <= 40000) return 4219; if (amount <= 50000) return 5720; if (amount <= 60000) return 8686; if (amount <= 100000) return 11438; if (amount <= 200000) return 16677; return 0; }
        function getNonTieupPfValue(category, amount) { let cat = String(category || "").toUpperCase().replace(/\s+/g, '').trim(); let val = parseFloat(amount) || 0; if (cat.includes('DESKTOP') || cat.includes('LAPTOP')) { return 699; } if (cat === 'PHONE(WEB-MOBILE)' || cat.includes('PHONE') || cat.includes('TABLET') || cat.includes('WATCH') || cat.includes('PRINTER') || cat.includes('HEADPHONE') || cat === 'SMARTPHONES' || cat === 'MOBILE') { if (val <= 30000) return 499; if (val <= 50000) return 599; return 699; } return null; }

        const GITHUB_RAW_URL = "https://raw.githubusercontent.com/luckyjathar/testcalculator/main/master_data.xlsx";
        const DB_NAME = "PersistentPortalDB"; const DB_VERSION = 2; const STORE_NAME = "dataStore"; let dbInstance;

        function initDB() { return new Promise((resolve, reject) => { let request = indexedDB.open(DB_NAME, DB_VERSION); request.onupgradeneeded = function(e) { let db = e.target.result; if (!db.objectStoreNames.contains(STORE_NAME)) { db.createObjectStore(STORE_NAME); } }; request.onsuccess = function(e) { dbInstance = e.target.result; resolve(dbInstance); }; request.onerror = function(e) { reject(e); }; }); }
        function saveToDB(key, data) { return new Promise((resolve, reject) => { if (!dbInstance) return reject("DB not initialized"); try { let tx = dbInstance.transaction(STORE_NAME, 'readwrite'); let store = tx.objectStore(STORE_NAME); let req = store.put(JSON.stringify(data), key); req.onsuccess = () => resolve(); req.onerror = (e) => reject(e.target.error); } catch(e) { reject(e); } }); }
        function getFromDB(key) { return new Promise((resolve, reject) => { if (!dbInstance) return resolve(null); try { let tx = dbInstance.transaction(STORE_NAME, 'readonly'); let store = tx.objectStore(STORE_NAME); let req = store.get(key); req.onsuccess = (e) => { let res = e.target.result; if (res) { if (typeof res === 'string') resolve(JSON.parse(res)); else resolve(res); } else { resolve(null); } }; req.onerror = (e) => reject(e.target.error); } catch(e) { reject(e); } }); }

        let db_records = []; let dealer_records = []; let current_products = []; let sortConfigs = []; const SPECIAL_MODEL = "NON TIEUP"; let tempSheet1Data = []; let parsedSheet2Data = []; let customerQueue = []; let recycleBin = []; let activeCustomerIndex = -1; let selectedQueueIndex = -1; let tempPendingProduct = null; 
        let currentViewedModel = "";

        function parseExcelDate(val) { if (!val) return null; if (typeof val === 'number') { return new Date(Math.round((val - 25569) * 86400 * 1000)); } if (typeof val === 'string') { let d = new Date(val); if (!isNaN(d.getTime())) return d; let parts = val.split(/[\/\-\.]/); if (parts.length === 3) { let y = parts[2].length === 2 ? '20' + parts[2] : parts[2]; return new Date(y, parts[1] - 1, parts[0]); } } return null; }

        async function saveQueueToLocal(shouldCloudSync = true) { try { let compactQueue = customerQueue.map(c => { let cp = (c.products || []).map(p => { let { calculatedData, allSchemes, ...keepProduct } = p; return keepProduct; }); return { ...c, products: cp }; }); localStorage.setItem('persistent_queue_backup', JSON.stringify(compactQueue)); localStorage.setItem('persistent_active_idx_backup', activeCustomerIndex); await saveToDB('persistent_queue', compactQueue); await saveToDB('persistent_active_idx', activeCustomerIndex); if(shouldCloudSync && loggedInUserEmail) { triggerSilentCloudSync(); } } catch(e) { } }

        const CACHE_DURATION_MS = 12 * 60 * 60 * 1000; 

        async function fetchFromMasterStream(forceSync = false) {
            let statusBadge = document.getElementById('gitStatusBadge'); 
            let globalLoader = document.getElementById('dataLoadingIndicator');
            let searchInput1 = document.getElementById('modalMatrixSearch');

            if(globalLoader) { globalLoader.style.display = 'block'; globalLoader.innerHTML = '⏳ Checking Data...'; }
            if(searchInput1) { searchInput1.disabled = true; searchInput1.placeholder = "⏳ Please wait..."; }

            try {
                let now = new Date().getTime();
                if (!forceSync) {
                    let cachedTime = await getFromDB('master_data_time');
                    let cachedDbRecords = await getFromDB('cached_db_records');
                    if (cachedTime && cachedDbRecords && (now - cachedTime < CACHE_DURATION_MS)) {
                        db_records = cachedDbRecords;
                        if (activeCustomerIndex !== -1) { loadCurrentProducts(); renderMatrix(); }
                        if(statusBadge) { statusBadge.innerHTML = '⚡ LOADED'; }
                        if(globalLoader) globalLoader.style.display = 'none'; 
                        if(searchInput1) { searchInput1.disabled = false; searchInput1.placeholder = "Type model, brand or category..."; }
                        return;
                    }
                }

                if(globalLoader) globalLoader.innerHTML = '⏳ Downloading Master Data...';
                let cacheBusterUrl = GITHUB_RAW_URL + '?t=' + now; 
                let res = await fetch(cacheBusterUrl); 
                if (!res.ok) throw new Error("Data Error"); 
                let dataBuffer = await res.arrayBuffer(); 
                let wb = XLSX.read(new Uint8Array(dataBuffer), { type: 'array' });
                
                tempSheet1Data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { raw: false, defval: "" }); 
                parsedSheet2Data = wb.SheetNames.length > 1 ? XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[1]], { raw: false, defval: "" }).map(r => mapData(r, SPECIAL_MODEL)).filter(x => x && x.model) : [];
                
                let filteredSheet1 = tempSheet1Data.map(r => mapData(r, "REG")).filter(m => m && m.model); 
                let rawCombined = [...filteredSheet1, ...parsedSheet2Data]; 
                let uniqueDB = []; let seenDB = new Set();
                
                rawCombined.forEach(r => { 
                    let key = `${r.model}_${r.category}_${r.tenure}_${r.advEmi}_${r.fixedEmi}_${r.minLoan}_${r.maxLoan}`; 
                    if (!seenDB.has(key)) { seenDB.add(key); uniqueDB.push(r); } 
                });
                
                let today = new Date(); today.setHours(0,0,0,0);
                db_records = uniqueDB.filter(r => {
                    if(!r.expiryDateStr) return true;
                    let p = r.expiryDateStr.split('/');
                    if(p.length !== 3) return true;
                    let expD = new Date(p[2], p[1]-1, p[0]);
                    return expD >= today;
                });

                await saveToDB('cached_db_records', db_records);
                await saveToDB('master_data_time', now);

                if (activeCustomerIndex !== -1) { loadCurrentProducts(); renderMatrix(); }
                if(statusBadge) { statusBadge.innerHTML = '✅ LIVE DATA SYNCED'; }
                if(globalLoader) { globalLoader.style.display = 'none'; }
                if(searchInput1) { searchInput1.disabled = false; searchInput1.placeholder = "Type model, brand or category..."; }
            } catch(err) { 
                if(statusBadge) { statusBadge.innerHTML = '⚠️ NO DATA'; } 
                if(globalLoader) { globalLoader.innerHTML = '⚠️ Failed to Load Data!'; }
            }
        }

        window.onload = async function() {
            try {
                await initDB(); 
                let savedQ = await getFromDB('persistent_queue'); 
                if (!savedQ || savedQ.length === 0) { 
                    let lsQ = localStorage.getItem('persistent_queue_backup'); 
                    if (lsQ) savedQ = JSON.parse(lsQ); 
                }
                if (savedQ) { customerQueue = savedQ.map(c => ({ ...c, components: c.components || {}, products: c.products || [], sortConfigs: c.sortConfigs || [] })); }
                
                let savedIdx = await getFromDB('persistent_active_idx'); 
                if (savedIdx === null || savedIdx === undefined) { 
                    savedIdx = localStorage.getItem('persistent_active_idx_backup'); 
                }
                if (savedIdx !== null && savedIdx !== undefined) activeCustomerIndex = parseInt(savedIdx); 
                if(activeCustomerIndex >= customerQueue.length) activeCustomerIndex = -1;
                
                updateUniversalActionButtons();
                fetchFromMasterStream(); 
            } catch(e) { }
        };

        // === ERROR FIX APPLIED HERE ===
        function updateUniversalActionButtons() {
            let copyB = document.getElementById('uniCopyBtn'); 
            let selB = document.getElementById('uniSelectBtn'); 
            let editB = document.getElementById('uniEditBtn'); 
            let delB = document.getElementById('uniDeleteBtn'); 
            let invB = document.getElementById('uniInviteBtn');
            let isActive = (selectedQueueIndex !== -1 && customerQueue[selectedQueueIndex]);
            
            if (copyB) { copyB.style.opacity = isActive ? '1' : '0.5'; copyB.style.pointerEvents = isActive ? 'auto' : 'none'; }
            if (selB) { selB.style.opacity = isActive ? '1' : '0.5'; selB.style.pointerEvents = isActive ? 'auto' : 'none'; }
            if (editB) { editB.style.opacity = isActive ? '1' : '0.5'; editB.style.pointerEvents = isActive ? 'auto' : 'none'; }
            if (delB) { delB.style.opacity = isActive ? '1' : '0.5'; delB.style.pointerEvents = isActive ? 'auto' : 'none'; }
            if (invB) { invB.style.opacity = isActive ? '1' : '0.5'; invB.style.pointerEvents = isActive ? 'auto' : 'none'; }
        }

        async function addCustomerToQueue() {
            let name = document.getElementById('cqName').value.trim() || `Cust ${customerQueue.length + 1}`; 
            let limit = parseFloat(document.getElementById('cqLimit').value); 
            if(!limit || limit <= 0 || isNaN(limit)) { 
                showToast("⚠️ Kripya pehle valid NBFC LIMIT enter karein!", "error"); 
                return; 
            }
            
            let now = new Date(); 
            let ts = now.toLocaleDateString('en-GB') + ' ' + now.toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'});
            let newCustObj = { name: name, limit: limit, ltv: 100, type: 'NEW', cap: '', timestamp: ts, components: {}, products: [], sortConfigs: [] };
            
            customerQueue.unshift(newCustObj); 
            if (activeCustomerIndex !== -1) activeCustomerIndex++; 
            if (selectedQueueIndex !== -1) selectedQueueIndex++;
            activeCustomerIndex = 0; 
            
            await saveQueueToLocal(); 
            showToast("✅ Customer Ready! Atah 'Add Product' var click kara.", "success");
        }

        function isLimitValid() { if (activeCustomerIndex === -1 || !customerQueue[activeCustomerIndex]) { showToast("⚠️ Kripya pehle Customer Name aani Limit takun 'Start Session' var click kara.", "warning"); return false; } return true; }
        function openAddProductModal() { if (!isLimitValid()) return; document.getElementById('modalMatrixSearch').value = ''; document.getElementById('modalMatrixSearchDropdown').style.display = 'none'; document.getElementById('addProductModal').style.display = 'flex'; }
        function closeImageViewer() { document.getElementById('imageViewerModal').style.display='none'; }
        function closeManualModal() { document.getElementById('manualModal').style.display='none'; }
        function closeEditSchemeModal() { document.getElementById('editSchemeModal').style.display='none'; }

        function doSearch(id, ddId) {
            let q = document.getElementById(id).value.toUpperCase().trim(); let dd = document.getElementById(ddId); if(!q) { dd.style.display='none'; return; }
            let validRecords = db_records.filter(r => r.model !== SPECIAL_MODEL); let matches = validRecords.filter(r => { let m = r.model || ""; let b = r.brand || ""; let c = r.category || ""; return m.includes(q) || b.includes(q) || c.includes(q); }).map(r => r.model); matches = [...new Set(matches)].slice(0, 15);
            if (matches.length === 0) { dd.innerHTML = `<div style="padding:10px; color:#d35400; font-weight:bold; text-align:center;">No matching models found.</div>`; dd.style.display = 'block'; return; }
            dd.innerHTML = matches.map(m => { let rec = validRecords.find(x => x.model === m); let brandTag = rec && rec.brand ? `<span style="font-size:10px; color:#0984e3; font-weight:900; margin-right:5px;">[${rec.brand}]</span>` : ''; return `<div style="padding:10px; border-bottom:1px solid #eee; cursor:pointer; font-weight:800;" onclick="selectModel('${m.replace(/'/g, "\\'")}')">${brandTag}${m}</div>`; }).join(''); dd.style.display = 'block';
        }

        function selectModel(name) { if (!isLimitValid()) return; let raw = db_records.filter(r => r.model === name); let baseMrp = raw.find(s => s.mrp > 0)?.mrp || ""; let cat = raw[0]?.category || ""; tempPendingProduct = { name: name, isNT: false, category: cat }; currentModalCategory = cat; document.getElementById('modalMatrixSearchDropdown').style.display = 'none'; document.getElementById('modalMatrixSearch').value = ''; document.getElementById('addProductModal').style.display = 'none'; showComponentsModal(baseMrp); }
        function quickNonTieup() { if (!isLimitValid()) return; if(db_records.length === 0) { showToast("⚠️ Master database fetch me error hai!", "error"); return; } document.getElementById('addProductModal').style.display = 'none'; let tieup = db_records.filter(r => r.model === SPECIAL_MODEL); let cats = [...new Set(tieup.map(r => r.category))].sort(); document.getElementById('categoryGrid').innerHTML = cats.map(c => { let label = (c === 'PHONE(WEB-MOBILE)') ? 'PHONE, TABLET, SMART WATCH' : c; return `<div style="background:var(--indigo);color:white;padding:12px;border-radius:4px;cursor:pointer;font-weight:900;text-align:center;" onclick="selectCategory('${c}')">${label}</div>`; }).join(''); document.getElementById('catSelectionModal').style.display = 'flex'; }
        function selectCategory(catName) { document.getElementById('catSelectionModal').style.display = 'none'; let displayName = (catName === 'PHONE(WEB-MOBILE)') ? 'PHONE / TABLET / SMART WATCH' : catName; tempPendingProduct = { name: SPECIAL_MODEL + " - " + displayName, isNT: true, category: catName }; currentModalCategory = catName; finalizeProductAddition(); }

        function compMrpChanged() { let mrp = parseFloat(document.getElementById('compMrp').value) || 0; document.getElementById('compInv').value = mrp; let gtl = mrp > 100000 ? 2398 : (mrp > 50000 ? 1799 : (mrp > 30000 ? 1499 : (mrp > 10000 ? 1199 : (mrp > 0 ? 699 : 0)))); document.getElementById('compGtl').value = gtl; let rfcSlab = getRfcSlabValue(mrp); let rfcOpt = document.getElementById('compRfcOpt'); if(rfcOpt) { rfcOpt.value = rfcSlab; rfcOpt.innerText = rfcSlab; } if (isMobileDeviceCat(currentModalCategory)) { document.getElementById('compRfc').value = rfcSlab; } else { document.getElementById('compRfc').value = "0"; } }

        function showComponentsModal(baseMrp = "") {
            let c = customerQueue[activeCustomerIndex]; let rfcSelect = document.getElementById('compRfc'); let exwInput = document.getElementById('compExw'); let isMobileCat = isMobileDeviceCat(currentModalCategory);
            if (isMobileCat) { rfcSelect.disabled = false; rfcSelect.style.background = '#fff'; rfcSelect.style.cursor = 'default'; exwInput.disabled = true; exwInput.style.background = '#e9ecef'; exwInput.style.cursor = 'not-allowed'; exwInput.value = ""; } else { rfcSelect.disabled = true; rfcSelect.style.background = '#e9ecef'; rfcSelect.style.cursor = 'not-allowed'; rfcSelect.value = "0"; exwInput.disabled = false; exwInput.style.background = '#fff'; exwInput.style.cursor = 'text'; }
            let currentMrp = baseMrp !== "" ? baseMrp : (c.components?.mrp || ''); document.getElementById('compMrp').value = currentMrp; let mrpForRfc = parseFloat(currentMrp) || 0; let rfcSlab = getRfcSlabValue(mrpForRfc); let rfcOpt = document.getElementById('compRfcOpt'); if(rfcOpt) { rfcOpt.value = rfcSlab; rfcOpt.innerText = rfcSlab; }
            if (baseMrp !== "") { compMrpChanged(); } else { document.getElementById('compInv').value = c.components?.inv || ''; document.getElementById('compGtl').value = c.components?.gtl || 0; if (isMobileCat) { document.getElementById('compRfc').value = c.components?.rfc || 0; } }
            document.getElementById('compCap').value = c.components?.cap || c.cap || ''; document.getElementById('compTarget').value = c.components?.target || ''; if (!isMobileCat) { document.getElementById('compExw').value = c.components?.exw || ''; } document.getElementById('compMargin').value = c.components?.margin || ''; document.getElementById('compDealer').value = c.components?.dealer || ''; document.getElementById('componentsModal').style.display = 'flex';
        }

        async function proceedToMatrixFromComponents() { let idx = activeCustomerIndex; if(idx === -1) return; if(!customerQueue[idx].components) customerQueue[idx].components = {}; customerQueue[idx].components.mrp = parseFloat(document.getElementById('compMrp').value) || 0; customerQueue[idx].components.inv = parseFloat(document.getElementById('compInv').value) || 0; customerQueue[idx].components.cap = parseFloat(document.getElementById('compCap').value) || 0; customerQueue[idx].components.target = parseFloat(document.getElementById('compTarget').value) || 0; customerQueue[idx].components.gtl = parseFloat(document.getElementById('compGtl').value) || 0; let isMobileCat = isMobileDeviceCat(currentModalCategory); customerQueue[idx].components.rfc = isMobileCat ? (parseFloat(document.getElementById('compRfc').value) || 0) : 0; customerQueue[idx].components.exw = isMobileCat ? 0 : (parseFloat(document.getElementById('compExw').value) || 0); customerQueue[idx].components.margin = parseFloat(document.getElementById('compMargin').value) || 0; customerQueue[idx].components.dealer = parseFloat(document.getElementById('compDealer').value) || 0; let cCap = customerQueue[idx].components.cap; if (cCap > 0 || customerQueue[idx].cap > 0) { customerQueue[idx].cap = cCap > 0 ? cCap : ""; updateMatrixTopCard(); } await saveQueueToLocal(); document.getElementById('componentsModal').style.display = 'none'; if (tempPendingProduct) finalizeProductAddition(); }

        async function finalizeProductAddition() {
            let raw = tempPendingProduct.isNT ? db_records.filter(r => r.model === SPECIAL_MODEL && r.category === tempPendingProduct.category) : db_records.filter(r => r.model === tempPendingProduct.name); let ltvLimit = customerQueue[activeCustomerIndex]?.ltv || 100; let matrixEligible = raw.filter(s => s.fixedEmi > 0 || (s.tenure > 0 && ((s.tenure-s.advEmi)/s.tenure)*100 <= ltvLimit)); let uniqueSchemes = []; let seenSchemes = new Set();
            matrixEligible.forEach(s => { let schemeKey = `${s.tenure}_${s.advEmi}_${s.fixedEmi}_${s.minLoan}_${s.maxLoan}`; if (!seenSchemes.has(schemeKey)) { seenSchemes.add(schemeKey); s.inactive = false; uniqueSchemes.push(s); } });
            let comp = customerQueue[activeCustomerIndex].components || {}; let finalMrp = comp.mrp || ""; let finalInv = comp.inv || ""; let surch = (finalInv > finalMrp && finalMrp > 0) ? finalInv - finalMrp : 0;
            current_products.push({ name: tempPendingProduct.name, isNonTieup: tempPendingProduct.isNT, schemes: uniqueSchemes, category: tempPendingProduct.category, inputs: { mrp: finalMrp, inv: finalInv, cap: comp.cap || (customerQueue[activeCustomerIndex]?.cap || ""), target: comp.target || "", gtl: comp.gtl || 0, rfc: comp.rfc || 0, exw: comp.exw || 0, margin: comp.margin || "", dealer: comp.dealer || "", surch: surch, manualLoans: {} }, isManual: false }); sortConfigs.push({ key: 'dp', asc: 'asc' }); customerQueue[activeCustomerIndex].products = current_products; customerQueue[activeCustomerIndex].sortConfigs = sortConfigs; tempPendingProduct = null; await saveQueueToLocal(); goToFinalPage(); 
        }

        function updateFinalSwitcher() { let sw = document.getElementById('finalCustomerSwitcher'); if(!sw) return; sw.innerHTML = customerQueue.map((c, i) => `<option value="${i}" ${i === activeCustomerIndex ? 'selected' : ''}>👤 ${c.name} (₹${c.limit})</option>`).join(''); }
        async function switchCustomerFinal(idx) { activeCustomerIndex = parseInt(idx); await saveQueueToLocal(); goToFinalPage(); }
        function updateMatrixTopCard() { let c = customerQueue[activeCustomerIndex]; document.getElementById('infoName').innerText = c?.name || "-"; document.getElementById('infoLimit').innerText = c?.limit || 0; document.getElementById('infoCap').innerText = c?.cap ? "₹" + c.cap : "NONE"; }
        function loadCurrentProducts() { let c = customerQueue[activeCustomerIndex]; current_products = c.products || []; sortConfigs = c.sortConfigs || []; }

        function goToFinalPage() {
            if(activeCustomerIndex === -1) return; loadCurrentProducts(); updateMatrixTopCard(); updateFinalSwitcher(); document.getElementById('unifiedHome').style.display = 'none'; document.getElementById('finalEligibleArea').style.display = 'block'; renderMatrix(); setTimeout(() => { document.getElementById('finalEligibleArea').scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 150);
        }

        function toggleModelView(pIdx) { let wrapper = document.getElementById(`tw_${pIdx}`); let grid = document.getElementById(`cg_${pIdx}`); let icon = document.getElementById(`togIcon_${pIdx}`); if(wrapper.style.display === 'none') { wrapper.style.display = 'block'; if(grid) grid.style.display = 'grid'; icon.innerText = '▼'; } else { wrapper.style.display = 'none'; if(grid) grid.style.display = 'none'; icon.innerText = '▶'; } }

        function renderMatrix() {
            let container = document.getElementById('multiModelContainer'); container.innerHTML = "";
            current_products.forEach((prod, pIdx) => {
                let div = document.createElement('div'); div.className = 'model-panel'; div.style.marginBottom = "20px"; div.style.background = "#fff"; div.style.padding = "10px"; div.style.borderRadius = "8px"; div.style.border = "1px solid #ccc"; let isNT = prod.isNonTieup; let isCollapsed = (current_products.length > 1 && pIdx < current_products.length - 1); let displayStyle = isCollapsed ? 'none' : 'block'; let gridStyle = isCollapsed ? 'none' : 'grid'; let toggleIcon = isCollapsed ? '▶' : '▼'; let isPhoneWebMobile = isMobileDeviceCat(prod.category); if (!isPhoneWebMobile) prod.inputs.rfc = 0; if (isPhoneWebMobile) prod.inputs.exw = 0; let mVal = parseFloat(prod.inputs.mrp) || 0; let rfcSlab = getRfcSlabValue(mVal);
                div.innerHTML = `
                    <div style="font-weight:900; color:var(--indigo); border-bottom:1px solid #ccc; padding-bottom:4px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;">
                        <div style="display:flex; align-items:center; gap: 8px; flex-wrap:wrap;">
                            <span style="text-transform:uppercase; display:flex; align-items:center;"><span id="togIcon_${pIdx}" onclick="toggleModelView(${pIdx})" style="cursor:pointer; color:var(--primary); padding-right:6px; user-select:none;">${toggleIcon}</span>${prod.name}</span>
                        </div>
                        <button onclick="current_products.splice(${pIdx},1);saveQueueToLocal();renderMatrix();" style="background:var(--danger); color:white; margin:0; padding:5px 10px;">REMOVE</button>
                    </div>
                    <div class="table-wrapper" id="tw_${pIdx}" style="display:${displayStyle}; overflow-x: auto;">
                        <table style="width: 100%; border-collapse: collapse; text-align:center;">
                            <thead style="background: #e3f2fd;">
                                <tr>
                                    <th style="padding:10px;">LTV%</th>
                                    <th style="padding:10px;">LOAN</th>
                                    <th style="padding:10px;">NET DP</th>
                                    <th style="padding:10px;">EMI</th>
                                    <th style="padding:10px;">T/A</th>
                                </tr>
                            </thead>
                            <tbody id="body_${pIdx}"></tbody>
                        </table>
                    </div>`;
                container.appendChild(div); recalcModel(pIdx);
            });
        }

        function recalcModel(pIdx) {
            if(!current_products[pIdx]) return; 
            let prod = current_products[pIdx], limit = customerQueue[activeCustomerIndex]?.limit || 0, type = customerQueue[activeCustomerIndex]?.type || 'NEW'; let fee = (type === 'EMI CARD') ? 270 : (type === 'W/O CARD' ? 320 : 850), inp = prod.inputs; let totalFees = fee + (parseFloat(inp.margin)||0) + (parseFloat(inp.dealer)||0); let currentLimit = limit > 0 ? limit : 9999999; let inputMrp = parseFloat(inp.mrp) || 0; let inputInv = parseFloat(inp.inv) || 0; let effectivePrice = inputInv > 0 ? inputInv : (inputMrp > 0 ? inputMrp : 0); let loanCapPrice = (inputMrp > 0 && inputInv > 0) ? Math.min(inputMrp, inputInv) : effectivePrice;

            prod.calculatedData = prod.schemes.map((s, dIdx) => {
                let isFixed = s.fixedEmi > 0; let loan = 0, nbfcMaxL = 0, dpExact = 0, dpRounded = 0, emi = 0, inst = 0, currentTenure = s.tenure; nbfcMaxL = (currentLimit * s.tenure) / (s.tenure - s.advEmi || 1); let dbdRate = (s.dbd * 1.18 / 100); let roiRate = s.roi / 1200; let roiRateDP = roiRate * s.advEmi; let dynamicPf = s.pf;
                if (isFixed) {
                    let maxRemainingEmis = Math.floor(currentLimit / s.fixedEmi); let maxTotalTenure = maxRemainingEmis + s.advEmi; nbfcMaxL = maxTotalTenure * s.fixedEmi; 
                    if (effectivePrice > 0) { currentTenure = Math.floor(effectivePrice / s.fixedEmi); if (currentTenure > maxTotalTenure) currentTenure = maxTotalTenure; if (currentTenure < 1) currentTenure = 1; loan = currentTenure * s.fixedEmi; if (loan > loanCapPrice) loan = loanCapPrice; } else { currentTenure = s.tenure || 1; if (currentTenure > maxTotalTenure) currentTenure = maxTotalTenure; loan = currentTenure * s.fixedEmi; }
                } else {
                    let checkPrice = effectivePrice > 0 ? loanCapPrice : 50000; let absoluteMax = Math.min(checkPrice, nbfcMaxL); loan = absoluteMax;
                }

                if (isFixed) {
                    inst = currentTenure - s.advEmi; if(inst < 1) inst = 1; let insTotal = (parseFloat(inp.gtl)||0) + (parseFloat(inp.rfc)||0) + (parseFloat(inp.exw)||0); let roiInEmi = loan * roiRate; emi = s.fixedEmi + (insTotal / inst) + roiInEmi;
                    let roiInDp = loan * roiRateDP; dpExact = effectivePrice - loan + (s.fixedEmi * s.advEmi) + (loan * dbdRate) + dynamicPf + totalFees + roiInDp;
                } else {
                    inst = s.tenure - s.advEmi; if(inst < 1) inst = 1; let insTotal = (parseFloat(inp.gtl)||0)+(parseFloat(inp.rfc)||0)+(parseFloat(inp.exw)||0); 
                    let baseEmi = loan / s.tenure; if (baseEmi > 0 && baseEmi < 900) baseEmi = 900; 
                    let roiInEmi = loan * roiRate; emi = baseEmi + (insTotal / inst) + roiInEmi;
                    let roiInDp = loan * roiRateDP; dpExact = effectivePrice - loan + (baseEmi * s.advEmi) + (loan * dbdRate) + dynamicPf + totalFees + roiInDp;
                }

                if(dpExact > 0) dpRounded = Math.ceil(dpExact / 10) * 10; else dpRounded = dpExact; 
                let curLTV = currentTenure > 0 ? ((currentTenure - s.advEmi) / currentTenure) * 100 : 0; 
                return { ...s, currentTenure, loan, dp: dpRounded, emi, inst, dIdx, isFixed, curLTV };
            });
            renderRows(pIdx);
        }

        function renderRows(pIdx) {
            let prod = current_products[pIdx]; 
            if(!sortConfigs[pIdx]) sortConfigs[pIdx] = {key: 'dp', dir: 'asc'}; 
            let conf = sortConfigs[pIdx]; 
            prod.calculatedData.sort((a,b) => conf.dir==='asc' ? a[conf.key]-b[conf.key] : b[conf.key]-a[conf.key]); 
            
            document.getElementById(`body_${pIdx}`).innerHTML = prod.calculatedData.map(d => {
                return `<tr style="border-bottom: 1px solid #eee;">
                    <td style="padding:10px; font-weight:bold; color:var(--bajaj-blue);">${Math.round(d.curLTV)}%</td>
                    <td style="padding:10px; color:var(--success); font-weight:900;">₹${Math.floor(d.loan).toLocaleString()}</td>
                    <td style="padding:10px; color:var(--success); font-weight:900;">₹${Math.round(d.dp).toLocaleString()}</td>
                    <td style="padding:10px; color:var(--primary); font-weight:900;">₹${Math.round(d.emi).toLocaleString()}</td>
                    <td style="padding:10px; font-weight:900; color:var(--indigo);">${d.currentTenure}/${d.advEmi}</td>
                </tr>`;
            }).join('');
        }

        function findValLocal(row, targets) { let key = Object.keys(row).find(k => targets.includes(k.toUpperCase().replace(/\s/g, ''))); return key ? row[key] : null; }
        function mapData(row, type) { 
            if(!row) return null; 
            return { model: type === SPECIAL_MODEL ? SPECIAL_MODEL : String(findValLocal(row,['MODEL','BRANDMODEL'])||"").toUpperCase(), brand: String(findValLocal(row, ['BRAND', 'MAKE', 'MANUFACTURER'])||"").toUpperCase(), mrp: parseFloat(findValLocal(row, ['MRP', 'PRICE', 'M.R.P'])) || 0, tenure: parseInt(findValLocal(row, ['TOTALTENURE', 'TENURE', 'TA'])) || 0, advEmi: parseInt(findValLocal(row, ['ADVANCEEMI', 'ADV'])) || 0, dbd: parseFloat(findValLocal(row,['DBD','DBD%'])||0), pf: parseInt(findValLocal(row,['PF','PROCESSINGFEE'])||0), roi: parseFloat(findValLocal(row,['ROI','ROI%'])||0), fixedEmi: parseFloat(findValLocal(row,['FIXEDEMI', 'FIXED'])||0), category: standardizeCategoryName(findValLocal(row,['CATEGORY','CAT'])||""), minLoan: parseFloat(findValLocal(row, ['MINLOAN', 'MINL'])) || 0, maxLoan: parseFloat(findValLocal(row, ['MAXLOAN', 'MAXL'])) || 9999999 }; 
        }

    </script>
