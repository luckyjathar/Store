<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRO RCD Calculator - Persistent Portal</title>
    
    <!-- येथे तुमची CSS स्टाईल टाका -->
    <style>
        :root { --primary: #0984e3; --bajaj-blue: #034887; --success: #2ecc71; --danger: #e74c3c; --warning: #f1c40f; --indigo: #1e3a8a; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f4f7f6; }
        
        /* Modal Styles */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 10000; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 95%; max-width: 500px; max-height: 90vh; overflow-y: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        
        /* Toast Styles */
        .toast-notification { visibility: hidden; min-width: 250px; text-align: center; border-radius: 4px; padding: 15px; position: fixed; z-index: 100000; left: 50%; bottom: 30px; font-weight: bold; font-size: 16px; transform: translateX(-50%); box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .toast-notification.show { visibility: visible; }
        .toast-notification.success { background-color: var(--success); color: white; }
        .toast-notification.error { background-color: var(--danger); color: white; }
        .toast-notification.warning { background-color: var(--warning); color: black; }
        
        /* Basic Inputs & Buttons */
        input, select { padding: 10px; margin-bottom: 10px; width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; background: var(--primary); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <!-- ================= 1. Header & Status ================= -->
    <header style="display: flex; justify-content: space-between; align-items: center; background: var(--bajaj-blue); color: white; padding: 10px 20px; border-radius: 8px;">
        <h2 style="margin: 0;">PRO RCD Calculator</h2>
        <div style="display: flex; gap: 10px; align-items: center;">
            <span id="gitStatusBadge" style="padding: 5px 10px; border-radius: 4px; background: rgba(255,255,255,0.2);">🔄 SYNCING...</span>
            <button id="syncBtn" onclick="forceCloudSync()" style="display:none; background: #fff; color: var(--bajaj-blue); padding: 5px 10px; margin: 0;">SYNC</button>
        </div>
    </header>

    <!-- Loading Indicator -->
    <div id="dataLoadingIndicator" style="display:none; padding:10px; text-align:center; font-weight: bold; margin-top: 10px; border-radius: 4px;"></div>

    <!-- ================= 2. Unified Home Dashboard ================= -->
    <div id="unifiedHome" style="margin-top: 20px;">
        <button onclick="openAddProductModal('MATRIX')">➕ Add Product to Matrix</button>
        <button onclick="openDealerSearchModal()">🏪 Search Dealer Data</button>
        <button onclick="openEligibility('ZATPAT')">⚡ Fast/Zatpat Calculator</button>
        <button onclick="openEligibility('DICT')">📖 Open Scheme Dictionary</button>
        <button onclick="openFlyerGenModal()">🖼️ Generate Flyer</button>
    </div>

    <!-- ================= 3. Matrix Area ================= -->
    <div id="finalEligibleArea" style="display: none; margin-top: 20px;">
        <h3>Customer Queue & Matrix</h3>
        <select id="finalCustomerSwitcher" onchange="switchCustomerFinal(this.value)"></select>
        
        <!-- Top Info Card -->
        <div style="background: white; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #ddd; display: flex; gap: 15px; flex-wrap: wrap;">
            <div>👤 <b id="infoName">-</b></div>
            <div>📱 <b id="infoMobile">-</b></div>
            <div>💰 Limit: <b id="infoLimit" style="color: var(--success);">-</b></div>
            <div>🎯 LTV: <b id="infoLtv">-</b></div>
            <div>🚧 Cap: <b id="infoCap">-</b></div>
            <div>🏷️ Type: <b id="infoType">-</b></div>
        </div>

        <div id="multiModelContainer"></div>
    </div>

    <!-- ================= 4. ALL MODALS ================= -->
    
    <!-- Add Product Modal -->
    <div id="addProductModal" class="modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px;">
                <h3 style="margin: 0; color: var(--bajaj-blue);">🔍 Search Product</h3>
                <span onclick="document.getElementById('addProductModal').style.display='none'" style="cursor: pointer; color: var(--danger); font-weight: bold;">✖</span>
            </div>
            <input type="text" id="modalMatrixSearch" onkeyup="doSearch('modalMatrixSearch', 'modalMatrixSearchDropdown')" placeholder="Type model, brand or category...">
            <div id="modalMatrixSearchDropdown" style="display:none; border: 1px solid #ccc; max-height: 250px; overflow-y: auto; border-radius: 4px;"></div>
            
            <div style="margin-top: 15px; border-top: 1px dashed #ccc; padding-top: 15px; text-align: center;">
                <p style="font-size: 12px; color: #666; margin-bottom: 10px;">Model not found?</p>
                <button onclick="quickNonTieup()" style="background: var(--indigo); width: 100%;">+ ADD NON TIE-UP</button>
            </div>
        </div>
    </div>

    <!-- Category Selection Modal (Non Tie-Up) -->
    <div id="catSelectionModal" class="modal">
        <div class="modal-content">
            <h3 style="color: var(--indigo); border-bottom: 1px solid #eee; padding-bottom: 10px;">Select Category</h3>
            <div id="categoryGrid" style="display: grid; gap: 10px; grid-template-columns: 1fr 1fr; margin-bottom: 15px;"></div>
            <button onclick="document.getElementById('catSelectionModal').style.display='none'" style="background: var(--danger); width: 100%;">Close</button>
        </div>
    </div>

    <!-- Components Modal (Inputs) -->
    <div id="componentsModal" class="modal">
        <div class="modal-content">
            <h3 style="color: var(--bajaj-blue); border-bottom: 1px solid #eee; padding-bottom: 10px;">Product Components</h3>
            <label>MRP:</label> <input type="number" id="compMrp" onchange="compMrpChanged()">
            <label>Invoice Amount:</label> <input type="number" id="compInv">
            <label>Target DP (Optional):</label> <input type="number" id="compTarget">
            <label>EMI Capping:</label> <input type="number" id="compCap">
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div><label>GTL:</label> <input type="number" id="compGtl"></div>
                <div><label>RFC:</label> <select id="compRfc"><option id="compRfcOpt" value="0">0</option></select></div>
                <div><label>EXW:</label> <input type="number" id="compExw"></div>
                <div><label>Dealer Charge:</label> <input type="number" id="compDealer"></div>
            </div>
            
            <label>Margin Money:</label> <input type="number" id="compMargin">
            <button onclick="proceedToMatrixFromComponents()" style="width: 100%; font-size: 16px; margin-top: 10px;">✅ PROCEED</button>
        </div>
    </div>

    <!-- Dealer Search Modal -->
    <div id="dealerSearchModal" class="modal">
        <div class="modal-content">
            <h3 style="color: var(--indigo);">🏪 Search Dealer Database</h3>
            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <input type="text" id="dealerSearchInput" onkeyup="searchDealer()" placeholder="Type ID or Name..." style="margin-bottom: 0;">
                <button id="filterStarBtn" onclick="showOnlyStarredDealers()" style="margin-bottom: 0; background: #fff3cd; color: #856404; white-space: nowrap;">★ FAVORITES</button>
            </div>
            <div id="dealerSearchResults" style="max-height: 400px; overflow-y: auto; background: #f8f9fa; border-radius: 6px; padding: 10px; border: 1px solid #eee;"></div>
            <button onclick="closeDealerSearchModal()" style="width: 100%; margin-top: 15px; background: var(--danger);">Close</button>
        </div>
    </div>

    <!-- Eligibility / Zatpat Modal -->
    <div id="eligibilityModal" class="modal">
        <div class="modal-content">
            <h3 style="color: var(--primary);">⚡ Check NBFC Eligibility</h3>
            <label>Customer Type:</label>
            <select id="zeType"><option value="NEW">NEW</option><option value="EMI CARD">EMI CARD</option><option value="W/O CARD">W/O CARD</option></select>
            <label>NBFC Limit (₹):</label> <input type="number" id="zeLimit" placeholder="E.g. 50000">
            <label>Max LTV (%):</label> <input type="number" id="zeLtv" value="100">
            <label>Global EMI Capping (₹):</label> <input type="number" id="zeCap" placeholder="E.g. 2500">
            
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button onclick="applyEligibility()" style="flex: 2; background: var(--success); font-size: 16px;">✅ APPLY LIMIT</button>
                <button onclick="skipEligibility()" style="flex: 1; background: #95a5a6;">SKIP</button>
            </div>
        </div>
    </div>

    <!-- Global Elements -->
    <div id="toastNotification" class="toast-notification"></div>
    <div id="updateNotificationBar" style="display:none;"></div>

    <!-- ================= External Libraries Required in JS ================= -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- ================= Your JavaScript Code ================= -->
    <script src="script.js"></script>
</body>
</html>
