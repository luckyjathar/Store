<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Financial Portal</title>

    <!-- SheetJS for Excel Reading -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- html2canvas for Quote Image Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b1329;
            color: #ffffff;
            padding: 12px;
            padding-bottom: 75px;
            display: flex;
            justify-content: center;
        }

        .main-wrapper {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* 1. SCENARIO CARD */
        .scenario-card {
            background-color: #060e22;
            border: 2px solid #243b6b;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .scenario-header {
            background-color: #1e3a68;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            border-bottom: 2px solid #243b6b;
        }

        .scenario-title {
            font-size: 22px;
            font-weight: 900;
            font-style: italic;
            letter-spacing: 1px;
        }

        .status-badge {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            background: #10b981;
            color: #fff;
        }

        .scenario-table {
            width: 100%;
            border-collapse: collapse;
        }

        .scenario-table tr {
            border-bottom: 1px solid #1c2e4a;
        }

        .scenario-table tr:last-child {
            border-bottom: none;
        }

        .scenario-table td {
            padding: 10px 14px;
            vertical-align: middle;
        }

        .scenario-table td.label-col {
            width: 50%;
            color: #ffffff;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.5px;
            border-right: 1px solid #1c2e4a;
        }

        .scenario-table td.input-col {
            width: 50%;
            padding: 6px 10px;
        }

        .form-input, .form-select {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: 800;
            text-align: center;
        }

        .form-select {
            cursor: pointer;
            background-color: #060e22;
        }

        option {
            background-color: #060e22;
            color: #ffffff;
        }

        /* 2. SEARCH CARD */
        .search-card {
            background: #060e22;
            border: 2px solid #243b6b;
            border-radius: 8px;
            padding: 12px;
            position: relative;
        }

        .search-title {
            font-size: 13px;
            font-weight: 800;
            color: #60a5fa;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #243b6b;
            background: #0b1736;
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            outline: none;
        }

        .search-input:focus {
            border-color: #3b82f6;
        }

        .dropdown-list {
            position: absolute;
            left: 12px;
            right: 12px;
            top: 100%;
            background: #0f1c3f;
            border: 1px solid #243b6b;
            border-radius: 6px;
            max-height: 240px;
            overflow-y: auto;
            z-index: 50;
            display: none;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
            margin-top: 4px;
        }

        .dropdown-item {
            padding: 10px 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            border-bottom: 1px solid #1c2e4a;
        }

        .dropdown-item:hover {
            background: #1e3a68;
            color: #60a5fa;
        }

        /* 3. DYNAMIC PRODUCT PANELS */
        .product-panel {
            background: #060e22;
            border: 2px solid #243b6b;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            padding-bottom: 6px;
        }

        .panel-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-title {
            font-size: 15px;
            font-weight: 900;
            color: #f97316;
        }

        .panel-inv-badge {
            background: #0284c7;
            color: #fff;
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 900;
        }

        .btn-panel-action {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .btn-action-sm {
            border: none;
            padding: 4px 7px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-add-scheme { background: #10b981; color: white; }
        .btn-quote { background: #0284c7; color: white; }
        .btn-remove { background: #dc2626; color: white; }

        .sub-config-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: #0b1736;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #1c2e4a;
            margin-top: 8px;
            margin-bottom: 10px;
        }

        .sub-config-grid label {
            font-size: 10px;
            font-weight: 800;
            color: #94a3b8;
            display: block;
            margin-bottom: 2px;
        }

        .sub-config-grid input, .sub-config-grid select {
            width: 100%;
            background: #060e22;
            border: 1px solid #243b6b;
            color: #fff;
            padding: 6px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            outline: none;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        .scheme-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            text-align: center;
            white-space: nowrap;
        }

        .scheme-table th {
            background: #064e3b;
            color: #ffffff;
            padding: 8px 4px;
            border: 1px solid #047857;
        }

        .scheme-table td {
            padding: 8px 4px;
            border: 1px solid #1c2e4a;
            font-weight: 700;
        }

        .scheme-checkbox {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #38bdf8;
        }

        .btn-copy-scheme {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-copy-scheme:hover {
            background: #2563eb;
        }

        .btn-toggle-row {
            padding: 3px 6px;
            border-radius: 4px;
            border: none;
            font-size: 10px;
            font-weight: 900;
            cursor: pointer;
        }

        .btn-dis { background: #fee2e2; color: #dc2626; }
        .btn-ena { background: #d1fae5; color: #059669; }
        .row-disabled { opacity: 0.35; text-decoration: line-through; background: #111827; }

        /* MODAL STYLES */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .modal-content {
            background: #060e22;
            border: 2px solid #243b6b;
            border-radius: 8px;
            padding: 14px;
            max-width: 520px;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
        }

        .copy-hint-box {
            background: #0284c7;
            color: #ffffff;
            padding: 9px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        /* 4. FOOTER BAR */
        .app-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #060e22;
            border-top: 2px solid #1e3a68;
            padding: 8px 16px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .footer-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 800;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
        }

        .footer-btn.active, .footer-btn:hover {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        
        <!-- १. SCENARIO CARD -->
        <div class="scenario-card">
            <div class="scenario-header">
                <span class="scenario-title">Scenario</span>
                <span id="dataStatusBadge" class="status-badge" onclick="forceRefreshMasterData()">CHECKING...</span>
            </div>
            <table class="scenario-table">
                <!-- १. CUSTOMER TYPE (सगळ्यात वरती) -->
                <tr>
                    <td class="label-col">CUSTOMER TYPE</td>
                    <td class="input-col">
                        <select class="form-select" id="typeVal" autocomplete="off" onchange="recalcAllProducts()">
                            <option value="" selected>-</option>
                            <option value="NEW">NEW</option>
                            <option value="EMI CARD">EMI CARD</option>
                            <option value="VIRTUAL CARD">VIRTUAL CARD</option>
                            <option value="W/O CARD">W/O CARD</option>
                        </select>
                    </td>
                </tr>
                <!-- २. APPROVED -->
                <tr>
                    <td class="label-col">APPROVED</td>
                    <td class="input-col">
                        <input type="number" class="form-input" id="approvedVal" placeholder="-" autocomplete="off" oninput="recalcAllProducts()">
                    </td>
                </tr>
                <!-- ३. MAX LTV (कमाल १०० मर्यादा) -->
                <tr>
                    <td class="label-col">MAX LTV (%)</td>
                    <td class="input-col">
                        <input type="number" min="0" max="100" class="form-input" id="maxLtvVal" placeholder="100" autocomplete="off" oninput="validateMaxLtvInput(this); recalcAllProducts()">
                    </td>
                </tr>
                <!-- ४. EMI CAPPING -->
                <tr>
                    <td class="label-col">CAPPING</td>
                    <td class="input-col">
                        <input type="number" class="form-input" id="cappingVal" placeholder="-" autocomplete="off" oninput="recalcAllProducts()">
                    </td>
                </tr>
            </table>
        </div>

        <!-- २. SEARCH BRAND / MODEL -->
        <div class="search-card">
            <div class="search-title">🔍 Add Product / Model</div>
            <input type="text" id="modelSearchInput" class="search-input" placeholder="Type Model Name to Add..." oninput="handleModelSearch(this.value)" autocomplete="off" disabled>
            <div id="modelDropdown" class="dropdown-list"></div>
        </div>

        <!-- ३. सिलेक्ट केलेले प्रॉडक्ट्स कंटेनर -->
        <div id="selectedProductsContainer"></div>

    </div>

    <!-- ➕ फील्ड ऑफिसर मॅन्युअल स्कीम ॲड पॉपअप -->
    <div id="addSchemeModal" class="modal-overlay">
        <div class="modal-content">
            <div style="font-size:16px; font-weight:900; color:#60a5fa; margin-bottom:12px; text-align:center;" id="addSchemeModalTitle">➕ नवीन स्कीम जोडा</div>
            <input type="hidden" id="modalTargetProdId">
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;">
                <div>
                    <label style="font-size:11px; color:#94a3b8; font-weight:bold; display:block; margin-bottom:3px;">TENURE (महिने)</label>
                    <input type="number" id="mTen" placeholder="उदा. 10" style="width:100%; background:#0b1736; border:1px solid #243b6b; color:#fff; padding:8px; border-radius:4px; font-weight:bold;">
                </div>
                <div>
                    <label style="font-size:11px; color:#94a3b8; font-weight:bold; display:block; margin-bottom:3px;">ADVANCE EMI</label>
                    <input type="number" id="mAdv" placeholder="उदा. 2" value="0" style="width:100%; background:#0b1736; border:1px solid #243b6b; color:#fff; padding:8px; border-radius:4px; font-weight:bold;">
                </div>
                <div>
                    <label style="font-size:11px; color:#94a3b8; font-weight:bold; display:block; margin-bottom:3px;">DBD %</label>
                    <input type="number" step="0.01" id="mDbd" placeholder="उदा. 1.5" value="0" style="width:100%; background:#0b1736; border:1px solid #243b6b; color:#fff; padding:8px; border-radius:4px; font-weight:bold;">
                </div>
                <div>
                    <label style="font-size:11px; color:#94a3b8; font-weight:bold; display:block; margin-bottom:3px;">PF (₹)</label>
                    <input type="number" id="mPf" placeholder="उदा. 699" value="0" style="width:100%; background:#0b1736; border:1px solid #243b6b; color:#fff; padding:8px; border-radius:4px; font-weight:bold;">
                </div>
                <div style="grid-column: span 2;">
                    <label style="font-size:11px; color:#94a3b8; font-weight:bold; display:block; margin-bottom:3px;">ROI %</label>
                    <input type="number" step="0.01" id="mRoi" placeholder="उदा. 0" value="0" style="width:100%; background:#0b1736; border:1px solid #243b6b; color:#fff; padding:8px; border-radius:4px; font-weight:bold;">
                </div>
            </div>
            <div style="display:flex; gap:8px;">
                <button onclick="saveCustomSchemeFromField()" style="flex:1; background:#10b981; color:white; padding:8px; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">सेव्ह करा ✅</button>
                <button onclick="closeAddSchemeModal()" style="flex:1; background:#dc2626; color:white; border:none; padding:8px; border-radius:4px; font-weight:bold; cursor:pointer;">रद्द करा</button>
            </div>
        </div>
    </div>

    <!-- 📸 QUOTE IMAGE PREVIEW MODAL -->
    <div id="imageViewerModal" class="modal-overlay">
        <div class="modal-content">
            <div class="copy-hint-box">
                👉 इमेजवर Long Press (दाबून धरून) करून थेट Copy किंवा Share करा!
            </div>
            <img id="generatedQuoteImg" src="" alt="Customer Quote" style="width:100%; border-radius:6px; margin-bottom:10px; display:block;">
            <button onclick="document.getElementById('imageViewerModal').style.display='none'" style="width:100%; background:#dc2626; color:white; border:none; padding:10px; border-radius:4px; font-weight:bold; font-size:14px; cursor:pointer;">CLOSE ✖</button>
        </div>
    </div>

    <!-- 🌐 FOOTER BAR -->
    <div class="app-footer">
        <button class="footer-btn active" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
            <span>⚡</span><span>CALCULATOR</span>
        </button>
        <button class="footer-btn" onclick="forceRefreshMasterData()">
            <span>🔄</span><span>SYNC DATA</span>
        </button>
        <button class="footer-btn" onclick="resetAllInputsToBlank()">
            <span>🗑</span><span>CLEAR ALL</span>
        </button>
    </div>

    <script>
        const PRIMARY_EXCEL_URL = "https://raw.githubusercontent.com/luckyjathar/testcalculator/main/master_data.xlsx";
        const SECONDARY_EXCEL_URL = "https://raw.githubusercontent.com/luckyjathar/CALCULATOR/main/master_data.xlsx";
        const LOCAL_EXCEL_URL = "./master_data.xlsx";
        const GITHUB_COMMIT_API = "https://api.github.com/repos/luckyjathar/testcalculator/commits?path=master_data.xlsx&page=1&per_page=1";

        const DB_NAME = "PersistentPortalDB";
        const DB_VERSION = 2;
        const STORE_NAME = "dataStore";
        const CACHE_DURATION_MS = 12 * 60 * 60 * 1000;

        let dbInstance = null;
        let masterDbRecords = [];
        let selectedProductList = [];

        function initDB() {
            return new Promise((resolve, reject) => {
                let request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = function(e) {
                    let db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
                request.onsuccess = function(e) {
                    dbInstance = e.target.result;
                    resolve(dbInstance);
                };
                request.onerror = function(e) { reject(e); };
            });
        }

        function saveToDB(key, data) {
            return new Promise((resolve, reject) => {
                if (!dbInstance) return reject("DB not initialized");
                try {
                    let tx = dbInstance.transaction(STORE_NAME, 'readwrite');
                    let store = tx.objectStore(STORE_NAME);
                    let req = store.put(JSON.stringify(data), key);
                    req.onsuccess = () => resolve();
                    req.onerror = (e) => reject(e.target.error);
                } catch(e) { reject(e); }
            });
        }

        function getFromDB(key) {
            return new Promise((resolve, reject) => {
                if (!dbInstance) return resolve(null);
                try {
                    let tx = dbInstance.transaction(STORE_NAME, 'readonly');
                    let store = tx.objectStore(STORE_NAME);
                    let req = store.get(key);
                    req.onsuccess = (e) => {
                        let res = e.target.result;
                        if (res) {
                            if (typeof res === 'string') resolve(JSON.parse(res));
                            else resolve(res);
                        } else {
                            resolve(null);
                        }
                    };
                    req.onerror = (e) => reject(e.target.error);
                } catch(e) { reject(e); }
            });
        }

        function validateMaxLtvInput(el) {
            let val = parseFloat(el.value);
            if (val > 100) el.value = 100;
            else if (val < 0) el.value = 0;
        }

        function getGtlSlabValue(inv) {
            let amount = parseFloat(inv) || 0;
            if (amount > 100000) return 2498;
            if (amount > 50000) return 1799;
            if (amount > 30000) return 1499;
            if (amount > 10000) return 1199;
            if (amount > 0) return 699;
            return 0;
        }

        function getRfcSlabValue(val) {
            let amount = parseFloat(val) || 0;
            if (amount < 8000) return 0;
            if (amount <= 10000) return 1109;
            if (amount <= 15000) return 1631;
            if (amount <= 20000) return 2147;
            if (amount <= 25000) return 2695;
            if (amount <= 30000) return 3215;
            if (amount <= 35000) return 3648;
            if (amount <= 40000) return 4219;
            if (amount <= 50000) return 5720;
            if (amount <= 60000) return 8686;
            if (amount <= 100000) return 11438;
            if (amount <= 200000) return 16677;
            return 0;
        }

        window.addEventListener('pageshow', async function() {
            resetAllInputsToBlank();
            await initDB();
            await fetchFromMasterStream(false);
            setTimeout(() => checkForRemoteExcelUpdate(), 1000);
        });

        function resetAllInputsToBlank() {
            document.querySelectorAll('.form-input, .search-input').forEach(input => input.value = '');
            document.querySelectorAll('.form-select').forEach(select => select.selectedIndex = 0);
            selectedProductList = [];
            renderAllProductPanels();
            const dropdown = document.getElementById('modelDropdown');
            if (dropdown) dropdown.style.display = 'none';
        }

        async function checkForRemoteExcelUpdate() {
            const badge = document.getElementById('dataStatusBadge');
            try {
                let res = await fetch(GITHUB_COMMIT_API + "&t=" + Date.now());
                if (!res.ok) return;

                let commits = await res.json();
                if (commits && commits.length > 0) {
                    let latestCommitTime = new Date(commits[0].commit.committer.date).getTime();
                    let savedVersionTime = await getFromDB('master_data_version_time') || 0;

                    if (savedVersionTime > 0 && latestCommitTime > savedVersionTime) {
                        if (badge) {
                            badge.innerText = "🔄 UPDATING...";
                            badge.style.background = "#f59e0b";
                            badge.style.color = "#000";
                        }
                        await saveToDB('master_data_version_time', latestCommitTime);
                        await fetchFromMasterStream(true);
                    } else if (savedVersionTime === 0) {
                        await saveToDB('master_data_version_time', latestCommitTime);
                    }
                }
            } catch(e) {}
        }

        async function fetchFromMasterStream(forceSync = false) {
            const badge = document.getElementById('dataStatusBadge');
            const searchInput = document.getElementById('modelSearchInput');
            let now = Date.now();

            try {
                if (!forceSync) {
                    let cachedTime = await getFromDB('master_data_time');
                    let cachedDbRecords = await getFromDB('cached_db_records');

                    if (cachedTime && cachedDbRecords && cachedDbRecords.length > 0 && (now - cachedTime < CACHE_DURATION_MS)) {
                        masterDbRecords = cachedDbRecords;
                        badge.innerText = `⚡ CACHED`;
                        badge.style.background = "#10b981";
                        badge.style.color = "#fff";
                        searchInput.disabled = false;
                        searchInput.placeholder = "Type Model Name to Add...";
                        return;
                    }
                }

                badge.innerText = "DOWNLOADING...";
                badge.style.background = "#f59e0b";
                badge.style.color = "#000";

                const urlsToTry = [
                    PRIMARY_EXCEL_URL + '?t=' + now,
                    SECONDARY_EXCEL_URL + '?t=' + now,
                    LOCAL_EXCEL_URL + '?t=' + now
                ];

                let dataBuffer = null;
                for (let url of urlsToTry) {
                    try {
                        let res = await fetch(url);
                        if (res.ok) {
                            dataBuffer = await res.arrayBuffer();
                            break;
                        }
                    } catch(e) {}
                }

                if (!dataBuffer) throw new Error("Excel लोड अयशस्वी");

                let wb = XLSX.read(new Uint8Array(dataBuffer), { type: 'array' });
                let sheet1 = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { raw: false, defval: "" });
                let sheet2 = wb.SheetNames.length > 1 ? XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[1]], { raw: false, defval: "" }) : [];

                let allRows = [...sheet1, ...sheet2];

                masterDbRecords = allRows.map(row => {
                    return {
                        model: String(findVal(row, ['MODEL', 'BRANDMODEL', 'ASSET']) || "").toUpperCase().trim(),
                        brand: String(findVal(row, ['BRAND', 'MAKE']) || "").toUpperCase().trim(),
                        category: String(findVal(row, ['CATEGORY', 'CAT']) || "OTHER").toUpperCase().trim(),
                        mrp: parseFloat(findVal(row, ['MRP', 'PRICE', 'M.R.P'])) || 0,
                        tenure: parseInt(findVal(row, ['TOTALTENURE', 'TENURE', 'TA'])) || 0,
                        advEmi: parseInt(findVal(row, ['ADVANCEEMI', 'ADV'])) || 0,
                        dbd: parseFloat(findVal(row, ['DBD', 'DBD%'])) || 0,
                        pf: parseInt(findVal(row, ['PF', 'PROCESSINGFEE'])) || 0,
                        roi: parseFloat(findVal(row, ['ROI', 'ROI%'])) || 0
                    };
                }).filter(r => r.model !== "" && r.model !== "NON TIEUP");

                await saveToDB('cached_db_records', masterDbRecords);
                await saveToDB('master_data_time', now);

                badge.innerText = `READY`;
                badge.style.background = "#10b981";
                badge.style.color = "#fff";
                searchInput.disabled = false;
                searchInput.placeholder = "Type Model Name to Add...";

            } catch (err) {
                console.error("Master Data Load Error:", err);
                let fallbackDb = await getFromDB('cached_db_records');
                if (fallbackDb && fallbackDb.length > 0) {
                    masterDbRecords = fallbackDb;
                    badge.innerText = `OFFLINE`;
                    badge.style.background = "#10b981";
                    badge.style.color = "#fff";
                    searchInput.disabled = false;
                    searchInput.placeholder = "Type Model Name to Add...";
                } else {
                    badge.innerText = "ERROR";
                    badge.style.background = "#ef4444";
                    badge.style.color = "#fff";
                }
            }
        }

        async function forceRefreshMasterData() {
            await fetchFromMasterStream(true);
        }

        function findVal(row, keys) {
            let foundKey = Object.keys(row).find(k => keys.includes(k.toUpperCase().replace(/\s/g, '')));
            return foundKey ? row[foundKey] : null;
        }

        function handleModelSearch(query) {
            const dropdown = document.getElementById('modelDropdown');
            const q = query.trim().toUpperCase();

            if (!q) {
                dropdown.style.display = 'none';
                return;
            }

            let uniqueModels = [];
            let seen = new Set();

            masterDbRecords.forEach(r => {
                if ((r.model.includes(q) || r.brand.includes(q)) && !seen.has(r.model)) {
                    seen.add(r.model);
                    uniqueModels.push(r);
                }
            });

            if (uniqueModels.length === 0) {
                dropdown.innerHTML = `<div style="padding:10px; color:#888; text-align:center;">कोणतेही मॉडेल सापडले नाही.</div>`;
                dropdown.style.display = 'block';
                return;
            }

            dropdown.innerHTML = uniqueModels.slice(0, 30).map(m => `
                <div class="dropdown-item" onclick="addNewProductToBasket('${m.model.replace(/'/g, "\\'")}')">
                    <span>📱 ${m.brand ? `[${m.brand}] ` : ''}${m.model}</span>
                </div>
            `).join('');

            dropdown.style.display = 'block';
        }

        function addNewProductToBasket(modelName) {
            const dropdown = document.getElementById('modelDropdown');
            const searchInput = document.getElementById('modelSearchInput');

            searchInput.value = '';
            dropdown.style.display = 'none';

            let modelSchemes = masterDbRecords.filter(r => r.model === modelName);
            let defaultMrp = modelSchemes[0] && modelSchemes[0].mrp > 0 ? modelSchemes[0].mrp : "";

            let autoGtl = getGtlSlabValue(defaultMrp);
            let autoRfcSlab = getRfcSlabValue(defaultMrp);

            let newProduct = {
                id: 'prod_' + Date.now() + '_' + Math.floor(Math.random()*1000),
                name: modelName,
                invoice: defaultMrp,
                gtl: autoGtl,
                rfc: 0,
                rfcSlab: autoRfcSlab,
                margin: 0,
                dealerContri: 0,
                isCollapsed: false,
                schemes: modelSchemes.map((s, idx) => ({ ...s, sId: 's_' + idx, disabled: false }))
            };

            selectedProductList.push(newProduct);
            renderAllProductPanels();

        /* 📋 स्मार्ट स्कीम कॉपी लॉजिक (चेक केलेल्या सर्व किंवा सिंगल स्कीम) */
        function copySmartScheme(pId, currentRowEl, tenure, adv, dp, emi, months, perDay) {
            let prod = selectedProductList.find(p => p.id === pId);
            if (!prod) return;

            let tableElement = document.getElementById(`tbody_${pId}`);
            if (!tableElement) return;

            // टेबलमध्ये चेक केलेले चेकबॉक्सेस शोधा
            let checkedBoxes = tableElement.querySelectorAll('.scheme-checkbox:checked');
            let price = prod.invoice || "0";

            // १. जर युझरने चेकबॉक्स टिक केलेले असतील, तर टिक केलेल्या सर्व स्कीम्स कॉपी करा
            if (checkedBoxes.length > 0) {
                let textToCopy = `📱 *${prod.name}*\n💵 *Invoice:* ₹${Number(price).toLocaleString()}\n\n`;
                let count = 1;

                checkedBoxes.forEach(cb => {
                    let tr = cb.closest('tr');
                    if (tr && !tr.classList.contains('row-disabled')) {
                        let cols = tr.querySelectorAll('td');
                        if (cols.length >= 7) {
                            let sName = cols[1].innerText.replace('(FIELD)', '').trim();
                            let sDp = cols[2].innerText.trim();
                            let sEmi = cols[3].innerText.trim();
                            let sMonths = cols[4].innerText.trim();
                            let sDay = cols[5].innerText.trim();

                            textToCopy += `🔹 *Option ${count}:* ${sName}\n` +
                                          `💰 *DP:* ${sDp} | 🗓️ *EMI:* ${sEmi} x ${sMonths} M | ✨ *Day:* ${sDay}\n\n`;
                            count++;
                        }
                    }
                });

                clipboardCopy(textToCopy, `टिकमार्क केलेल्या ${count - 1} स्कीम्स यशस्वीरित्या कॉपी झाल्या! ✅`);
            } 
            // २. जर एकही चेकबॉक्स टिक नसेल, तर फक्त ज्या ओळीवर क्लिक केले ती एकच स्कीम कॉपी करा
            else {
                let textToCopy = `📱 *${prod.name}*\n` +
                                 `💵 *Invoice:* ₹${Number(price).toLocaleString()}\n` +
                                 `✅ *Scheme:* ${tenure}/${adv}\n` +
                                 `💰 *Down Payment:* ₹${Number(dp).toLocaleString()}\n` +
                                 `🗓️ *EMI:* ₹${Number(emi).toLocaleString()} x ${months} Months\n` +
                                 `✨ *Per Day:* ₹${Number(perDay).toLocaleString()}`;

                clipboardCopy(textToCopy, "स्कीम कॉपी झाली! ✅");
            }
        }

        function clipboardCopy(text, successMsg) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => alert(successMsg));
            } else {
                let ta = document.createElement("textarea");
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                alert(successMsg);
            }
        }

        /* टेबलमधील कॅल्क्युलेशन व सॉर्टिंग */
        function renderProductTableOnly(pId) {
            let prod = selectedProductList.find(p => p.id === pId);
            if (!prod) return;

            const tbody = document.getElementById(`tbody_${pId}`);
            if (!tbody) return;

            let approvedLimit = parseFloat(document.getElementById('approvedVal').value) || 0;
            let rawMaxLtv = document.getElementById('maxLtvVal').value || "100";
            let maxLtv = Math.min(100, Math.max(0, parseFloat(rawMaxLtv) || 100));
            let custType = document.getElementById('typeVal').value || "NEW";
            let emiCap = parseFloat(document.getElementById('cappingVal').value) || 0;

            let invoiceAmount = parseFloat(prod.invoice) || 0;
            let margin = parseFloat(prod.margin) || 0;
            let dealerContri = parseFloat(prod.dealerContri) || 0;
            let gtlVal = parseFloat(prod.gtl) || 0;
            let rfcVal = parseFloat(prod.rfc) || 0;

            let baseFee = 850;
            if (custType === 'EMI CARD' || custType === 'VIRTUAL CARD') baseFee = 270;
            else if (custType === 'W/O CARD') baseFee = 320;

            let totalFees = baseFee + margin + dealerContri;

            let eligibleSchemes = prod.schemes.filter(s => {
                if (s.tenure <= 0) return false;
                let schemeLtv = ((s.tenure - s.advEmi) / s.tenure) * 100;
                return schemeLtv <= maxLtv;
            });

            if (eligibleSchemes.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" style="color:#f87171; padding:10px;">Max LTV (${maxLtv}%) च्या मर्यादेत एकही स्कीम नाही.</td></tr>`;
                return;
            }

            let calculatedRows = eligibleSchemes.map(s => {
                let price = invoiceAmount > 0 ? invoiceAmount : (s.mrp > 0 ? s.mrp : (approvedLimit > 0 ? approvedLimit : 30000));
                let months = Math.max(1, s.tenure - s.advEmi);

                let nbfcMaxL = approvedLimit > 0 ? (approvedLimit * s.tenure) / (months || 1) : price;
                let loan = Math.min(price, nbfcMaxL);

                let schemeLtv = ((s.tenure - s.advEmi) / s.tenure) * 100;
                if (schemeLtv > maxLtv) loan = Math.floor(price * (maxLtv / 100));

                let minAllowedLoan = price * 0.50;
                if (loan < minAllowedLoan) loan = minAllowedLoan;

                let dbdRate = (s.dbd * 1.18 / 100);
                let roiRate = s.roi / 1200;
                let roiRateDP = roiRate * s.advEmi;

                let baseEmi = loan / s.tenure;
                if (baseEmi > 0 && baseEmi < 900) baseEmi = 900;

                let insPerMonth = (gtlVal + rfcVal) / months;
                let roiInEmi = loan * roiRate;
                let emi = baseEmi + roiInEmi + insPerMonth;

                if (emiCap > 0 && emi > emiCap) {
                    loan = Math.max(minAllowedLoan, ((emiCap - insPerMonth) / ((1 / s.tenure) + roiRate)));
                    baseEmi = loan / s.tenure;
                    emi = baseEmi + (loan * roiRate) + insPerMonth;
                }

                let roiInDp = loan * roiRateDP;
                let dbdAmt = loan * dbdRate;
                let dpExact = price - loan + (baseEmi * s.advEmi) + dbdAmt + s.pf + totalFees + roiInDp;
                let dp = Math.ceil(dpExact / 10) * 10;

                let perDay = Math.round(emi / 30);
                let extraCharges = Math.round((dp + (emi * months)) - price);

                return {
                    scheme: s,
                    loan,
                    dp,
                    emi,
                    months,
                    perDay,
                    extraCharges,
                    disabled: s.disabled,
                    sId: s.sId,
                    isCustom: s.isCustom
                };
            });

            // सॉर्टिंग (DP चढता -> EMI चढता -> महिने उतरता)
            calculatedRows.sort((a, b) => {
                if (a.dp !== b.dp) return a.dp - b.dp;
                if (a.emi !== b.emi) return a.emi - b.emi;
                return b.months - a.months;
            });

            tbody.innerHTML = calculatedRows.map(row => {
                let s = row.scheme;
                let rowClass = row.disabled ? "row-disabled" : "";
                let actionBtn = row.disabled 
                    ? `<button class="btn-toggle-row btn-ena" onclick="toggleSchemeStatus('${prod.id}', '${row.sId}')">✅</button>`
                    : `<button class="btn-toggle-row btn-dis" onclick="toggleSchemeStatus('${prod.id}', '${row.sId}')">🚫</button>`;

                let customBadge = row.isCustom ? `<span style="font-size:9px; color:#10b981;">(FIELD)</span>` : '';

                return `
                    <tr class="${rowClass}">
                        <td><input type="checkbox" class="scheme-checkbox" ${row.disabled ? 'disabled' : ''}></td>
                        <td style="color:#60a5fa; font-weight:900;">${s.tenure}/${s.advEmi} ${customBadge}</td>
                        <td style="color:#f59e0b; font-weight:900;">₹${Math.round(row.dp).toLocaleString()}</td>
                        <td style="color:#38bdf8; font-weight:900;">₹${Math.round(row.emi).toLocaleString()}</td>
                        <td style="color:#e2e8f0;">${row.months}</td>
                        <td style="color:#fb923c;">₹${row.perDay.toLocaleString()}</td>
                        <td style="color:#f87171;">₹${Math.max(0, row.extraCharges).toLocaleString()}</td>
                        <td>
                            <button class="btn-copy-scheme" title="टिक केलेल्या सर्व किंवा ही एक स्कीम कॉपी करा" onclick="copySmartScheme('${prod.id}', this, '${s.tenure}', '${s.advEmi}', '${Math.round(row.dp)}', '${Math.round(row.emi)}', '${row.months}', '${row.perDay}')">📋</button>
                        </td>
                        <td>${actionBtn}</td>
                    </tr>
                `;
            }).join('');
        }

                            <th style="padding: 10px 6px; border: 2px solid #047857;">DOWN PAYMENT</th>
                            <th style="padding: 10px 6px; border: 2px solid #047857;">MONTHLY EMI</th>
                            <th style="padding: 10px 6px; border: 2px solid #047857;">MONTHS</th>
                            <th style="padding: 10px 6px; border: 2px solid #047857;">PER DAY</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${Array.from(tableElement.querySelectorAll('tr:not(.row-disabled)')).map(r => {
                            let cols = r.querySelectorAll('td');
                            if (cols.length < 7) return '';
                            return `
                                <tr style="border-bottom: 1px solid #1c2e4a; font-weight: 900; font-size: 17px;">
                                    <td style="padding: 12px 6px; color: #60a5fa;">${cols[1].innerText.replace('(FIELD)', '').trim()}</td>
                                    <td style="padding: 12px 6px; color: #f59e0b;">${cols[2].innerText}</td>
                                    <td style="padding: 12px 6px; color: #38bdf8;">${cols[3].innerText}</td>
                                    <td style="padding: 12px 6px; color: #e2e8f0;">${cols[4].innerText}</td>
                                    <td style="padding: 12px 6px; color: #fb923c;">${cols[5].innerText}</td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;

            document.body.appendChild(quoteDiv);

            html2canvas(quoteDiv, { scale: 2, useCORS: true }).then(canvas => {
                document.body.removeChild(quoteDiv);
                let imgData = canvas.toDataURL("image/png");
                document.getElementById('generatedQuoteImg').src = imgData;
                document.getElementById('imageViewerModal').style.display = 'flex';
            });
        }

        document.addEventListener('click', function(e) {
            const dropdown = document.getElementById('modelDropdown');
            const searchInput = document.getElementById('modelSearchInput');
            if (dropdown && !dropdown.contains(e.target) && e.target !== searchInput) {
                dropdown.style.display = 'none';
            }
        });
    </script>
</body>
</html>
