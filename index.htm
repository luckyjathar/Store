<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scenario & Multi-Model Portal</title>

    <!-- SheetJS for Excel Reading -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- html2canvas for Quote Image Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b1329;
            color: #ffffff;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .main-wrapper {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 1. SCENARIO CARD */
        .scenario-card {
            background-color: #060e22;
            border: 2px solid #243b6b;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .scenario-header {
            background-color: #1e3a68;
            color: #ffffff;
            text-align: center;
            padding: 12px;
            font-size: 26px;
            font-weight: 900;
            font-style: italic;
            letter-spacing: 1px;
            border-bottom: 2px solid #243b6b;
        }

        .scenario-table {
            width: 100%;
            border-collapse: collapse;
        }

        .scenario-table tr {
            border-bottom: 1px solid #1c2e4a;
        }

        .scenario-table tr:last-child {
            border-bottom: none;
        }

        .scenario-table td {
            padding: 10px 14px;
            vertical-align: middle;
        }

        .scenario-table td.label-col {
            width: 50%;
            color: #ffffff;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.5px;
            border-right: 1px solid #1c2e4a;
        }

        .scenario-table td.input-col {
            width: 50%;
            padding: 6px 10px;
        }

        .form-input, .form-select {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: 800;
            text-align: center;
        }

        .form-select {
            cursor: pointer;
            background-color: #060e22;
        }

        option {
            background-color: #060e22;
            color: #ffffff;
        }

        /* 2. SEARCH CARD */
        .search-card {
            background: #060e22;
            border: 2px solid #243b6b;
            border-radius: 8px;
            padding: 12px;
            position: relative;
        }

        .search-header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .search-title {
            font-size: 14px;
            font-weight: 800;
            color: #60a5fa;
            text-transform: uppercase;
        }

        .status-badge {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #243b6b;
            background: #0b1736;
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            outline: none;
        }

        .search-input:focus {
            border-color: #3b82f6;
        }

        .dropdown-list {
            position: absolute;
            left: 12px;
            right: 12px;
            top: 100%;
            background: #0f1c3f;
            border: 1px solid #243b6b;
            border-radius: 6px;
            max-height: 240px;
            overflow-y: auto;
            z-index: 50;
            display: none;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
            margin-top: 4px;
        }

        .dropdown-item {
            padding: 10px 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            border-bottom: 1px solid #1c2e4a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dropdown-item:hover {
            background: #1e3a68;
            color: #60a5fa;
        }

        /* 3. DYNAMIC PRODUCT PANELS */
        .product-panel {
            background: #060e22;
            border: 2px solid #243b6b;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1c2e4a;
            padding-bottom: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .panel-title {
            font-size: 15px;
            font-weight: 900;
            color: #f97316;
        }

        .btn-panel-action {
            display: flex;
            gap: 5px;
        }

        .btn-add-scheme {
            background: #10b981;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-quote {
            background: #0284c7;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-remove {
            background: #dc2626;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        .sub-config-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: #0b1736;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #1c2e4a;
            margin-bottom: 10px;
        }

        .sub-config-grid label {
            font-size: 10px;
            font-weight: 800;
            color: #94a3b8;
            display: block;
            margin-bottom: 2px;
        }

        .sub-config-grid input, .sub-config-grid select {
            width: 100%;
            background: #060e22;
            border: 1px solid #243b6b;
            color: #fff;
            padding: 6px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            outline: none;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        .scheme-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            text-align: center;
            white-space: nowrap;
        }

        .scheme-table th {
            background: #064e3b;
            color: #ffffff;
            padding: 8px 4px;
            border: 1px solid #047857;
        }

        .scheme-table td {
            padding: 8px 4px;
            border: 1px solid #1c2e4a;
            font-weight: 700;
        }

        .row-disabled {
            opacity: 0.35;
            text-decoration: line-through;
            background: #111827;
        }

        .btn-toggle-row {
            padding: 3px 6px;
            border-radius: 4px;
            border: none;
            font-size: 10px;
            font-weight: 900;
            cursor: pointer;
        }

        .btn-dis { background: #fee2e2; color: #dc2626; }
        .btn-ena { background: #d1fae5; color: #059669; }

        /* MODAL STYLES */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-content {
            background: #060e22;
            border: 2px solid #243b6b;
            border-radius: 8px;
            padding: 16px;
            max-width: 440px;
            width: 100%;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 900;
            color: #60a5fa;
            margin-bottom: 12px;
            text-align: center;
        }

        .modal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }

        .modal-grid label {
            font-size: 11px;
            color: #94a3b8;
            font-weight: bold;
            display: block;
            margin-bottom: 3px;
        }

        .modal-grid input {
            width: 100%;
            background: #0b1736;
            border: 1px solid #243b6b;
            color: #ffffff;
            padding: 8px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        
        <!-- १. SCENARIO वरील मुख्य ऑप्शन्स (नवीन अचूक सिक्वेन्स) -->
        <div class="scenario-card">
            <div class="scenario-header">Scenario</div>
            <table class="scenario-table">
                <!-- १. CUSTOMER TYPE (सगळ्यात वरती) -->
                <tr>
                    <td class="label-col">CUSTOMER TYPE</td>
                    <td class="input-col">
                        <select class="form-select" id="typeVal" autocomplete="off" onchange="recalcAllProducts()">
                            <option value="" selected>-</option>
                            <option value="NEW">NEW</option>
                            <option value="EMI CARD">EMI CARD</option>
                            <option value="VIRTUAL CARD">VIRTUAL CARD</option>
                            <option value="W/O CARD">W/O CARD</option>
                        </select>
                    </td>
                </tr>
                <!-- २. APPROVED (त्याच्या खाली) -->
                <tr>
                    <td class="label-col">APPROVED</td>
                    <td class="input-col">
                        <input type="number" class="form-input" id="approvedVal" placeholder="-" autocomplete="off" oninput="recalcAllProducts()">
                    </td>
                </tr>
                <!-- ३. MAX LTV (त्याच्या खाली - कमाल १०० ची कडक मर्यादा) -->
                <tr>
                    <td class="label-col">MAX LTV (%)</td>
                    <td class="input-col">
                        <input type="number" min="0" max="100" class="form-input" id="maxLtvVal" placeholder="100" autocomplete="off" oninput="validateMaxLtvInput(this); recalcAllProducts()">
                    </td>
                </tr>
                <!-- ४. EMI CAPPING (त्याच्या खाली) -->
                <tr>
                    <td class="label-col">CAPPING</td>
                    <td class="input-col">
                        <input type="number" class="form-input" id="cappingVal" placeholder="-" autocomplete="off" oninput="recalcAllProducts()">
                    </td>
                </tr>
            </table>
        </div>

        <!-- २. SEARCH BRAND / MODEL -->
        <div class="search-card">
            <div class="search-header-area">
                <span class="search-title">🔍 Add Product / Model</span>
                <span id="dataStatusBadge" class="status-badge" title="क्लिक करून फोर्स रिफ्रेश करा" onclick="forceRefreshMasterData()">CHECKING...</span>
            </div>
            <input type="text" id="modelSearchInput" class="search-input" placeholder="Type Model or Brand to Add..." oninput="handleModelSearch(this.value)" autocomplete="off" disabled>
            <div id="modelDropdown" class="dropdown-list"></div>
        </div>

        <!-- ३. सिलेक्ट केलेले सर्व प्रॉडक्ट्स पॅनेल्स -->
        <div id="selectedProductsContainer"></div>

    </div>

    <!-- ➕ फील्ड ऑफिसरसाठी मॅन्युअल स्कीम ॲड करण्याचा पॉपअप -->
    <div id="addSchemeModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title" id="addSchemeModalTitle">➕ नवीन स्कीम ॲड करा</div>
            <input type="hidden" id="modalTargetProdId">
            <div class="modal-grid">
                <div>
                    <label>TENURE (महिन्यांची संख्या)</label>
                    <input type="number" id="mTen" placeholder="उदा. 10">
                </div>
                <div>
                    <label>ADVANCE EMI</label>
                    <input type="number" id="mAdv" placeholder="उदा. 2" value="0">
                </div>
                <div>
                    <label>DBD %</label>
                    <input type="number" step="0.01" id="mDbd" placeholder="उदा. 1.5" value="0">
                </div>
                <div>
                    <label>PROCESSING FEE (₹)</label>
                    <input type="number" id="mPf" placeholder="उदा. 699" value="0">
                </div>
                <div style="grid-column: span 2;">
                    <label>ROI %</label>
                    <input type="number" step="0.01" id="mRoi" placeholder="उदा. 0" value="0">
                </div>
            </div>
            <div style="display:flex; gap:8px;">
                <button onclick="saveCustomSchemeFromField()" style="flex:1; background:#10b981; color:white; padding:8px; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">सेव्ह करा ✅</button>
                <button onclick="closeAddSchemeModal()" style="flex:1; background:#dc2626; color:white; border:none; padding:8px; border-radius:4px; font-weight:bold; cursor:pointer;">रद्द करा</button>
            </div>
        </div>
    </div>

    <!-- 📸 QUOTE IMAGE PREVIEW MODAL -->
    <div id="imageViewerModal" class="modal-overlay">
        <div class="modal-content" style="text-align:center;">
            <img id="generatedQuoteImg" src="" alt="Customer Quote" style="width:100%; border-radius:6px; margin-bottom:12px;">
            <div style="display:flex; gap:8px;">
                <a id="downloadImgBtn" href="#" download="Customer_Loan_Quote.png" style="flex:1; background:#059669; color:white; padding:8px; border-radius:4px; font-weight:bold; text-decoration:none;">💾 DOWNLOAD IMAGE</a>
                <button onclick="document.getElementById('imageViewerModal').style.display='none'" style="flex:1; background:#dc2626; color:white; border:none; padding:8px; border-radius:4px; font-weight:bold; cursor:pointer;">CLOSE</button>
            </div>
        </div>
    </div>

    <script>
        const PRIMARY_EXCEL_URL = "https://raw.githubusercontent.com/luckyjathar/testcalculator/main/master_data.xlsx";
        const SECONDARY_EXCEL_URL = "https://raw.githubusercontent.com/luckyjathar/CALCULATOR/main/master_data.xlsx";
        const LOCAL_EXCEL_URL = "./master_data.xlsx";
        const GITHUB_COMMIT_API = "https://api.github.com/repos/luckyjathar/testcalculator/commits?path=master_data.xlsx&page=1&per_page=1";

        const DB_NAME = "PersistentPortalDB";
        const DB_VERSION = 2;
        const STORE_NAME = "dataStore";
        const CACHE_DURATION_MS = 12 * 60 * 60 * 1000;

        let dbInstance = null;
        let masterDbRecords = [];
        let selectedProductList = [];

        function initDB() {
            return new Promise((resolve, reject) => {
                let request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = function(e) {
                    let db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
                request.onsuccess = function(e) {
                    dbInstance = e.target.result;
                    resolve(dbInstance);
                };
                request.onerror = function(e) { reject(e); };
            });
        }

        function saveToDB(key, data) {
            return new Promise((resolve, reject) => {
                if (!dbInstance) return reject("DB not initialized");
                try {
                    let tx = dbInstance.transaction(STORE_NAME, 'readwrite');
                    let store = tx.objectStore(STORE_NAME);
                    let req = store.put(JSON.stringify(data), key);
                    req.onsuccess = () => resolve();
                    req.onerror = (e) => reject(e.target.error);
                } catch(e) { reject(e); }
            });
        }

        function getFromDB(key) {
            return new Promise((resolve, reject) => {
                if (!dbInstance) return resolve(null);
                try {
                    let tx = dbInstance.transaction(STORE_NAME, 'readonly');
                    let store = tx.objectStore(STORE_NAME);
                    let req = store.get(key);
                    req.onsuccess = (e) => {
                        let res = e.target.result;
                        if (res) {
                            if (typeof res === 'string') resolve(JSON.parse(res));
                            else resolve(res);
                        } else {
                            resolve(null);
                        }
                    };
                    req.onerror = (e) => reject(e.target.error);
                } catch(e) { reject(e); }
            });
        }

        /* 100 पेक्षा जास्त आकडा टाकू न देणारा कडक नियम */
        function validateMaxLtvInput(el) {
            let val = parseFloat(el.value);
            if (val > 100) {
                el.value = 100;
            } else if (val < 0) {
                el.value = 0;
            }
        }

        window.addEventListener('pageshow', async function() {
            resetAllInputsToBlank();
            await initDB();
            await fetchFromMasterStream(false);
            setTimeout(() => checkForRemoteExcelUpdate(), 1000);
        });

        function resetAllInputsToBlank() {
            document.querySelectorAll('.form-input, .search-input').forEach(input => input.value = '');
            document.querySelectorAll('.form-select').forEach(select => select.selectedIndex = 0);
            selectedProductList = [];
            renderAllProductPanels();
            const dropdown = document.getElementById('modelDropdown');
            if (dropdown) dropdown.style.display = 'none';
        }

        async function checkForRemoteExcelUpdate() {
            const badge = document.getElementById('dataStatusBadge');
            try {
                let res = await fetch(GITHUB_COMMIT_API + "&t=" + Date.now());
                if (!res.ok) return;

                let commits = await res.json();
                if (commits && commits.length > 0) {
                    let latestCommitTime = new Date(commits[0].commit.committer.date).getTime();
                    let savedVersionTime = await getFromDB('master_data_version_time') || 0;

                    if (savedVersionTime > 0 && latestCommitTime > savedVersionTime) {
                        if (badge) {
                            badge.innerText = "🔄 UPDATING DATA...";
                            badge.style.background = "#f59e0b";
                            badge.style.color = "#000";
                        }
                        await saveToDB('master_data_version_time', latestCommitTime);
                        await fetchFromMasterStream(true);
                    } else if (savedVersionTime === 0) {
                        await saveToDB('master_data_version_time', latestCommitTime);
                    }
                }
            } catch(e) {}
        }

        async function fetchFromMasterStream(forceSync = false) {
            const badge = document.getElementById('dataStatusBadge');
            const searchInput = document.getElementById('modelSearchInput');
            let now = Date.now();

            try {
                if (!forceSync) {
                    let cachedTime = await getFromDB('master_data_time');
                    let cachedDbRecords = await getFromDB('cached_db_records');

                    if (cachedTime && cachedDbRecords && cachedDbRecords.length > 0 && (now - cachedTime < CACHE_DURATION_MS)) {
                        masterDbRecords = cachedDbRecords;
                        badge.innerText = `⚡ CACHED (${masterDbRecords.length})`;
                        badge.style.background = "#10b981";
                        badge.style.color = "#fff";
                        searchInput.disabled = false;
                        searchInput.placeholder = "Type Model or Brand...";
                        return;
                    }
                }

                badge.innerText = "DOWNLOADING...";
                badge.style.background = "#f59e0b";
                badge.style.color = "#000";

                const urlsToTry = [
                    PRIMARY_EXCEL_URL + '?t=' + now,
                    SECONDARY_EXCEL_URL + '?t=' + now,
                    LOCAL_EXCEL_URL + '?t=' + now
                ];

                let dataBuffer = null;
                for (let url of urlsToTry) {
                    try {
                        let res = await fetch(url);
                        if (res.ok) {
                            dataBuffer = await res.arrayBuffer();
                            break;
                        }
                    } catch(e) {}
                }

                if (!dataBuffer) throw new Error("Excel लोड अयशस्वी");

                let wb = XLSX.read(new Uint8Array(dataBuffer), { type: 'array' });
                let sheet1 = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { raw: false, defval: "" });
                let sheet2 = wb.SheetNames.length > 1 ? XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[1]], { raw: false, defval: "" }) : [];

                let allRows = [...sheet1, ...sheet2];

                masterDbRecords = allRows.map(row => {
                    return {
                        model: String(findVal(row, ['MODEL', 'BRANDMODEL', 'ASSET']) || "").toUpperCase().trim(),
                        brand: String(findVal(row, ['BRAND', 'MAKE']) || "").toUpperCase().trim(),
                        category: String(findVal(row, ['CATEGORY', 'CAT']) || "OTHER").toUpperCase().trim(),
                        mrp: parseFloat(findVal(row, ['MRP', 'PRICE', 'M.R.P'])) || 0,
                        tenure: parseInt(findVal(row, ['TOTALTENURE', 'TENURE', 'TA'])) || 0,
                        advEmi: parseInt(findVal(row, ['ADVANCEEMI', 'ADV'])) || 0,
                        dbd: parseFloat(findVal(row, ['DBD', 'DBD%'])) || 0,
                        pf: parseInt(findVal(row, ['PF', 'PROCESSINGFEE'])) || 0,
                        roi: parseFloat(findVal(row, ['ROI', 'ROI%'])) || 0
                    };
                }).filter(r => r.model !== "" && r.model !== "NON TIEUP");

                await saveToDB('cached_db_records', masterDbRecords);
                await saveToDB('master_data_time', now);

                badge.innerText = `READY (${masterDbRecords.length})`;
                badge.style.background = "#10b981";
                badge.style.color = "#fff";
                searchInput.disabled = false;
                searchInput.placeholder = "Type Model or Brand...";

            } catch (err) {
                console.error("Master Data Load Error:", err);
                let fallbackDb = await getFromDB('cached_db_records');
                if (fallbackDb && fallbackDb.length > 0) {
                    masterDbRecords = fallbackDb;
                    badge.innerText = `OFFLINE CACHE (${masterDbRecords.length})`;
                    badge.style.background = "#10b981";
                    badge.style.color = "#fff";
                    searchInput.disabled = false;
                    searchInput.placeholder = "Type Model or Brand...";
                } else {
                    badge.innerText = "OFFLINE ERROR";
                    badge.style.background = "#ef4444";
                    badge.style.color = "#fff";
                }
            }
        }

        async function forceRefreshMasterData() {
            await fetchFromMasterStream(true);
        }

        function findVal(row, keys) {
            let foundKey = Object.keys(row).find(k => keys.includes(k.toUpperCase().replace(/\s/g, '')));
            return foundKey ? row[foundKey] : null;
        }

        function handleModelSearch(query) {
            const dropdown = document.getElementById('modelDropdown');
            const q = query.trim().toUpperCase();

            if (!q) {
                dropdown.style.display = 'none';
                return;
            }

            let uniqueModels = [];
            let seen = new Set();

            masterDbRecords.forEach(r => {
                if ((r.model.includes(q) || r.brand.includes(q) || r.category.includes(q)) && !seen.has(r.model)) {
                    seen.add(r.model);
                    uniqueModels.push(r);
                }
            });

            if (uniqueModels.length === 0) {
                dropdown.innerHTML = `<div style="padding:10px; color:#888; text-align:center;">कोणतेही मॉडेल सापडले नाही.</div>`;
                dropdown.style.display = 'block';
                return;
            }

            dropdown.innerHTML = uniqueModels.slice(0, 30).map(m => `
                <div class="dropdown-item" onclick="addNewProductToBasket('${m.model.replace(/'/g, "\\'")}')">
                    <span>📱 ${m.brand ? `[${m.brand}] ` : ''}${m.model}</span>
                    <span style="font-size:10px; color:#94a3b8; background:#1e293b; padding:2px 5px; border-radius:3px;">${m.category}</span>
                </div>
            `).join('');

            dropdown.style.display = 'block';
        }

        function addNewProductToBasket(modelName) {
            const dropdown = document.getElementById('modelDropdown');
            const searchInput = document.getElementById('modelSearchInput');

            searchInput.value = '';
            dropdown.style.display = 'none';

            let modelSchemes = masterDbRecords.filter(r => r.model === modelName);
            let defaultMrp = modelSchemes[0] && modelSchemes[0].mrp > 0 ? modelSchemes[0].mrp : "";

            let newProduct = {
                id: 'prod_' + Date.now() + '_' + Math.floor(Math.random()*1000),
                name: modelName,
                invoice: defaultMrp,
                gtlRfc: "120K",
                margin: 0,
                dealerContri: 0,
                schemes: modelSchemes.map((s, idx) => ({ ...s, sId: 's_' + idx, disabled: false }))
            };

            selectedProductList.push(newProduct);
            renderAllProductPanels();
        }

        function removeProductFromBasket(pId) {
            selectedProductList = selectedProductList.filter(p => p.id !== pId);
            renderAllProductPanels();
        }

        function updateProductParam(pId, field, val) {
            let prod = selectedProductList.find(p => p.id === pId);
            if (prod) {
                prod[field] = val;
                renderProductTableOnly(pId);
            }
        }

        function recalcAllProducts() {
            selectedProductList.forEach(p => renderProductTableOnly(p.id));
        }

        function openAddSchemeModal(pId, pName) {
            document.getElementById('modalTargetProdId').value = pId;
            document.getElementById('addSchemeModalTitle').innerText = `➕ ${pName} मध्ये नवीन स्कीम जोडा`;
            document.getElementById('mTen').value = '';
            document.getElementById('mAdv').value = '0';
            document.getElementById('mDbd').value = '0';
            document.getElementById('mPf').value = '0';
            document.getElementById('mRoi').value = '0';
            document.getElementById('addSchemeModal').style.display = 'flex';
        }

        function closeAddSchemeModal() {
            document.getElementById('addSchemeModal').style.display = 'none';
        }

        function saveCustomSchemeFromField() {
            let pId = document.getElementById('modalTargetProdId').value;
            let ten = parseInt(document.getElementById('mTen').value) || 0;
            let adv = parseInt(document.getElementById('mAdv').value) || 0;
            let dbd = parseFloat(document.getElementById('mDbd').value) || 0;
            let pf = parseInt(document.getElementById('mPf').value) || 0;
            let roi = parseFloat(document.getElementById('mRoi').value) || 0;

            if (ten <= 0) {
                alert("कृपया वैध Tenure टाका!");
                return;
            }

            let prod = selectedProductList.find(p => p.id === pId);
            if (prod) {
                let newCustomScheme = {
                    model: prod.name,
                    tenure: ten,
                    advEmi: adv,
                    dbd: dbd,
                    pf: pf,
                    roi: roi,
                    sId: 'custom_' + Date.now(),
                    disabled: false,
                    isCustom: true
                };

                prod.schemes.unshift(newCustomScheme);
                closeAddSchemeModal();
                renderProductTableOnly(pId);
            }
        }

        function toggleSchemeStatus(pId, sId) {
            let prod = selectedProductList.find(p => p.id === pId);
            if (prod) {
                let s = prod.schemes.find(x => x.sId === sId);
                if (s) {
                    s.disabled = !s.disabled;
                    renderProductTableOnly(pId);
                }
            }
        }

        function renderAllProductPanels() {
            const container = document.getElementById('selectedProductsContainer');
            if (selectedProductList.length === 0) {
                container.innerHTML = "";
                return;
            }

            container.innerHTML = selectedProductList.map((prod, idx) => `
                <div class="product-panel" id="panel_${prod.id}">
                    <div class="panel-header">
                        <span class="panel-title">📱 #${idx+1} ${prod.name}</span>
                        <div class="btn-panel-action">
                            <button class="btn-add-scheme" onclick="openAddSchemeModal('${prod.id}', '${prod.name.replace(/'/g, "\\'")}')">➕ ADD SCHEME</button>
                            <button class="btn-quote" onclick="generateQuoteImage('${prod.id}')">📸 QUOTE</button>
                            <button class="btn-remove" onclick="removeProductFromBasket('${prod.id}')">✖</button>
                        </div>
                    </div>

                    <div class="sub-config-grid">
                        <div>
                            <label>INVOICE (₹)</label>
                            <input type="number" value="${prod.invoice}" placeholder="0" oninput="updateProductParam('${prod.id}', 'invoice', this.value)">
                        </div>
                        <div>
                            <label>GTL/RFC</label>
                            <select onchange="updateProductParam('${prod.id}', 'gtlRfc', this.value)">
                                <option value="120K" ${prod.gtlRfc === '120K' ? 'selected' : ''}>120K</option>
                                <option value="100K" ${prod.gtlRfc === '100K' ? 'selected' : ''}>100K</option>
                                <option value="80K" ${prod.gtlRfc === '80K' ? 'selected' : ''}>80K</option>
                                <option value="50K" ${prod.gtlRfc === '50K' ? 'selected' : ''}>50K</option>
                            </select>
                        </div>
                        <div>
                            <label>MARGIN (₹)</label>
                            <input type="number" value="${prod.margin}" placeholder="0" oninput="updateProductParam('${prod.id}', 'margin', this.value)">
                        </div>
                        <div>
                            <label>DEALER CONTRI (₹)</label>
                            <input type="number" value="${prod.dealerContri}" placeholder="0" oninput="updateProductParam('${prod.id}', 'dealerContri', this.value)">
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="scheme-table">
                            <thead>
                                <tr>
                                    <th>SCHEME</th>
                                    <th>LOAN</th>
                                    <th>DP</th>
                                    <th>EMI</th>
                                    <th>M</th>
                                    <th>DAY</th>
                                    <th>EXTRA</th>
                                    <th>ACTION</th>
                                </tr>
                            </thead>
                            <tbody id="tbody_${prod.id}"></tbody>
                        </table>
                    </div>
                </div>
            `).join('');

            selectedProductList.forEach(p => renderProductTableOnly(p.id));
        }

        /* आकडेमोड आणि नवीन सॉर्टिंग नियमावली */
        function renderProductTableOnly(pId) {
            let prod = selectedProductList.find(p => p.id === pId);
            if (!prod) return;

            const tbody = document.getElementById(`tbody_${pId}`);
            if (!tbody) return;

            let approvedLimit = parseFloat(document.getElementById('approvedVal').value) || 0;
            let rawMaxLtv = document.getElementById('maxLtvVal').value || "100";
            let maxLtv = Math.min(100, Math.max(0, parseFloat(rawMaxLtv) || 100)); // 0 ते 100 च्या मधेच राहील
            let custType = document.getElementById('typeVal').value || "NEW";
            let emiCap = parseFloat(document.getElementById('cappingVal').value) || 0;

            let invoiceAmount = parseFloat(prod.invoice) || 0;
            let margin = parseFloat(prod.margin) || 0;
            let dealerContri = parseFloat(prod.dealerContri) || 0;

            let baseFee = 850;
            if (custType === 'EMI CARD' || custType === 'VIRTUAL CARD') baseFee = 270;
            else if (custType === 'W/O CARD') baseFee = 320;

            let totalFees = baseFee + margin + dealerContri;

            // 1. Max LTV नुसार फिल्टर करा
            let eligibleSchemes = prod.schemes.filter(s => {
                if (s.tenure <= 0) return false;
                let schemeLtv = ((s.tenure - s.advEmi) / s.tenure) * 100;
                return schemeLtv <= maxLtv;
            });

            if (eligibleSchemes.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="color:#f87171; padding:10px;">Max LTV (${maxLtv}%) च्या मर्यादेत एकही स्कीम नाही.</td></tr>`;
                return;
            }

            // 2. कॅल्क्युलेशन ऑब्जेक्ट्स तयार करा
            let calculatedRows = eligibleSchemes.map(s => {
                let price = invoiceAmount > 0 ? invoiceAmount : (s.mrp > 0 ? s.mrp : (approvedLimit > 0 ? approvedLimit : 30000));
                let months = Math.max(1, s.tenure - s.advEmi);

                let nbfcMaxL = approvedLimit > 0 ? (approvedLimit * s.tenure) / (months || 1) : price;
                let loan = Math.min(price, nbfcMaxL);

                let schemeLtv = ((s.tenure - s.advEmi) / s.tenure) * 100;
                if (schemeLtv > maxLtv) loan = Math.floor(price * (maxLtv / 100));

                let minAllowedLoan = price * 0.50;
                if (loan < minAllowedLoan) loan = minAllowedLoan;

                let dbdRate = (s.dbd * 1.18 / 100);
                let roiRate = s.roi / 1200;
                let roiRateDP = roiRate * s.advEmi;

                let baseEmi = loan / s.tenure;
                if (baseEmi > 0 && baseEmi < 900) baseEmi = 900;

                let roiInEmi = loan * roiRate;
                let emi = baseEmi + roiInEmi;

                if (emiCap > 0 && emi > emiCap) {
                    loan = Math.max(minAllowedLoan, (emiCap / ((1 / s.tenure) + roiRate)));
                    baseEmi = loan / s.tenure;
                    emi = baseEmi + (loan * roiRate);
                }

                let roiInDp = loan * roiRateDP;
                let dbdAmt = loan * dbdRate;
                let dpExact = price - loan + (baseEmi * s.advEmi) + dbdAmt + s.pf + totalFees + roiInDp;
                let dp = Math.ceil(dpExact / 10) * 10;

                let perDay = Math.round(emi / 30);
                let extraCharges = Math.round((dp + (emi * months)) - price);

                return {
                    scheme: s,
                    loan,
                    dp,
                    emi,
                    months,
                    perDay,
                    extraCharges,
                    disabled: s.disabled,
                    sId: s.sId,
                    isCustom: s.isCustom
                };
            });

            // 3. ✨ तुमच्या अटींनुसार अचूक सॉर्टिंग (DP चढता -> EMI चढता -> महिने उतरता)
            calculatedRows.sort((a, b) => {
                // १. कमी डाऊन पेमेंट सर्वात वरती
                if (a.dp !== b.dp) {
                    return a.dp - b.dp;
                }
                // २. डाऊन पेमेंट समान असल्यास, कमी ईएमआय सर्वात वरती
                if (a.emi !== b.emi) {
                    return a.emi - b.emi;
                }
                // ३. ईएमआय पण समान असल्यास, सर्वात जास्त महिने वरती
                return b.months - a.months;
            });

            // 4. HTML रेंडर करा
            tbody.innerHTML = calculatedRows.map(row => {
                let s = row.scheme;
                let rowClass = row.disabled ? "row-disabled" : "";
                let actionBtn = row.disabled 
                    ? `<button class="btn-toggle-row btn-ena" onclick="toggleSchemeStatus('${prod.id}', '${row.sId}')">✅ चालू</button>`
                    : `<button class="btn-toggle-row btn-dis" onclick="toggleSchemeStatus('${prod.id}', '${row.sId}')">🚫 बंद</button>`;

                let customBadge = row.isCustom ? `<span style="font-size:9px; color:#10b981;">(FIELD)</span>` : '';

                return `
                    <tr class="${rowClass}">
                        <td style="color:#60a5fa; font-weight:900;">${s.tenure}/${s.advEmi} ${customBadge}</td>
                        <td style="color:#34d399; font-weight:900;">₹${Math.floor(row.loan).toLocaleString()}</td>
                        <td style="color:#f59e0b; font-weight:900;">₹${Math.round(row.dp).toLocaleString()}</td>
                        <td style="color:#38bdf8; font-weight:900;">₹${Math.round(row.emi).toLocaleString()}</td>
                        <td style="color:#e2e8f0;">${row.months}</td>
                        <td style="color:#fb923c;">₹${row.perDay.toLocaleString()}</td>
                        <td style="color:#f87171;">₹${Math.max(0, row.extraCharges).toLocaleString()}</td>
                        <td>${actionBtn}</td>
                    </tr>
                `;
            }).join('');
        }

        /* 📸 कोट इमेज मध्ये सिनेरियोमधील सर्व इनपुट्स दाखवणारे फंक्शन */
        function generateQuoteImage(pId) {
            let prod = selectedProductList.find(p => p.id === pId);
            if (!prod) return;

            let tableElement = document.getElementById(`tbody_${pId}`);
            if (!tableElement || tableElement.querySelectorAll('tr:not(.row-disabled)').length === 0) {
                alert("कोटेशनसाठी किमान एक ॲक्टिव्ह स्कीम आवश्यक आहे!");
                return;
            }

            // सिनेरियोचे सर्व इनपुट्स
            let custType = document.getElementById('typeVal').value || "NEW";
            let approvedLimit = document.getElementById('approvedVal').value || "0";
            let maxLtv = document.getElementById('maxLtvVal').value || "100";
            let capping = document.getElementById('cappingVal').value || "NONE";

            // मॉडेलचे स्वतःचे इनपुट्स
            let price = prod.invoice || "0";
            let gtlRfc = prod.gtlRfc || "-";
            let margin = prod.margin || "0";
            let dealerContri = prod.dealerContri || "0";

            let quoteDiv = document.createElement('div');
            quoteDiv.style.width = "480px";
            quoteDiv.style.padding = "16px";
            quoteDiv.style.background = "#060e22";
            quoteDiv.style.color = "#ffffff";
            quoteDiv.style.borderRadius = "8px";
            quoteDiv.style.border = "2px solid #243b6b";
            quoteDiv.style.fontFamily = "sans-serif";
            quoteDiv.style.position = "absolute";
            quoteDiv.style.top = "-9999px";

            quoteDiv.innerHTML = `
                <div style="background: linear-gradient(180deg, #1e3a68 0%, #0c2044 100%); padding: 12px; border-radius: 6px; text-align: center; margin-bottom: 12px; border: 1px solid #38bdf8;">
                    <h2 style="font-size: 20px; font-weight: 900; color: #ffffff; margin-bottom: 8px;">🎉 SPECIAL LOAN OFFER</h2>
                    
                    <!-- सिनेरियोचे सर्व इनपुट्स ग्रिड -->
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 6px; font-size: 11px; font-weight: bold; text-align: left;">
                        <div><span style="color:#94a3b8;">CUSTOMER TYPE:</span> <span style="color:#38bdf8;">${custType}</span></div>
                        <div><span style="color:#94a3b8;">APPROVED LIMIT:</span> <span style="color:#34d399;">₹${Number(approvedLimit).toLocaleString()}</span></div>
                        <div><span style="color:#94a3b8;">MAX LTV:</span> <span style="color:#f59e0b;">${maxLtv}%</span></div>
                        <div><span style="color:#94a3b8;">EMI CAPPING:</span> <span style="color:#f87171;">${capping}</span></div>
                        <div><span style="color:#94a3b8;">GTL/RFC:</span> <span>${gtlRfc}</span></div>
                        <div><span style="color:#94a3b8;">MARGIN:</span> <span>₹${margin}</span></div>
                        <div><span style="color:#94a3b8;">DEALER CONTRI:</span> <span>₹${dealerContri}</span></div>
                        <div><span style="color:#94a3b8;">INVOICE PRICE:</span> <span style="color:#38bdf8;">₹${Number(price).toLocaleString()}</span></div>
                    </div>
                </div>

                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px; border-bottom: 1px solid #1c2e4a; padding-bottom: 6px;">
                    <h3 style="font-size: 16px; font-weight: 900; color: #f97316;">📱 ${prod.name}</h3>
                    <span style="background: #0284c7; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 900;">INV: ₹${Number(price).toLocaleString()}</span>
                </div>

                <table style="width: 100%; border-collapse: collapse; font-size: 11px; text-align: center;">
                    <thead>
                        <tr style="background: #064e3b; color: #ffffff;">
                            <th style="padding: 6px 3px; border: 1px solid #047857;">SCHEME</th>
                            <th style="padding: 6px 3px; border: 1px solid #047857;">LOAN</th>
                            <th style="padding: 6px 3px; border: 1px solid #047857;">DP</th>
                            <th style="padding: 6px 3px; border: 1px solid #047857;">EMI</th>
                            <th style="padding: 6px 3px; border: 1px solid #047857;">M</th>
                            <th style="padding: 6px 3px; border: 1px solid #047857;">DAY</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${Array.from(tableElement.querySelectorAll('tr:not(.row-disabled)')).map(r => {
                            let cols = r.querySelectorAll('td');
                            if (cols.length < 6) return '';
                            return `
                                <tr style="border-bottom: 1px solid #1c2e4a; font-weight: bold;">
                                    <td style="padding: 6px 3px; color: #60a5fa;">${cols[0].innerText.replace('(FIELD)', '').trim()}</td>
                                    <td style="padding: 6px 3px; color: #34d399;">${cols[1].innerText}</td>
                                    <td style="padding: 6px 3px; color: #f59e0b;">${cols[2].innerText}</td>
                                    <td style="padding: 6px 3px; color: #38bdf8;">${cols[3].innerText}</td>
                                    <td style="padding: 6px 3px; color: #e2e8f0;">${cols[4].innerText}</td>
                                    <td style="padding: 6px 3px; color: #fb923c;">${cols[5].innerText}</td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;

            document.body.appendChild(quoteDiv);

            html2canvas(quoteDiv, { scale: 2, useCORS: true }).then(canvas => {
                document.body.removeChild(quoteDiv);
                let imgData = canvas.toDataURL("image/png");
                document.getElementById('generatedQuoteImg').src = imgData;
                document.getElementById('downloadImgBtn').href = imgData;
                document.getElementById('downloadImgBtn').download = `${prod.name}_Loan_Quote.png`;
                document.getElementById('imageViewerModal').style.display = 'flex';
            });
        }

        document.addEventListener('click', function(e) {
            const dropdown = document.getElementById('modelDropdown');
            const searchInput = document.getElementById('modelSearchInput');
            if (dropdown && !dropdown.contains(e.target) && e.target !== searchInput) {
                dropdown.style.display = 'none';
            }
        });
    </script>
</body>
</html>
