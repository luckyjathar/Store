<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blank Add Product</title>
    <!-- Excel फाईल वाचण्यासाठी लागणारी लायब्ररी -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        body { font-family: sans-serif; padding: 50px; text-align: center; background-color: #f8f9fa; }
        #searchModal { display: none; position: fixed; top: 20%; left: 50%; transform: translate(-50%, 0); background: white; padding: 20px; border: 1px solid #ccc; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 320px; z-index: 1000; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 12px 25px; font-size: 16px; cursor: pointer; background: #0984e3; color: white; border: none; border-radius: 5px; font-weight: bold; }
        button:hover { opacity: 0.9; }
        .result-item { padding: 12px 10px; border-bottom: 1px solid #eee; cursor: pointer; text-align: left; font-size: 14px; font-weight: bold; color: #333; }
        .result-item:hover { background: #e3f2fd; color: #0984e3; }
    </style>
</head>
<body>

    <!-- फक्त Add Product बटण -->
    <button onclick="document.getElementById('searchModal').style.display='block'">➕ Add Product</button>

    <!-- सर्च बॉक्स (Modal) -->
    <div id="searchModal">
        <h3 style="margin-top:0; color: #333;">🔍 Search Product</h3>
        <input type="text" id="searchInput" onkeyup="searchModel()" placeholder="Type model name...">
        <div id="searchResults" style="max-height: 250px; overflow-y: auto; border: 1px solid #eee; display:none; margin-bottom: 15px; border-radius: 4px;"></div>
        <button onclick="document.getElementById('searchModal').style.display='none'" style="background: #e74c3c; width: 100%;">Close</button>
    </div>

    <!-- सिलेक्ट केलेले मॉडेल दिसण्यासाठी जागा -->
    <div id="selectedProduct" style="margin-top: 30px; font-size: 22px; font-weight: bold; color: #27ae60;"></div>

    <script>
        let db_records = [];
        const GITHUB_RAW_URL = "https://raw.githubusercontent.com/luckyjathar/testcalculator/main/master_data.xlsx";

        // 1. पेज उघडताच Excel फाईल लोड करणे
        async function loadExcelData() {
            try {
                let res = await fetch(GITHUB_RAW_URL + '?t=' + new Date().getTime());
                let dataBuffer = await res.arrayBuffer();
                let wb = XLSX.read(new Uint8Array(dataBuffer), { type: 'array' });
                
                let sheetData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
                
                // फक्त मॉडेलची नावे वेगळी काढणे
                db_records = sheetData.map(r => {
                    let keys = Object.keys(r);
                    let modelKey = keys.find(k => ['MODEL', 'PRODUCT', 'MODEL NAME'].includes(k.toUpperCase().trim()));
                    return { model: modelKey ? String(r[modelKey]).trim().toUpperCase() : "" };
                }).filter(x => x.model !== "");
                
                console.log("Excel Data Loaded successfully!");
            } catch(err) {
                console.error("Error loading Excel:", err);
            }
        }

        // 2. मॉडेल सर्च करणे
        function searchModel() {
            let q = document.getElementById('searchInput').value.toUpperCase().trim();
            let resultsDiv = document.getElementById('searchResults');
            
            if (!q) { resultsDiv.style.display = 'none'; return; }
            
            // टाईप केलेल्या शब्दानुसार मॉडेल शोधणे (टॉप 10)
            let matches = db_records.filter(r => r.model.includes(q)).map(r => r.model);
            matches = [...new Set(matches)].slice(0, 10); 
            
            if (matches.length === 0) {
                resultsDiv.innerHTML = '<div style="padding:10px; color:red; font-size: 13px;">No models found.</div>';
            } else {
                resultsDiv.innerHTML = matches.map(m => 
                    `<div class="result-item" onclick="selectModel('${m.replace(/'/g, "\\'")}')">📱 ${m}</div>`
                ).join('');
            }
            resultsDiv.style.display = 'block';
        }

        // 3. मॉडेल सिलेक्ट झाल्यावर काय करायचे
        function selectModel(modelName) {
            document.getElementById('searchModal').style.display = 'none';
            document.getElementById('searchInput').value = '';
            document.getElementById('searchResults').style.display = 'none';
            
            // सिलेक्ट केलेले मॉडेल स्क्रीनवर दाखवणे
            document.getElementById('selectedProduct').innerText = "✅ Selected: " + modelName;
        }

        // फाईल रन होताच डेटा लोड सुरू करा
        window.onload = loadExcelData;
    </script>

</body>
</html>
