<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Scheme Calculator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        /* Compact Mobile View Styling */
        body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 5px; background-color: #f0f2f5; margin: 0 auto; max-width: 480px; }
        
        /* Minimalist Accordions to save space */
        .section-card { background: white; margin-bottom: 6px; border-bottom: 1px solid #ddd; }
        .acc-header { padding: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: #fff; }
        .acc-header.active { background: #f0f8ff; border-bottom: 1px solid #eee; }
        .acc-header h3 { margin: 0; color: #034887; font-size: 14px; }
        .acc-content { padding: 8px 10px; display: none; }
        
        /* Inputs styling optimized for space */
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        input, select { padding: 4px 6px; font-size: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; outline: none; width: 100%; height: 32px; font-weight: bold; color: #333; }
        input:focus, select:focus { border-color: #0984e3; background: #f0f8ff; }
        input:disabled, select:disabled { background: #e9ecef; color: #888; }
        label { font-size: 9px; font-weight: bold; color: #666; text-transform: uppercase; margin-bottom: 2px; display: block; }

        /* Grid Layouts */
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 6px; }

        /* Search Results & Buttons */
        #searchResults { position: absolute; top: 100%; left: 0; right: 0; background: white; max-height: 200px; overflow-y: auto; border: 1px solid #ccc; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: none; z-index: 1000; }
        .result-item { padding: 10px; border-bottom: 1px solid #eee; font-size: 12px; font-weight: bold; color: #333; }
        .result-item:hover { background: #e3f2fd; color: #0984e3; }
        .btn-secondary { flex: 1; padding: 8px; background: #e2e8f0; color: #334155; border: none; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .btn-action { padding: 4px 6px; font-size: 9px; font-weight: bold; color: white; background: #0984e3; border: none; border-radius: 3px; cursor: pointer; }

        /* Final Calculation Styles */
        .final-calc-wrapper { background: #fff; border: 2px solid #0984e3; border-radius: 6px; margin-top: 10px; overflow: hidden; }
        .product-header { background: #0984e3; color: white; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: bold; cursor: pointer; }
        .product-body { padding: 6px; background: #f8fafc; }
        .remove-btn { color: #ffcccc; background: none; border: none; font-size: 14px; font-weight: bold; padding: 0 5px; cursor: pointer; }

        /* Realtime Info Bar in Final Calc */
        .info-bar { background: #fff; padding: 6px; border-radius: 4px; border: 1px solid #ddd; font-size: 10px; margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
        .info-bar span { color: #555; }
        .info-bar b { color: #034887; }

        /* Alert Banner */
        .alert-banner { background: #ffebee; color: #c62828; font-size: 10px; font-weight: bold; padding: 4px 8px; border-radius: 4px; margin-bottom: 6px; text-align: center; border: 1px solid #ffcdd2; }

        /* Compact Table */
        .scheme-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .scheme-table th, .scheme-table td { padding: 4px 2px; font-size: 11px; font-weight: bold; text-align: center; }
        .scheme-table th { background: #034887; color: white; font-size: 9px; text-transform: uppercase; }
        .row-main td { padding-top: 6px; }
        .row-sub td { padding: 2px 4px 6px 4px; font-size: 9px; color: #666; text-align: left; border-bottom: 2px solid #ddd; background: #f8fafc; }
        
        /* Ultra Compact Loan Input */
        .loan-input { width: 90%; height: 20px; padding: 0; font-size: 11px; text-align: center; border: none; border-bottom: 1px dashed #d35400; background: transparent; color: #d35400; font-weight: 900; }
        .loan-input:focus { background: #fff3e0; outline: none; }

        .btn-copy-img { width: 100%; padding: 8px; font-size: 12px; font-weight: bold; color: white; background: #27ae60; border: none; border-radius: 4px; margin-bottom: 8px; cursor: pointer; }

        /* Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 15px; border-radius: 6px; width: 90%; max-width: 400px; text-align: center; }
    </style>
</head>
<body>

    <div id="loadingStatus" style="text-align: center; font-size: 12px; color: #e67e22; font-weight: bold;">⏳ Loading Master Data...</div>

    <!-- 1. 👤 Customer Eligibility (Moved to Top) -->
    <div class="section-card">
        <div class="acc-header active" onclick="toggleAcc('eligibilityContent', 'eligibilityIcon', this)">
            <h3>👤 Customer Eligibility</h3>
            <span id="eligibilityIcon">▼</span>
        </div>
        <div id="eligibilityContent" class="acc-content" style="display: block;">
            <div class="grid-4">
                <div>
                    <label>Type</label>
                    <select id="custType" onchange="handleInputUpdate()">
                        <option value="" selected>None</option>
                        <option value="NEW">NEW</option>
                        <option value="EMI CARD">EMI</option>
                        <option value="INSTA EMI CARD">INSTA</option>
                        <option value="W/O CARD">W/O</option>
                    </select>
                </div>
                <div><label>Limit</label><input type="number" id="custLimit" placeholder="0" oninput="handleInputUpdate()"></div>
                <div><label>LTV %</label><input type="number" id="custLtv" value="100" oninput="handleInputUpdate()"></div>
                <div><label>EMI Cap</label><input type="number" id="custCap" placeholder="0" oninput="handleInputUpdate()"></div>
            </div>
        </div>
    </div>

    <!-- 2. 🔍 Search Product -->
    <div class="section-card">
        <div class="acc-header" onclick="toggleAcc('searchContent', 'searchIcon', this)">
            <h3>🔍 Search Product</h3>
            <span id="searchIcon">▶</span>
        </div>
        <div id="searchContent" class="acc-content">
            <div style="position: relative;">
                <input type="text" id="searchInput" onkeyup="searchModel()" placeholder="Type model name..." disabled>
                <div id="searchResults"></div>
            </div>
            
            <div id="selectedProductArea" style="display: none; margin-top: 10px; border-top: 1px dashed #ccc; padding-top: 8px;">
                <div style="text-align:center; font-weight:900; color:#034887; font-size:13px; margin-bottom:8px;" id="selectedProduct"></div>
                <div class="grid-2">
                    <div>
                        <label style="color:#27ae60;">Invoice Amount (₹)</label>
                        <input type="number" id="custInvoice" oninput="onInvoiceChange()" style="border-color:#27ae60; background:#f0fdf4;">
                    </div>
                    <div>
                        <label>Global Loan (₹)</label>
                        <input type="number" id="custLoan" placeholder="Optional" oninput="handleInputUpdate()">
                    </div>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn-secondary" onclick="openNonTieupModal()">+ NON TIE-UP</button>
                <button class="btn-secondary" onclick="openManualModal()">+ MANUAL</button>
            </div>
        </div>
    </div>

    <!-- 3. ⚙️ Charges & Margin -->
    <div class="section-card">
        <div class="acc-header" onclick="toggleAcc('advancedContent', 'advancedIcon', this)">
            <h3>⚙️ Charges & Margin</h3>
            <span id="advancedIcon">▶</span>
        </div>
        <div id="advancedContent" class="acc-content">
            <div class="grid-3">
                <div><label>Target DP</label><input type="number" id="advTarget" placeholder="0" oninput="handleInputUpdate()"></div>
                <div>
                    <label>GTL (₹)</label>
                    <select id="advGtl" onchange="handleInputUpdate()">
                        <option value="0">0</option><option value="699">699</option><option value="1199">1199</option>
                        <option value="1499">1499</option><option value="1799">1799</option><option value="2398">2398</option>
                    </select>
                </div>
                <div>
                    <label>RFC (₹)</label>
                    <select id="advRfc" onchange="handleInputUpdate()">
                        <option value="0">0</option>
                    </select>
                </div>
                <div><label>EXW (₹)</label><input type="number" id="advExw" placeholder="0" oninput="handleInputUpdate()"></div>
                <div><label>Margin (₹)</label><input type="number" id="advMargin" placeholder="0" oninput="handleInputUpdate()"></div>
                <div><label>Dealer</label><input type="number" id="advDealer" placeholder="0" oninput="handleInputUpdate()"></div>
            </div>
        </div>
    </div>

    <!-- 📊 Final Calculation -->
    <div id="finalCalcSection" style="display: none; margin-top: 10px;">
        <div style="text-align:center; background:#e3f2fd; padding:6px; border-radius:6px 6px 0 0; border:2px solid #0984e3; border-bottom:none;">
            <h3 style="margin:0; color:#034887; font-size:14px;">📊 Final Calculation</h3>
        </div>
        <div style="background:#fff; border:2px solid #0984e3; border-top:none; border-radius:0 0 6px 6px; padding:6px;">
            <button class="btn-copy-img" onclick="copyImage()">🖼️ COPY IMAGE</button>
            <div id="productsContainer"></div>
        </div>
    </div>

    <!-- Modals for Non-Tieup & Manual -->
    <div id="nonTieupModal" class="modal">
        <div class="modal-content">
            <h3 style="color:#034887; margin-top:0;">Select Category</h3>
            <select id="ntCategory" style="margin-bottom: 10px; width:100%; height:35px;"></select>
            <div style="display:flex; gap:10px;">
                <button class="btn-secondary" style="background:#27ae60; color:white;" onclick="addNonTieupProduct()">Add</button>
                <button class="btn-secondary" onclick="document.getElementById('nonTieupModal').style.display='none'">Cancel</button>
            </div>
        </div>
    </div>
    <div id="manualModal" class="modal">
        <div class="modal-content">
            <h3 style="color:#034887; margin-top:0;">Manual Scheme</h3>
            <div style="margin-bottom:8px;"><label>Product Name</label><input type="text" id="manProdName" placeholder="E.g. VIVO V27"></div>
            <div class="grid-2">
                <div><label>Tenure</label><input type="number" id="manTen" placeholder="12"></div>
                <div><label>Advance</label><input type="number" id="manAdv" placeholder="4"></div>
                <div><label>DBD %</label><input type="number" id="manDbd" placeholder="0"></div>
                <div><label>PF (₹)</label><input type="number" id="manPf" placeholder="0"></div>
                <div><label>ROI %</label><input type="number" id="manRoi" placeholder="0"></div>
                <div><label>Fixed EMI</label><input type="number" id="manFix" placeholder="0"></div>
            </div>
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button class="btn-secondary" style="background:#0984e3; color:white;" onclick="addManualProduct()">Add</button>
                <button class="btn-secondary" onclick="document.getElementById('manualModal').style.display='none'">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        let db_records = [];
        let current_products = [];
        let activeProductIndex = -1;
        let activeCategory = "";
        const GITHUB_RAW_URL = "https://raw.githubusercontent.com/luckyjathar/testcalculator/main/master_data.xlsx";

        function toggleAcc(contentId, iconId, headerEl) {
            const sections = ['searchContent', 'eligibilityContent', 'advancedContent'];
            const icons = ['searchIcon', 'eligibilityIcon', 'advancedIcon'];
            const headers = document.querySelectorAll('.acc-header');
            let isOpen = document.getElementById(contentId).style.display === "block";

            sections.forEach(id => document.getElementById(id).style.display = "none");
            icons.forEach(id => document.getElementById(id).innerText = "▶");
            headers.forEach(el => el.classList.remove('active'));

            if (!isOpen) {
                document.getElementById(contentId).style.display = "block";
                document.getElementById(iconId).innerText = "▼";
                headerEl.classList.add('active');
            }
        }

        function isMobileCat(cat) {
            let c = String(cat).toUpperCase().replace(/\s+/g, '');
            return c.includes('PHONE') || c.includes('TABLET') || c.includes('WATCH') || c.includes('MOBILE');
        }

        function getRfcSlab(val) {
            if (val < 8000) return 0; if (val <= 10000) return 1109; if (val <= 15000) return 1631;
            if (val <= 20000) return 2147; if (val <= 25000) return 2695; if (val <= 30000) return 3215;
            if (val <= 35000) return 3648; if (val <= 40000) return 4219; if (val <= 50000) return 5720;
            if (val <= 60000) return 8686; if (val <= 100000) return 11438; if (val <= 200000) return 16677;
            return 0;
        }

        function standardizeCategory(cat) {
            if (!cat) return "OTHER";
            let c = String(cat).toUpperCase().replace(/\s+/g, '');
            if (c.includes('PHONE') || c.includes('MOBILE') || c.includes('TABLET')) return "PHONE(WEB-MOBILE)";
            if (c.includes('AC') || c.includes('AIR')) return "AC";
            if (c.includes('TV') || c.includes('LED') || c.includes('TELEVISION')) return "LED TV";
            if (c.includes('WASHING')) return "WASHING MACHINE";
            if (c.includes('REF') || c.includes('FRIDGE')) return "REFRIGERATOR";
            return String(cat).toUpperCase().trim();
        }

        async function loadExcelData() {
            try {
                let res = await fetch(GITHUB_RAW_URL + '?t=' + new Date().getTime());
                let dataBuffer = await res.arrayBuffer();
                let wb = XLSX.read(new Uint8Array(dataBuffer), { type: 'array' });
                
                let s1 = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:""});
                let s2 = wb.SheetNames.length > 1 ? XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[1]], {defval:""}) : [];
                
                function mapR(row, type) {
                    let keys = Object.keys(row);
                    let mKey = keys.find(k => ['MODEL','PRODUCT','MODELNAME'].includes(k.toUpperCase().replace(/\s/g,'')));
                    let cKey = keys.find(k => ['CATEGORY','CAT','ASSET'].includes(k.toUpperCase().replace(/\s/g,'')));
                    let model = mKey ? row[mKey] : null;
                    if (!model && type !== 'NON TIEUP') return null;
                    return {
                        model: type === 'NON TIEUP' ? 'NON TIEUP' : String(model).trim().toUpperCase(),
                        category: standardizeCategory(cKey ? row[cKey] : ""),
                        mrp: parseFloat(row[keys.find(k=>k.toUpperCase().includes('MRP'))]) || 0,
                        tenure: parseInt(row[keys.find(k=>k.toUpperCase().includes('TENURE')||k.toUpperCase()=='TA')]) || 0,
                        advEmi: parseInt(row[keys.find(k=>k.toUpperCase().includes('ADV'))]) || 0,
                        dbd: parseFloat(row[keys.find(k=>k.toUpperCase().includes('DBD'))]) || 0,
                        roi: parseFloat(row[keys.find(k=>k.toUpperCase().includes('ROI'))]) || 0,
                        pf: parseInt(row[keys.find(k=>k.toUpperCase().includes('PF')||k.toUpperCase().includes('PROCESSING'))]) || 0,
                        fixedEmi: parseFloat(row[keys.find(k=>k.toUpperCase().includes('FIXED'))]) || 0,
                        minLoan: parseFloat(row[keys.find(k=>k.toUpperCase().includes('MIN'))]) || 0,
                        maxLoan: parseFloat(row[keys.find(k=>k.toUpperCase().includes('MAX'))]) || 9999999
                    };
                }
                
                db_records = [...s1.map(r=>mapR(r,"REG")), ...s2.map(r=>mapR(r,"NON TIEUP"))].filter(x=>x && x.model !== "");
                document.getElementById('loadingStatus').style.display = 'none';
                document.getElementById('searchInput').disabled = false;
            } catch(e) { document.getElementById('loadingStatus').innerText = "⚠️ Error loading data."; }
        }

        function searchModel() {
            let q = document.getElementById('searchInput').value.toUpperCase().trim();
            let resDiv = document.getElementById('searchResults');
            if (!q) { resDiv.style.display = 'none'; return; }
            
            let matches = [...new Set(db_records.filter(r => r.model !== 'NON TIEUP' && r.model.includes(q)).map(r => r.model))].slice(0, 15);
            resDiv.innerHTML = matches.length ? matches.map(m => `<div class="result-item" onclick="selectModel('${m.replace(/'/g, "\\'")}', false)">📱 ${m}</div>`).join('') : '<div style="padding:10px; color:red; font-size:12px; text-align:center;">No match found.</div>';
            resDiv.style.display = 'block';
        }

        function selectModel(modelName, isNonTieup = false, manualSchemes = null) {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchResults').style.display = 'none';

            let rawSchemes = [], mrp = 0;
            if (manualSchemes) { 
                rawSchemes = manualSchemes; 
            } else if (!isNonTieup) {
                let rec = db_records.find(r => r.model === modelName);
                if(rec) { activeCategory = rec.category; mrp = rec.mrp; }
                rawSchemes = db_records.filter(r => r.model === modelName);
            } else {
                rawSchemes = db_records.filter(r => r.model === "NON TIEUP" && r.category === activeCategory);
            }

            document.getElementById('selectedProduct').innerText = "📱 " + modelName;
            document.getElementById('selectedProductArea').style.display = 'block';

            document.getElementById('custInvoice').value = mrp > 0 ? mrp : "";
            document.getElementById('custLoan').value = "";
            onInvoiceChange(); 

            let pInputs = {
                type: document.getElementById('custType').value || '',
                limit: parseFloat(document.getElementById('custLimit').value) || 0,
                inv: parseFloat(document.getElementById('custInvoice').value) || 0,
                loan: parseFloat(document.getElementById('custLoan').value) || 0,
                ltv: parseFloat(document.getElementById('custLtv').value) || 100,
                cap: parseFloat(document.getElementById('custCap').value) || 0,
                target: parseFloat(document.getElementById('advTarget').value) || 0,
                gtl: parseFloat(document.getElementById('advGtl').value) || 0,
                rfc: parseFloat(document.getElementById('advRfc').value) || 0,
                exw: parseFloat(document.getElementById('advExw').value) || 0,
                margin: parseFloat(document.getElementById('advMargin').value) || 0,
                dealer: parseFloat(document.getElementById('advDealer').value) || 0,
                overrides: {}
            };

            current_products.push({ name: isNonTieup ? `NON TIEUP - ${activeCategory}` : modelName, category: activeCategory, isNonTieup, inputs: pInputs, rawSchemes, calculatedData: [] });
            activeProductIndex = current_products.length - 1;

            document.getElementById('finalCalcSection').style.display = 'block';
            toggleAcc('none', 'none', document.createElement('div')); 
            recalculateProduct(activeProductIndex);
        }

        function removeProduct(index, event) {
            event.stopPropagation();
            current_products.splice(index, 1);
            if (current_products.length === 0) {
                activeProductIndex = -1;
                document.getElementById('finalCalcSection').style.display = 'none';
                document.getElementById('selectedProductArea').style.display = 'none';
                ['custInvoice','custLoan','advTarget','advExw','advMargin','advDealer'].forEach(id => document.getElementById(id).value = '');
                document.getElementById('advGtl').value = '0';
                document.getElementById('advRfc').innerHTML = '<option value="0">0</option>';
            } else {
                activeProductIndex = current_products.length - 1;
                syncUIWithActiveProduct();
                recalculateProduct(activeProductIndex);
            }
        }

        function switchActiveProduct(index) {
            activeProductIndex = (activeProductIndex === index) ? -1 : index;
            syncUIWithActiveProduct();
            renderFinalCalculation();
        }

        function syncUIWithActiveProduct() {
            if(activeProductIndex === -1) { document.getElementById('selectedProductArea').style.display = 'none'; return; }
            let p = current_products[activeProductIndex];
            document.getElementById('selectedProductArea').style.display = 'block';
            document.getElementById('selectedProduct').innerText = "📱 " + p.name;
            
            let ids = ['custType','custLimit','custInvoice','custLoan','custLtv','custCap','advTarget','advGtl','advExw','advMargin','advDealer'];
            let keys = ['type','limit','inv','loan','ltv','cap','target','gtl','exw','margin','dealer'];
            ids.forEach((id, i) => document.getElementById(id).value = p.inputs[keys[i]] || (id==='custLtv'?100:''));
            
            updateRfcDropdown(p.inputs.inv, p.category);
            document.getElementById('advRfc').value = p.inputs.rfc || "0";
        }

        function updateRfcDropdown(inv, cat) {
            let rfcSel = document.getElementById('advRfc');
            rfcSel.innerHTML = `<option value="0">0</option>`;
            if (isMobileCat(cat)) {
                let slab = getRfcSlab(inv);
                if(slab > 0) rfcSel.innerHTML += `<option value="${slab}">${slab}</option>`;
                document.getElementById('advExw').disabled = true;
                rfcSel.disabled = false;
                return slab;
            } else {
                rfcSel.disabled = true;
                document.getElementById('advExw').disabled = false;
                return 0;
            }
        }

        function onInvoiceChange() {
            let inv = parseFloat(document.getElementById('custInvoice').value) || 0;
            let gtl = inv > 100000 ? 2398 : (inv > 50000 ? 1799 : (inv > 30000 ? 1499 : (inv > 10000 ? 1199 : (inv > 0 ? 699 : 0))));
            document.getElementById('advGtl').value = gtl > 0 ? gtl : "0";

            if (activeProductIndex !== -1) {
                let slab = updateRfcDropdown(inv, current_products[activeProductIndex].category);
                document.getElementById('advRfc').value = slab;
            }
            handleInputUpdate();
        }

        function handleInputUpdate() {
            if (activeProductIndex === -1) return;
            let p = current_products[activeProductIndex];
            let keys = ['type','limit','inv','loan','ltv','cap','target','gtl','rfc','exw','margin','dealer'];
            let ids = ['custType','custLimit','custInvoice','custLoan','custLtv','custCap','advTarget','advGtl','advRfc','advExw','advMargin','advDealer'];
            keys.forEach((k, i) => { p.inputs[k] = (k==='type') ? document.getElementById(ids[i]).value : parseFloat(document.getElementById(ids[i]).value)||0; });
            if(!document.getElementById('custLtv').value) p.inputs.ltv = 100;
            recalculateProduct(activeProductIndex);
        }

        function overrideSchemeLoan(pIndex, sKey, newLoanVal) {
            current_products[pIndex].inputs.overrides[sKey] = parseFloat(newLoanVal) > 0 ? parseFloat(newLoanVal) : undefined;
            recalculateProduct(pIndex);
        }

        function recalculateProduct(index) {
            let p = current_products[index]; let inp = p.inputs;
            let fee = (inp.type === 'EMI CARD' || inp.type === 'INSTA EMI CARD') ? 270 : (inp.type === 'W/O CARD' ? 320 : (inp.type === 'NEW' ? 850 : 0));
            let insTotal = inp.gtl + inp.rfc + inp.exw;
            let processed = [];

            let maxL = inp.limit > 0 ? inp.limit : 999999;
            let userLtv = inp.ltv > 0 ? inp.ltv : 100;

            p.rawSchemes.forEach(s => {
                let sKey = `${s.tenure}_${s.advEmi}_${s.fixedEmi}`;
                let isOverridden = inp.overrides[sKey] !== undefined;
                let loan = 0, dp = 0, emi = 0, currentTenure = s.tenure;
                let dbdRate = s.dbd * 1.18 / 100; let roiRate = s.roi / 1200; let roiRateDP = roiRate * s.advEmi;
                let totalFees = fee + inp.margin + inp.dealer + s.pf;

                if (s.fixedEmi > 0) {
                    let maxT = maxL < 999999 ? Math.floor(maxL / s.fixedEmi) + s.advEmi : 99;
                    currentTenure = inp.inv > 0 ? Math.floor(inp.inv / s.fixedEmi) : s.tenure;
                    if (currentTenure > maxT) currentTenure = maxT; if (currentTenure < 1) currentTenure = 1;
                    
                    loan = currentTenure * s.fixedEmi;
                    if (inp.target > 0) loan = Math.max(0, Math.floor(((inp.target - inp.inv - totalFees) / (dbdRate + roiRateDP - 1)) / s.fixedEmi) * s.fixedEmi);
                    if (inp.loan > 0 && !isOverridden) loan = inp.loan;
                    if (inp.inv > 0 && loan > inp.inv) loan = Math.floor(inp.inv / s.fixedEmi) * s.fixedEmi;
                    if (isOverridden) loan = inp.overrides[sKey];
                    
                    currentTenure = Math.floor(loan / s.fixedEmi) || 1;
                    let inst = currentTenure - s.advEmi; if (inst < 1) inst = 1;
                    emi = s.fixedEmi + (insTotal / inst) + (loan * roiRate);
                    dp = Math.ceil(((inp.inv||loan) - loan + (s.fixedEmi * s.advEmi) + (loan * dbdRate) + totalFees + (loan * roiRateDP)) / 10) * 10;
                } else {
                    loan = Math.min((maxL * s.tenure) / (s.tenure - s.advEmi || 1), inp.inv > 0 ? inp.inv : 999999);
                    if (inp.target > 0 && inp.inv > 0) loan = Math.min(loan, Math.max(0, (inp.target - inp.inv - totalFees) / ((s.advEmi/s.tenure) + dbdRate + roiRateDP - 1)));
                    if (inp.loan > 0 && !isOverridden) loan = inp.loan;
                    if (isOverridden) loan = inp.overrides[sKey];

                    let inst = s.tenure - s.advEmi; if (inst < 1) inst = 1;
                    let baseEmi = Math.max(900, loan / s.tenure);
                    emi = baseEmi + (insTotal / inst) + (loan * roiRate);
                    
                    if (inp.cap > 0 && emi > inp.cap && !isOverridden && inp.loan === 0) {
                        loan = Math.max(0, (inp.cap - (insTotal / inst)) / ((1 / s.tenure) + roiRate));
                        if (inp.inv > 0 && loan > inp.inv) loan = inp.inv;
                        emi = Math.max(900, loan / s.tenure) + (insTotal / inst) + (loan * roiRate);
                    }
                    dp = Math.ceil(((inp.inv||loan) - loan + (Math.max(900, loan/s.tenure) * s.advEmi) + (loan * dbdRate) + totalFees + (loan * roiRateDP)) / 10) * 10;
                }

                let ltv = currentTenure > 0 ? ((currentTenure - s.advEmi) / currentTenure) * 100 : 0;
                let daily = emi / 30;
                let boundCheck = p.isNonTieup ? (loan >= s.minLoan && loan <= s.maxLoan) : true;

                if (isOverridden || inp.loan > 0 || (ltv <= userLtv && loan > 0 && boundCheck)) {
                    processed.push({ ...s, loan, dp, emi, inst: (currentTenure - s.advEmi || 1), daily, currentTenure, ltv, sKey });
                }
            });

            p.calculatedData = processed.sort((a, b) => b.ltv - a.ltv);
            renderFinalCalculation();
        }

        function renderFinalCalculation() {
            let container = document.getElementById('productsContainer');
            container.innerHTML = "";

            current_products.forEach((p, index) => {
                let isActive = (index === activeProductIndex);
                let missingElig = (!p.inputs.type || p.inputs.type === "");
                let fee = (p.inputs.type === 'EMI CARD' || p.inputs.type === 'INSTA EMI CARD') ? 270 : (p.inputs.type === 'W/O CARD' ? 320 : (p.inputs.type === 'NEW' ? 850 : 0));
                
                let html = `<div style="margin-bottom: ${isActive ? '8px' : '4px'};">
                    <div class="product-header ${isActive ? 'active' : ''}" onclick="switchActiveProduct(${index})">
                        <div style="display:flex; align-items:center; gap:8px;"><span>${isActive ? '▼' : '▶'}</span><span>📱 ${p.name.replace('NON TIEUP - ','')}</span></div>
                        <button class="remove-btn" onclick="removeProduct(${index}, event)">✖</button>
                    </div>
                    <div class="product-body" style="display: ${isActive ? 'block' : 'none'};">`;

                if (missingElig) html += `<div class="alert-banner">⚠️ Eligibility Details Missing! Base calculation applied.</div>`;

                html += `<div class="info-bar">
                    <span>Type: <b>${p.inputs.type || '-'}</b></span> | <span>Limit: <b>₹${p.inputs.limit.toLocaleString()}</b></span> | <span>LTV: <b>${p.inputs.ltv}%</b></span><br>
                    <span>Inv: <b style="color:#27ae60;">₹${p.inputs.inv.toLocaleString()}</b></span> | <span>Target: <b>₹${p.inputs.target.toLocaleString()}</b></span> | <span>Fee: <b style="color:#e67e22;">₹${fee}</b></span>
                </div>`;

                html += `<table class="scheme-table">
                            <thead><tr><th style="width:15%;">T/A</th><th style="width:25%;">LOAN (₹)</th><th style="width:22%;">DP</th><th style="width:25%;">EMI</th><th style="width:13%;">ACT</th></tr></thead>
                            <tbody>`;
                
                if (p.calculatedData.length > 0) {
                    html += p.calculatedData.map((s, i) => `
                        <tr class="row-main">
                            <td style="color:var(--indigo); font-size:12px;">${s.currentTenure}/${s.advEmi}</td>
                            <td><input type="number" class="loan-input" value="${Math.floor(s.loan)}" onchange="overrideSchemeLoan(${index}, '${s.sKey}', this.value)"></td>
                            <td style="color:#27ae60; font-size:11px;">₹${Math.round(s.dp).toLocaleString()}</td>
                            <td style="color:#0984e3; line-height:1.1; font-size:11px;">₹${Math.round(s.emi).toLocaleString()}<br><span style="font-size:8px;color:#666;">x${s.inst}M</span></td>
                            <td><button class="btn-action" onclick="copyText(${index}, ${i}, this)">COPY</button></td>
                        </tr>
                        <tr class="row-sub">
                            <td colspan="5">
                                <b>DBD:</b> ${parseFloat(s.dbd.toFixed(2))}% (₹${Math.round(s.loan * (s.dbd * 1.18 / 100))}) | <b>PF:</b> ₹${s.pf} | <b>ROI:</b> ${parseFloat(s.roi.toFixed(2))}% | <b>FIX:</b> ${s.fixedEmi>0?'₹'+s.fixedEmi:'No'} | <b style="color:#27ae60;">DAILY SAVE: ₹${Math.round(s.daily)}</b>
                            </td>
                        </tr>`).join('');
                } else {
                    html += `<tr><td colspan="5" style="color:red; padding:15px;">No eligible schemes found (Check LTV or Limits).</td></tr>`;
                }
                html += `</tbody></table></div></div>`;
                container.innerHTML += html;
            });
        }

        // Modals Logic
        function openNonTieupModal() {
            let cats = [...new Set(db_records.filter(r=>r.model==='NON TIEUP').map(r=>r.category))].filter(Boolean);
            if(!cats.length) cats = ["PHONE(WEB-MOBILE)", "LED TV", "REFRIGERATOR", "WASHING MACHINE", "AC", "OTHER"];
            document.getElementById('ntCategory').innerHTML = cats.map(c=>`<option value="${c}">${c}</option>`).join('');
            document.getElementById('nonTieupModal').style.display='flex'; 
        }
        function openManualModal() { document.getElementById('manualModal').style.display='flex'; }
        
        function addNonTieupProduct() {
            selectModel('NON TIEUP', true, document.getElementById('ntCategory').value);
            document.getElementById('nonTieupModal').style.display='none';
        }
        function addManualProduct() {
            let name = document.getElementById('manProdName').value.trim().toUpperCase() || 'MANUAL SCHEME';
            let ten = parseInt(document.getElementById('manTen').value)||0, adv = parseInt(document.getElementById('manAdv').value)||0, fix = parseInt(document.getElementById('manFix').value)||0;
            if(ten === 0 && fix === 0) { alert("Enter valid Tenure or Fixed EMI"); return; }
            let man = [{ tenure: ten, advEmi: adv, dbd: parseFloat(document.getElementById('manDbd').value)||0, pf: parseInt(document.getElementById('manPf').value)||0, roi: parseFloat(document.getElementById('manRoi').value)||0, fixedEmi: fix }];
            document.getElementById('manualModal').style.display='none';
            ['manProdName','manTen','manAdv','manDbd','manPf','manRoi','manFix'].forEach(id=>document.getElementById(id).value='');
            selectModel(name, false, 'OTHER', man);
        }

        function copyText(pIndex, sIndex, btn) {
            let p = current_products[pIndex]; let s = p.calculatedData[sIndex];
            let txt = `📱 *${p.name.replace('NON TIEUP - ','')}*\n\n👤 *ELIGIBILITY:*\n*Type:* ${p.inputs.type||'N/A'} | *Limit:* ₹${p.inputs.limit.toLocaleString()} | *LTV:* ${p.inputs.ltv}%\n${p.inputs.inv>0?`*Invoice:* ₹${p.inputs.inv.toLocaleString()}\n`:''}`;
            txt += `------------------------\n✅ *Scheme:* ${s.currentTenure}/${s.advEmi}\n💰 *DP:* ₹${Math.round(s.dp).toLocaleString()}\n🗓️ *EMI:* ₹${Math.round(s.emi).toLocaleString()} x ${s.inst} Months\n✨ *Daily Save:* ₹${Math.round(s.daily).toLocaleString()}`;
            if(navigator.clipboard) {
                navigator.clipboard.writeText(txt).then(()=>{
                    let old = btn.innerText; btn.innerText="COPIED"; btn.style.background="#27ae60";
                    setTimeout(()=>{btn.innerText=old;btn.style.background="#0984e3";},2000);
                });
            }
        }

        function copyImage() {
            if(activeProductIndex === -1) return;
            let p = current_products[activeProductIndex]; if(!p.calculatedData.length) return;
            let btn = document.querySelector('.btn-copy-img'); let oldBtn = btn.innerHTML; btn.innerHTML = "⏳ COPYING...";

            let div = document.createElement('div');
            div.style.cssText = "width:750px; position:absolute; left:-9999px; background:#fff; font-family:sans-serif; padding:20px;";
            
            let missingElig = (!p.inputs.type || p.inputs.type === "");
            let alertHtml = missingElig ? `<div style="background:#ffebee; color:#c62828; text-align:center; padding:12px; font-size:16px; font-weight:bold; margin-bottom:15px; border-radius:6px; border:2px solid #ef9a9a;">⚠️ Eligibility Details Missing! Base calculation applied.</div>` : '';

            let trs = p.calculatedData.map((s,i) => `
                <tr style="background:${i%2===0?'#fff':'#f8fafc'};">
                    <td style="padding:15px 10px; font-size:24px; font-weight:900; color:#1e293b; border-bottom:1px solid #e2e8f0;">${s.currentTenure}/${s.advEmi}</td>
                    <td style="padding:15px 10px; font-size:24px; font-weight:900; color:#27ae60; border-bottom:1px solid #e2e8f0;">₹${Math.round(s.dp).toLocaleString()}</td>
                    <td style="padding:15px 10px; font-size:24px; font-weight:900; color:#0984e3; border-bottom:1px solid #e2e8f0;">₹${Math.round(s.emi).toLocaleString()}</td>
                    <td style="padding:15px 10px; font-size:24px; font-weight:900; color:#333; border-bottom:1px solid #e2e8f0;">${s.inst}</td>
                    <td style="padding:15px 10px; font-size:24px; font-weight:900; color:#27ae60; border-bottom:1px solid #e2e8f0;">₹${Math.round(s.daily).toLocaleString()}</td>
                </tr>`).join('');

            div.innerHTML = `
                ${alertHtml}
                <div style="border:3px solid #034887; border-radius:12px; overflow:hidden;">
                    <div style="background:#034887; color:#fff; padding:25px; text-align:center;">
                        <div style="font-size:28px; font-weight:900; margin-bottom:10px; word-wrap:break-word; line-height:1.3; padding:0 10px;">📱 ${p.name.replace('NON TIEUP - ','').toUpperCase()}</div>
                        <div style="display:flex; justify-content:space-evenly; font-size:18px; font-weight:bold; color:#e0f2fe;">
                            <span>TYPE: <span style="color:#f1c40f;">${p.inputs.type||'N/A'}</span></span>
                            <span>LIMIT: <span style="color:#2ecc71;">₹${p.inputs.limit.toLocaleString()}</span></span>
                            <span>LTV: <span style="color:#fff;">${p.inputs.ltv}%</span></span>
                        </div>
                        ${p.inputs.inv>0 ? `<div style="margin-top:12px; font-size:20px; font-weight:900;">INVOICE: ₹${p.inputs.inv.toLocaleString()}</div>`:''}
                    </div>
                    <table style="width:100%; border-collapse:collapse; text-align:center;">
                        <thead style="background:#f1f5f9; color:#334155;">
                            <tr>
                                <th style="padding:18px 10px; font-size:18px; font-weight:900; border-bottom:2px solid #cbd5e1;">SCHEME<br><span style="font-size:14px; font-weight:normal;">(T / A)</span></th>
                                <th style="padding:18px 10px; font-size:18px; font-weight:900; border-bottom:2px solid #cbd5e1;">NET&nbsp;DP</th>
                                <th style="padding:18px 10px; font-size:18px; font-weight:900; border-bottom:2px solid #cbd5e1;">EMI</th>
                                <th style="padding:18px 10px; font-size:18px; font-weight:900; border-bottom:2px solid #cbd5e1;">MONTHS</th>
                                <th style="padding:18px 10px; font-size:18px; font-weight:900; border-bottom:2px solid #cbd5e1;">DAILY&nbsp;SAVE</th>
                            </tr>
                        </thead>
                        <tbody>${trs}</tbody>
                    </table>
                </div>`;
            
            document.body.appendChild(div);
            setTimeout(() => {
                html2canvas(div, { scale: 2, useCORS: true, backgroundColor: "#ffffff", logging: false }).then(canvas => {
                    canvas.toBlob(blob => {
                        navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]).then(() => {
                            btn.innerHTML = "✅ COPIED"; 
                            setTimeout(() => { btn.innerHTML = oldBtn; }, 2000); 
                            document.body.removeChild(div);
                        }).catch(e => { btn.innerHTML = "⚠️ ERROR"; document.body.removeChild(div); });
                    }, "image/png");
                });
            }, 300);
        }

        window.onload = loadExcelData;
    </script>
