<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Search & Scheme Chart</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 30px; 
            text-align: center; 
            background-color: #f4f7f6; 
        }
        h2 { color: #034887; }
        
        .search-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        
        input { 
            width: 100%; 
            padding: 15px; 
            font-size: 16px; 
            box-sizing: border-box; 
            border: 2px solid #0984e3; 
            border-radius: 6px; 
            outline: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        
        input:focus { border-color: #034887; }

        #searchResults { 
            position: absolute; 
            top: 100%; 
            left: 0; 
            right: 0; 
            background: white; 
            max-height: 250px; 
            overflow-y: auto; 
            border: 1px solid #ccc; 
            border-top: none;
            border-radius: 0 0 6px 6px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); 
            display: none; 
            z-index: 100; 
            text-align: left; 
        }

        .result-item { 
            padding: 12px 15px; 
            border-bottom: 1px solid #eee; 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: bold; 
            color: #333; 
        }

        .result-item:hover { 
            background: #e3f2fd; 
            color: #0984e3; 
        }

        #selectedProduct { 
            margin-top: 30px; 
            font-size: 22px; 
            font-weight: 900; 
            color: #27ae60; 
            display: none; 
        }

        #loadingStatus {
            color: #e67e22;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 10px;
        }

        /* टेबलची डिझाईन */
        .scheme-table {
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
            display: none; 
        }

        .scheme-table th {
            background: #0984e3;
            color: white;
            padding: 12px;
            font-size: 14px;
        }

        .scheme-table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        .scheme-table tr:hover { background: #f8fafc; }
    </style>
</head>
<body>

    <h2>🔍 Search Product & Schemes</h2>
    
    <div id="loadingStatus">⏳ Loading Master Data... Please wait.</div>

    <div class="search-container">
        <input type="text" id="searchInput" onkeyup="searchModel()" placeholder="Type model name here..." disabled>
        <div id="searchResults"></div>
    </div>

    <div id="selectedProduct"></div>
    
    <!-- स्कीम्स दिसण्यासाठी टेबल -->
    <table id="schemeTable" class="scheme-table">
        <thead>
            <tr>
                <th>LTV %</th>
                <th>Scheme (T/A)</th>
                <th>DBD %</th>
                <th>PF</th>
                <th>ROI %</th>
                <th>Fixed EMI</th>
            </tr>
        </thead>
        <tbody id="schemeBody">
            <!-- डायनॅमिक डेटा इथे येईल -->
        </tbody>
    </table>

    <script>
        let db_records = [];
        const GITHUB_RAW_URL = "https://raw.githubusercontent.com/luckyjathar/testcalculator/main/master_data.xlsx";

        function findKey(row, targets) {
            let key = Object.keys(row).find(k => targets.includes(k.toUpperCase().replace(/\s/g, '')));
            return key ? row[key] : null;
        }

        async function loadExcelData() {
            try {
                let res = await fetch(GITHUB_RAW_URL + '?t=' + new Date().getTime());
                let dataBuffer = await res.arrayBuffer();
                let wb = XLSX.read(new Uint8Array(dataBuffer), { type: 'array' });
                
                let sheetData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
                
                db_records = sheetData.map(row => {
                    let model = findKey(row, ['MODEL', 'PRODUCT', 'MODELNAME']);
                    return { 
                        model: model ? String(model).trim().toUpperCase() : "",
                        tenure: parseInt(findKey(row, ['TOTALTENURE', 'TENURE', 'TA'])) || 0,
                        advEmi: parseInt(findKey(row, ['ADVANCEEMI', 'ADV'])) || 0,
                        dbd: parseFloat(findKey(row, ['DBD', 'DBD%'])) || 0,
                        roi: parseFloat(findKey(row, ['ROI', 'ROI%'])) || 0,
                        pf: parseInt(findKey(row, ['PF', 'PROCESSINGFEE'])) || 0,
                        fixedEmi: parseFloat(findKey(row, ['FIXEDEMI', 'FIXED'])) || 0
                    };
                }).filter(x => x.model !== "");
                
                document.getElementById('loadingStatus').style.display = 'none';
                document.getElementById('searchInput').disabled = false;
                document.getElementById('searchInput').placeholder = "Start typing model name...";
                document.getElementById('searchInput').focus();

            } catch(err) {
                console.error("Error loading Excel:", err);
                document.getElementById('loadingStatus').innerText = "⚠️ Error loading data. Please refresh.";
                document.getElementById('loadingStatus').style.color = "red";
            }
        }

        function searchModel() {
            let q = document.getElementById('searchInput').value.toUpperCase().trim();
            let resultsDiv = document.getElementById('searchResults');
            
            if (!q) { resultsDiv.style.display = 'none'; return; }
            
            let matches = db_records.filter(r => r.model.includes(q)).map(r => r.model);
            matches = [...new Set(matches)].slice(0, 15); 
            
            if (matches.length === 0) {
                resultsDiv.innerHTML = '<div style="padding:15px; color:red; font-size: 13px; text-align:center;">No matching models found.</div>';
            } else {
                resultsDiv.innerHTML = matches.map(m => 
                    `<div class="result-item" onclick="selectModel('${m.replace(/'/g, "\\'")}')">📱 ${m}</div>`
                ).join('');
            }
            resultsDiv.style.display = 'block';
        }

        function selectModel(modelName) {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchResults').style.display = 'none';
            
            let displayBox = document.getElementById('selectedProduct');
            displayBox.innerText = "✅ " + modelName;
            displayBox.style.display = 'block';

            let schemes = db_records.filter(r => r.model === modelName);
            
            // 1. प्रत्येक स्कीमचा LTV कॅल्क्युलेट करून सेव्ह करणे
            schemes.forEach(s => {
                s.ltv = s.tenure > 0 ? ((s.tenure - s.advEmi) / s.tenure) * 100 : 0;
            });

            // 2. LTV नुसार स्कीम्स उतरत्या क्रमाने (Descending Order) सॉर्ट करणे
            schemes.sort((a, b) => b.ltv - a.ltv);
            
            let tbody = document.getElementById('schemeBody');
            tbody.innerHTML = schemes.map(s => {
                let fixedEmiDisplay = s.fixedEmi > 0 ? "₹" + s.fixedEmi : "N/A";
                
                return `
                    <tr>
                        <td style="color: #034887; font-weight: 900; font-size: 16px;">${Math.round(s.ltv)}%</td>
                        <td style="color: var(--indigo); font-size: 16px; font-weight: 900;">${s.tenure} / ${s.advEmi}</td>
                        <td>${s.dbd}%</td>
                        <td>₹${s.pf}</td>
                        <td>${s.roi}%</td>
                        <td style="color: #d35400;">${fixedEmiDisplay}</td>
                    </tr>
                `;
            }).join('');

            document.getElementById('schemeTable').style.display = 'table';
        }

        window.onload = loadExcelData;
    </script>

</body>
</html>
