<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Financial Portal - Bajaj Edition</title>

    <!-- SheetJS CDN for Live Excel Reading -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- html2canvas CDN for High-Quality Quote Image Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bajaj-navy-dark: #001b30;
            --bajaj-navy: #002b49;
            --bajaj-navy-light: #063d66;
            --bajaj-blue: #0072ce;
            --bajaj-sky: #00a3e0;
            --bajaj-cyan: #38bdf8;
            --bajaj-orange: #f37021;
            --bajaj-orange-hover: #d95d13;
            --bajaj-mint: #00a86b;
            --bajaj-card-bg: #03233c;
            --border-blue: #0f4d7a;
            --text-light: #f0f7fd;
            --text-muted: #8bb4d6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bajaj-navy-dark);
            color: var(--text-light);
            padding: 12px;
            padding-bottom: 90px;
            display: flex;
            justify-content: center;
        }

        .main-wrapper {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* 1. SCENARIO CARD */
        .scenario-card {
            background-color: var(--bajaj-card-bg);
            border: 2px solid var(--border-blue);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 27, 48, 0.7);
        }

        .scenario-header {
            background: linear-gradient(135deg, var(--bajaj-navy) 0%, var(--bajaj-blue) 100%);
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            border-bottom: 2px solid var(--bajaj-sky);
        }

        .scenario-title {
            font-size: 20px;
            font-weight: 900;
            font-style: italic;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: 800;
            cursor: pointer;
            background: var(--bajaj-mint);
            color: #ffffff;
            box-shadow: 0 2px 6px rgba(0, 168, 107, 0.4);
            transition: 0.2s ease;
        }

        .scenario-table {
            width: 100%;
            border-collapse: collapse;
        }

        .scenario-table tr {
            border-bottom: 1px solid #083454;
        }

        .scenario-table tr:last-child {
            border-bottom: none;
        }

        .scenario-table td {
            padding: 10px 14px;
            vertical-align: middle;
        }

        .scenario-table td.label-col {
            width: 50%;
            color: var(--text-light);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.5px;
            border-right: 1px solid #083454;
        }

        .scenario-table td.input-col {
            width: 50%;
            padding: 6px 10px;
        }

        .form-input, .form-select {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: 800;
            text-align: center;
        }

        .form-select {
            cursor: pointer;
            background-color: var(--bajaj-card-bg);
        }

        option {
            background-color: var(--bajaj-navy);
            color: #ffffff;
        }

        /* 2. SEARCH CARD & QUICK BUTTONS */
        .search-card {
            background: var(--bajaj-card-bg);
            border: 2px solid var(--border-blue);
            border-radius: 8px;
            padding: 12px;
            position: relative;
        }

        .search-title {
            font-size: 12px;
            font-weight: 800;
            color: var(--bajaj-sky);
            text-transform: uppercase;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid var(--border-blue);
            background: #021a2d;
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--bajaj-blue);
            box-shadow: 0 0 8px rgba(0, 114, 206, 0.4);
        }

        .quick-action-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .quick-btn {
            flex: 1;
            padding: 8px 6px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.2s ease;
            text-align: center;
        }

        .btn-sheet2 {
            background: var(--bajaj-navy);
            border: 1px solid var(--bajaj-sky);
            color: var(--bajaj-sky);
        }

        .btn-sheet2:hover {
            background: var(--bajaj-blue);
            color: #ffffff;
        }

        .btn-manual-prod {
            background: #003622;
            border: 1px solid var(--bajaj-mint);
            color: #34d399;
        }

        .btn-manual-prod:hover {
            background: var(--bajaj-mint);
            color: #ffffff;
        }

        .dropdown-list {
            position: absolute;
            left: 12px;
            right: 12px;
            top: 100%;
            background: #022038;
            border: 1px solid var(--bajaj-blue);
            border-radius: 6px;
            max-height: 240px;
            overflow-y: auto;
            z-index: 50;
            display: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.7);
            margin-top: 4px;
        }

        .dropdown-item {
            padding: 10px 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            border-bottom: 1px solid #09375b;
        }

        .dropdown-item:hover {
            background: var(--bajaj-navy);
            color: var(--bajaj-sky);
        }

        /* 3. PRODUCT PANELS */
        .product-panel {
            background: var(--bajaj-card-bg);
            border: 2px solid var(--border-blue);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 14px;
            box-shadow: 0 4px 15px rgba(0, 27, 48, 0.5);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            padding-bottom: 6px;
        }

        .panel-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-title {
            font-size: 15px;
            font-weight: 900;
            color: var(--bajaj-orange);
        }

        .panel-inv-badge {
            background: var(--bajaj-blue);
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 900;
        }

        .btn-panel-action {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .btn-action-sm {
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-add-scheme { background: var(--bajaj-mint); color: white; }
        .btn-quote { background: var(--bajaj-blue); color: white; }
        .btn-remove { background: #dc2626; color: white; }

        .sub-config-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            background: #021a2d;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #0a3d66;
            margin-top: 8px;
            margin-bottom: 10px;
        }

        .sub-config-grid label {
            font-size: 10px;
            font-weight: 800;
            color: var(--text-muted);
            display: block;
            margin-bottom: 2px;
        }

        .sub-config-grid input, .sub-config-grid select {
            width: 100%;
            background: var(--bajaj-card-bg);
            border: 1px solid var(--border-blue);
            color: #fff;
            padding: 6px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            outline: none;
        }

        .sub-config-grid input:focus, .sub-config-grid select:focus {
            border-color: var(--bajaj-sky);
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        .scheme-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            text-align: center;
            white-space: nowrap;
        }

        .scheme-table th {
            background: var(--bajaj-navy);
            color: #ffffff;
            padding: 8px 3px;
            border: 1px solid var(--border-blue);
            font-weight: 800;
        }

        .scheme-table td {
            padding: 7px 3px;
            border: 1px solid #083454;
            font-weight: 700;
        }

        .scheme-checkbox {
            width: 15px;
            height: 15px;
            cursor: pointer;
            accent-color: var(--bajaj-sky);
        }

        .action-btn-group {
            display: inline-flex;
            gap: 3px;
            justify-content: center;
            align-items: center;
        }

        .action-icon-btn {
            border: none;
            padding: 3px 5px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: 900;
            cursor: pointer;
            line-height: 1;
        }

        .btn-copy-mini { background: var(--bajaj-blue); color: white; }
        .btn-edit-mini { background: var(--bajaj-orange); color: #fff; }
        .btn-toggle-mini { padding: 3px 5px; }
        .btn-dis { background: #fee2e2; color: #dc2626; }
        .btn-ena { background: #d1fae5; color: var(--bajaj-mint); }
        .row-disabled { opacity: 0.35; text-decoration: line-through; background: #001220; }

        /* MODAL STYLES */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 15, 28, 0.88);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .modal-content {
            background: var(--bajaj-card-bg);
            border: 2px solid var(--bajaj-blue);
            border-radius: 8px;
            padding: 14px;
            max-width: 520px;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
        }

        .copy-hint-box {
            background: var(--bajaj-blue);
            color: #ffffff;
            padding: 9px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 10px;
        }

        /* 4. FOOTER BAR */
        .app-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bajaj-card-bg);
            border-top: 2px solid var(--bajaj-blue);
            padding: 8px 12px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .footer-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 800;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .footer-btn.active, .footer-btn:hover {
            color: var(--bajaj-sky);
        }

        /* HISTORY CARD */
        .history-card {
            background: #021a2d;
            border: 1px solid var(--border-blue);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            text-align: left;
        }
        .history-time { font-size: 10px; color: var(--text-muted); margin-bottom: 4px; }
        .history-title { font-size: 15px; font-weight: 900; color: var(--bajaj-orange); }
        .history-tags { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
        .history-tag { font-size: 10px; font-weight: bold; background: var(--bajaj-navy); color: var(--bajaj-sky); padding: 2px 6px; border-radius: 3px; }
        .history-actions { display: flex; gap: 8px; margin-top: 8px; }

        .export-textarea {
            width: 100%;
            height: 160px;
            background: #021a2d;
            border: 1px solid var(--border-blue);
            color: #34d399;
            font-family: monospace;
            font-size: 11px;
            padding: 8px;
            border-radius: 6px;
            outline: none;
            white-space: pre;
            overflow-x: auto;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        
        <!-- 1. SCENARIO CARD -->
        <div class="scenario-card">
            <div class="scenario-header">
                <span class="scenario-title">⚡ SCENARIO</span>
                <span id="dataStatusBadge" class="status-badge" onclick="fetchFromMasterStream(true)">CHECKING...</span>
            </div>
            <table class="scenario-table">
                <tr>
                    <td class="label-col">CUSTOMER TYPE</td>
                    <td class="input-col">
                        <select class="form-select" id="typeVal" autocomplete="off" onchange="recalcAllProducts()">
                            <option value="" selected>-</option>
                            <option value="NEW">NEW</option>
                            <option value="EMI CARD">EMI CARD</option>
                            <option value="VIRTUAL CARD">VIRTUAL CARD</option>
                            <option value="W/O CARD">W/O CARD</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td class="label-col">APPROVED</td>
                    <td class="input-col">
                        <input type="number" class="form-input" id="approvedVal" placeholder="-" autocomplete="off" oninput="recalcAllProducts()">
                    </td>
                </tr>
                <tr>
                    <td class="label-col">MAX LTV (%)</td>
                    <td class="input-col">
                        <input type="number" min="0" max="100" class="form-input" id="maxLtvVal" placeholder="100" autocomplete="off" oninput="validateMaxLtvInput(this); recalcAllProducts()">
                    </td>
                </tr>
                <tr>
                    <td class="label-col">CAPPING</td>
                    <td class="input-col">
                        <input type="number" class="form-input" id="cappingVal" placeholder="-" autocomplete="off" oninput="recalcAllProducts()">
                    </td>
                </tr>
            </table>
        </div>

        <!-- 2. SEARCH & QUICK BUTTONS -->
        <div class="search-card">
            <div class="search-title">🔍 Add Product / Model</div>
            <input type="text" id="modelSearchInput" class="search-input" placeholder="Loading master data..." onfocus="showRecentSearchesIfEmpty()" oninput="handleModelSearch(this.value)" autocomplete="off" disabled>
            <div id="modelDropdown" class="dropdown-list"></div>

            <div class="quick-action-row">
                <button type="button" class="quick-btn btn-sheet2" onclick="openCategorySelectionForSheet2()">
                    📂 OPEN SCHEMES (CATEGORY)
                </button>
                <button type="button" class="quick-btn btn-manual-prod" onclick="addNewManualProductPrompt()">
                    ➕ MANUAL PRODUCT
                </button>
            </div>
        </div>

        <!-- 3. SELECTED PRODUCTS CONTAINER -->
        <div id="selectedProductsContainer"></div>

    </div>

    <!-- 📋 EXPORT FOR MASTER DATA MODAL -->
    <div id="exportModal" class="modal-overlay">
        <div class="modal-content">
            <div style="font-size:16px; font-weight:900; color:var(--bajaj-mint); margin-bottom:6px; text-align:center;">
                📋 EXPORT MANUAL DATA FOR MASTER EXCEL
            </div>
            <div style="font-size:11px; color:var(--text-muted); text-align:center; margin-bottom:12px;">
                Matches Master Data Columns: <b>MODEL | BRAND | CATEGORY | MRP | TOTAL TENURE | ADVANCE EMI | DBD% | PF | ROI%</b>
            </div>

            <textarea id="masterExportText" class="export-textarea" readonly placeholder="No unsynced manual models or schemes found."></textarea>

            <div style="display:flex; gap:8px; margin-top:12px;">
                <button onclick="copyMasterExportText()" style="flex:1; background:var(--bajaj-blue); color:white; padding:9px; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">
                    📋 COPY FOR EXCEL
                </button>
                <button onclick="markManualDataAsSynced()" style="flex:1; background:var(--bajaj-mint); color:white; padding:9px; border:none; border-radius:4px; font-weight:bold; cursor:pointer;" title="Removes items once added to Excel">
                    ✅ MARK SYNCED / REMOVE
                </button>
            </div>
            <button onclick="document.getElementById('exportModal').style.display='none'" style="width:100%; background:var(--border-blue); color:white; border:none; padding:8px; border-radius:4px; font-weight:bold; margin-top:8px; cursor:pointer;">
                CLOSE
            </button>
        </div>
    </div>

    <!-- ✏️ EDIT SCHEME COMPONENTS & LOAN OVERRIDE MODAL -->
    <div id="editSchemeModal" class="modal-overlay">
        <div class="modal-content">
            <div style="font-size:16px; font-weight:900; color:var(--bajaj-orange); margin-bottom:6px; text-align:center;">
                ✏️ EDIT SCHEME & LOAN AMOUNT
            </div>
            <div id="editSchemeSubTitle" style="font-size:11px; color:var(--text-muted); text-align:center; margin-bottom:12px;"></div>
            
            <input type="hidden" id="editTargetProdId">
            <input type="hidden" id="editTargetSchemeId">

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;">
                <div style="grid-column: span 2; background:#021a2d; padding:8px; border-radius:6px; border:1px solid var(--bajaj-sky);">
                    <label style="font-size:11px; color:var(--bajaj-sky); font-weight:bold; display:block; margin-bottom:3px;">
                        💰 CUSTOM LOAN AMOUNT (₹) [Leave 0 for Auto-Calculate]:
                    </label>
                    <input type="number" id="editCustomLoan" placeholder="0" style="width:100%; background:var(--bajaj-card-bg); border:1p
